<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { const r = document.documentElement, t = localStorage.getItem('matematica-tema'), z = localStorage.getItem('matematica-zoom'); if (t === 'dark') r.dataset.theme = 'dark'; if (['115', '130', '150'].includes(z)) r.dataset.zoom = z; } catch (e) {}</script>
<title>Identità ed equazioni – Lezione 1</title>
<link rel="stylesheet" href="../../assets/fonts/lezioni.css">
<style>
:root {
	--bg: #F3F6F9;
	--grid: #E2E8EF;
	--panel: #FFFFFF;
	--ink: #17212E;
	--ink2: #4A5566;
	--line: #D3DBE4;
	--acc: #2A4DB5;
	--on-acc: #FFFFFF;
	--acc-fill: rgba(42, 77, 181, 0.08);
	--acc-soft: rgba(42, 77, 181, 0.30);
	--two: #B35C00;
	--in: #13804A;
	--in-bg: #DFF3E7;
	--out: #BE3131;
	--out-bg: #FBE3E3;
	--hl: #FFEFA8;
	--hover: #EAF0F8;
	--chip: #F3F6F9;
	--focus: #2A4DB5;
	--ctl: #8C9AAB;
	--shadow: rgba(0, 0, 0, 0.25);
	--ui: "Lexend", system-ui, "Segoe UI", Roboto, sans-serif;
	--math: "STIX Two Text", "STIX Two Math", "Cambria Math", "DejaVu Serif", "Noto Sans Math", Cambria, "Times New Roman", serif;
}
:root[data-theme="dark"] {
	color-scheme: dark;
	--bg: #0F141A;
	--grid: #19212B;
	--panel: #161D26;
	--ink: #E6EBF1;
	--ink2: #A8B3C0;
	--line: #2A3440;
	--acc: #86A5F7;
	--on-acc: #0F141A;
	--acc-fill: rgba(134, 165, 247, 0.10);
	--acc-soft: rgba(134, 165, 247, 0.34);
	--two: #F2A65A;
	--in: #4FC98C;
	--in-bg: #173327;
	--out: #FF7C7C;
	--out-bg: #3A1D20;
	--hl: #3D3517;
	--hover: #1E2835;
	--chip: #1B232E;
	--focus: #86A5F7;
	--ctl: #56657A;
	--shadow: rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(14px, min(1.05vw, 1.9vh), 21px); }
body {
	margin: 0; height: 100%;
	background-color: var(--bg);
	background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
	background-size: 24px 24px;
	color: var(--ink); font-family: var(--ui); line-height: 1.4;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; max-width: 1800px; margin: 0 auto; padding: 0.8rem 16px 0.9rem; display: flex; flex-direction: column; gap: 0.7rem; }

/* ---------- barra in alto ---------- */
header.top { display: flex; align-items: center; gap: 0.6rem 2rem; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; min-width: 10.5ch; white-space: nowrap; }
.prog { flex: 1; display: flex; gap: 0.7rem; min-width: 0; }
.pch { flex: var(--n) 1 0; min-width: max-content; display: flex; flex-direction: column; gap: 0.1rem; }
.segs { display: flex; gap: 3px; }
.seg { flex: 1; min-width: 0; height: 1.5rem; padding: 0; border: 0; background: none; cursor: pointer; position: relative; border-radius: 4px; }
.seg::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 0.5rem; transform: translateY(-50%); border-radius: 3px; background: var(--line); }
.seg.done::before { background: var(--acc-soft); }
.seg.cur::before { background: var(--acc); height: 0.75rem; }
.pname { font-size: 0.95rem; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pch.cur .pname { color: var(--ink); font-weight: 700; }
#theme { flex: none; width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; font-size: 1.3rem; line-height: 1; padding: 0; }
#theme:hover { border-color: var(--acc); }
.tools { flex: none; display: flex; align-items: center; gap: 0.5rem; position: relative; }   /* il pannello dello zoom si allinea al bordo destro dei due bottoni */
.zmenu { position: static; }
#homeBtn { width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); color: var(--ink); display: grid; place-items: center; }
#homeBtn:hover { border-color: var(--acc); }
#homeBtn svg { width: 1.4rem; height: 1.4rem; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#zoomBtn { width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; padding: 0; display: grid; place-items: center; }
#zoomBtn:hover, #zoomBtn[aria-expanded="true"] { border-color: var(--acc); }
#zoomBtn svg { width: 1.45rem; height: 1.45rem; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.zpanel { position: absolute; top: calc(100% + 0.6rem); right: 0; z-index: 30; width: min(21rem, calc(100vw - 2rem)); padding: 0.8rem 0.9rem 0.9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px var(--shadow); }
.zhead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.55rem; font-weight: 700; }
.zhead button { width: 2.4rem; height: 2.4rem; min-width: 40px; min-height: 40px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; padding: 0; display: grid; place-items: center; }
.zhead button svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.zopts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
.zopts label { position: relative; display: grid; place-items: center; min-height: 44px; border: 2px solid var(--ctl); border-radius: 10px; cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; }
.zopts input { position: absolute; opacity: 0; pointer-events: none; }
.zopts label:has(input:checked) { border-color: var(--acc); background: var(--acc-fill); color: var(--acc); }
.zopts label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
:root[data-zoom="115"] main.step { zoom: 1.15; }
:root[data-zoom="130"] main.step { zoom: 1.3; }
:root[data-zoom="150"] main.step { zoom: 1.5; }

/* ---------- il passo ---------- */
main.step { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 1.4rem; }
.left { display: flex; flex-direction: column; gap: 0.75rem; min-height: 0; overflow: auto; padding: 0.2rem 0.3rem 0.2rem 0; }
.left h2 { margin: 0; font-size: 1.9rem; line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; }
.txt { font-size: 1.35rem; line-height: 1.45; }
.txt p { margin: 0 0 0.45em; }
.txt p:last-child { margin-bottom: 0; }
.def { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--acc); border-radius: 0 12px 12px 0; padding: 0.6rem 1rem 0.7rem; margin-bottom: 0.5em; }
.def .dl { font-size: 0.95rem; letter-spacing: 0.01em; font-weight: 700; color: var(--acc); margin-bottom: 0.15rem; }
.def p { margin: 0 0 0.3em; }

/* 1.08em: le cifre di STIX hanno la stessa altezza di quelle di Lexend, così i numeri nel testo e nelle formule sono uguali */
.m { font-family: var(--math); font-size: 1.08em; line-height: 1; white-space: nowrap; }
.m .m { font-size: 1em; }
.m i, i.m { font-style: italic; }
.m sup { font-size: 0.64em; line-height: 0; }
b { font-weight: 700; }
.frac { display: inline-flex; flex-direction: column; align-items: stretch; text-align: center; vertical-align: middle; line-height: 1.1; margin: 0 0.1em; }
.frac > span { padding: 0 0.15em; }
.frac > span:first-child { border-bottom: 0.06em solid currentColor; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.8rem; min-height: 0; overflow: auto; }
.fig { flex: 1 1 auto; min-height: 7rem; position: relative; }
.fig > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.col { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; min-height: 0; }
.ctl { display: flex; gap: 0.8rem; justify-content: center; align-items: center; flex-wrap: wrap; }
.fb { margin: 0; padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 1.25rem; border-left: 5px solid; }
.fb.ok { background: var(--in-bg); border-color: var(--in); }
.fb.no { background: var(--out-bg); border-color: var(--out); }

/* bottoni */
.btn { font-size: 1.25rem; font-weight: 500; min-height: max(3rem, 44px); min-width: max(3rem, 44px); padding: 0 1.2rem; border-radius: 12px; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; box-shadow: 0 2px 0 var(--ctl); }
.btn:hover:not(:disabled) { border-color: var(--acc); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.pri { background: var(--acc); color: var(--on-acc); border-color: var(--acc); box-shadow: 0 2px 0 var(--shadow); }
.btn[aria-pressed="true"] { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.btn.opt[aria-pressed="true"] { color: inherit; }
.opt.ok { background: var(--in-bg) !important; border-color: var(--in) !important; color: var(--in) !important; }
.opt.no { background: var(--out-bg) !important; border-color: var(--out) !important; color: var(--out) !important; }
.opt.right:not(.ok) { border-color: var(--in); }
.btn.set { font-family: var(--math); font-size: 1.8rem; min-width: 4rem; }

.chip { display: inline-flex; align-items: center; justify-content: center; gap: 0.3em; font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; min-height: max(2.8rem, 44px); min-width: max(2.8rem, 44px); padding: 0.3em 0.85em; border-radius: 999px; border: 2px solid var(--ctl); background: var(--panel); color: var(--ink); box-shadow: 0 2px 0 var(--ctl); line-height: 1; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--acc); }
.chip[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--on-acc); box-shadow: none; }
.chip.in { background: var(--in-bg); border-color: var(--in); color: var(--in); box-shadow: none; }
.chip.out { background: var(--out-bg); border-color: var(--out); color: var(--out); box-shadow: none; }
.chip.in[aria-pressed="true"], .chip.out[aria-pressed="true"] { outline: 3px solid currentColor; outline-offset: 2px; }

.msg { margin: 0; min-height: 2.6rem; padding: 0.45rem 1rem; border-radius: 10px; font-size: 1.35rem; text-align: center; background: var(--chip); border-left: 5px solid var(--line); }
.msg.in { background: var(--in-bg); border-left-color: var(--in); }
.msg.out { background: var(--out-bg); border-left-color: var(--out); }
.msg.empty { visibility: hidden; }
.msg.tall { min-height: 3.9rem; display: flex; align-items: center; justify-content: center; }

.bigf { font-size: 2.6rem; text-align: center; margin: 0; }
.bigf + .midf { margin-top: 0.6rem; }
.vrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 1rem 2.2rem; }
.midf { font-size: 1.7rem; text-align: center; margin: 0; }
.legend { display: grid; gap: 0.4rem; width: 100%; }
.legend p { margin: 0; padding: 0.4rem 0.8rem; border-radius: 8px; border-left: 5px solid var(--acc); background: var(--acc-fill); font-size: 1.2rem; }

/* scelta dei valori */
.pick { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
.pl { font-size: 1.6rem; min-width: 2.6ch; text-align: right; margin-right: 0.2rem; }

/* i due membri */
.mems { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 0.7rem; width: 100%; }
.mbox { border: 2px solid var(--line); border-radius: 12px; padding: 0.45rem 0.8rem 0.6rem; background: var(--panel); min-width: 0; text-align: center; }
.mbox .ml { font-size: 1.1rem; color: var(--ink2); }
.mbox .mh { font-size: 1.35rem; margin: 0.15rem 0 0.35rem; }
.mbox.in { border-color: var(--in); background: var(--in-bg); }
.mbox.out { border-color: var(--out); background: var(--out-bg); }
.calc { font-family: var(--math); font-size: 1.6rem; line-height: 1.4; }
.calc .cs { white-space: nowrap; }
.rel { font-family: var(--math); font-size: 2.6rem; line-height: 1; }
.rel.in { color: var(--in); }
.rel.out { color: var(--out); }

/* tabelle */
.ttw { max-width: 100%; overflow-x: auto; }
.tt { border-collapse: collapse; }
.tt th, .tt td { border: 1px solid var(--line); padding: 0.3rem 0.7rem; text-align: center; }
.tt th.rh { text-align: left; font-weight: 400; font-size: 1rem; color: var(--ink2); }
.tt th.rh .m { font-size: 1.5rem; color: var(--ink); display: block; margin-top: 0.1rem; }
.tt td { font-family: var(--math); font-size: 1.9rem; min-width: 3.2rem; font-variant-numeric: tabular-nums; }
.tt td.in { background: var(--in-bg); color: var(--in); }
.tt td.out { background: var(--out-bg); color: var(--out); font-weight: 700; }
.tt td.unk { color: var(--ctl); }
.dt { border-collapse: collapse; width: 100%; }
.dt th { font-weight: 400; font-size: 1rem; color: var(--ink2); padding: 0.2rem 0.4rem; border-bottom: 2px solid var(--line); }
.dt th .m { font-size: 1.45rem; color: var(--ink); }
.dt td { padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--line); text-align: center; }
.dt td.v { font-family: var(--math); font-size: 1.4rem; white-space: nowrap; }
.dt .calc { font-size: 1.35rem; }
.symt { border-collapse: collapse; font-size: 1.1rem; width: 100%; margin-top: 0.3rem; }
.symt th { text-align: left; font-weight: 500; color: var(--ink2); font-size: 1rem; padding: 0.15rem 0.6rem; border-bottom: 2px solid var(--line); }
.symt td { padding: 0.2rem 0.6rem; border-bottom: 1px solid var(--line); }
.txt .symt { font-size: 1em; }
.txt .symt th { font-size: 0.8em; }
.symt.nar { max-width: 30rem; }
.symt.nar td:first-child { width: 8rem; }

/* passaggi */
.dblk { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 0.4rem 1rem 0.55rem; background: var(--panel); }
.dblk .ml { font-size: 1.1rem; color: var(--ink2); }
.drow { display: flex; align-items: baseline; justify-content: space-between; gap: 0.2rem 1rem; flex-wrap: wrap; }
.drow .e { font-family: var(--math); font-size: 1.75rem; line-height: 1.45; }
.drow .e sup { font-size: 0.64em; line-height: 0; }
.drow .e i { font-style: italic; }
.drow .why { font-size: 1.25rem; color: var(--ink); }
.drow.hide { visibility: hidden; }
.drow.ok .e, .drow.no .e { background: var(--in-bg); color: var(--in); border-radius: 6px; padding: 0 0.3rem; margin-left: -0.3rem; }
.drow.no .e { background: var(--out-bg); color: var(--out); }
.yn { justify-content: flex-start; margin: 0.2rem 0 0.5rem; }
/* archetti del prodotto (a + b)(a + b) */
.pt { font-family: var(--math); font-size: 64px; fill: var(--ink); text-anchor: middle; }
svg .v, .al { font-style: italic; }
.arc { fill: none; stroke: var(--acc); stroke-width: 4; stroke-linecap: round; }
.arc-end { fill: var(--acc); }
.al { font-family: var(--math); font-size: 50px; fill: var(--acc); text-anchor: middle; }
.alb { fill: var(--panel); }
.alb.hl { fill: var(--hl); }
.cx { text-decoration: line-through; text-decoration-color: var(--out); text-decoration-thickness: 0.09em; color: var(--ink2); }

/* parentesi sotto: primo e secondo membro */
.ub { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top; }
.ub .br { align-self: stretch; height: 0.4rem; border: 2px solid var(--acc); border-top: 0; border-radius: 0 0 8px 8px; margin-top: 0.3rem; }
.ub .lab { font-family: var(--ui); font-size: 1.1rem; font-style: normal; color: var(--acc); white-space: nowrap; margin-top: 0.25rem; }
.cap { font-size: 1.05rem; color: var(--ink2); text-align: center; margin: 0 0 0.4rem; }
.cap.sp { margin-top: 0.3rem; }

/* schede */
.kgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.45rem 0.8rem; width: 100%; }
.kc { border: 2px solid var(--line); border-radius: 12px; padding: 0.35rem 0.6rem 0.45rem; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; min-width: 0; }
.kc.in { border-color: var(--in); background: var(--in-bg); }
.kc.out { border-color: var(--out); background: var(--out-bg); }
.kf { font-size: 1.5rem; display: flex; align-items: center; gap: 0.8rem; }
.kt .m { font-weight: 400; }
.kt { font-size: 1.05rem; font-family: var(--ui); font-weight: 700; color: var(--acc); background: var(--acc-fill); border-radius: 999px; padding: 0.1rem 0.8rem; white-space: nowrap; }
.kc .pick { gap: 0.35rem; }
.kc .pl { font-size: 1.35rem; }
.kc .chip { font-size: 1.25rem; }
.tn { background: var(--hl); border-radius: 4px; padding: 0 0.12em; }

/* esercizi */
.exl { display: grid; grid-template-columns: max-content max-content minmax(max-content, 1fr); justify-content: center; gap: 0.55rem 1rem; align-items: center; width: min(100%, 52rem); max-width: 100%; }
.exl .lt { font-weight: 700; font-size: 1.3rem; }
.exl .xf { font-size: 1.3rem; }
.exl .bs { display: flex; gap: 0.5rem; }
.exl .fb { grid-column: 1 / -1; margin-top: -0.25rem; width: 0; min-width: 100%; }

/* legenda delle barre */
.key { display: flex; gap: 0.5rem 1.8rem; justify-content: center; flex-wrap: wrap; font-size: 1.05rem; color: var(--ink2); }
.key > span { display: inline-flex; align-items: center; gap: 0.5rem; }
.key .m { color: var(--ink); }
.sw { width: 1.1rem; height: 1.1rem; border-radius: 3px; display: inline-block; }
.sw.s1 { background: var(--acc); }
.sw.s2 { background: var(--two); }

/* ---------- navigazione ---------- */
footer.nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.nb { font-size: 1.25rem; font-weight: 500; min-height: max(3.1rem, 44px); min-width: 44px; padding: 0 1.7rem; border-radius: 999px; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; box-shadow: 0 2px 0 var(--ctl); }
.nb:hover:not(:disabled) { border-color: var(--acc); }
.nb.pri { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.nb:disabled { opacity: 0.35; cursor: default; }
.count { color: var(--ink2); font-size: 1.05rem; font-variant-numeric: tabular-nums; }

/* ---------- SVG ---------- */
svg text { font-family: var(--ui); }
.ax { stroke: var(--ink); stroke-width: 3; }
.tk { stroke: var(--ink); stroke-width: 3; }
.tl { font-size: 30px; fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
.xl { font-family: var(--math); font-style: italic; font-size: 36px; fill: var(--ink); }
.mk-ink { fill: var(--ink); }
.base { stroke: var(--ink2); stroke-width: 2; }
.bar1 { fill: var(--acc); }
.bar2 { fill: var(--two); }
.bv { font-size: 26px; fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
.bv.eqv { fill: var(--in); font-weight: 700; }
.dot { fill: var(--acc); }
.ring { fill: var(--panel); stroke: var(--out); stroke-width: 4; }
.ringin { fill: var(--in); stroke: var(--panel); stroke-width: 3; }
.ks { font-size: 1.2rem; font-weight: 500; }
.kw { font-size: 1.05rem; color: var(--ink2); text-align: center; }
.sm { font-family: var(--math); font-size: 34px; text-anchor: middle; }
.sm.in { fill: var(--in); }
.sm.out { fill: var(--out); }
.hit { cursor: pointer; }
.hit:focus { outline: none; }
.ha { fill: transparent; }
.lb { fill: var(--chip); stroke: var(--ctl); stroke-width: 2; }
.hit:hover .lb { stroke: var(--acc); fill: var(--hover); }
.hit:focus-visible .lb { stroke: var(--focus); stroke-width: 4; }
.sel .lb { fill: var(--acc); stroke: var(--acc); }
.sel .tl { fill: var(--on-acc); font-weight: 700; }
.okc .lb { fill: var(--in-bg); stroke: var(--in); }
.okc .tl { fill: var(--in); font-weight: 700; }
.hit.cur .lb { stroke-width: 5; }

/* ---------- animazioni ---------- */
.late { animation: appear 0.25s both; }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- schermi stretti ---------- */
@media (max-width: 820px) {
	html, body { height: auto; }
	.app { height: auto; min-height: 100%; }
	header.top { flex-wrap: wrap; }
	h1 { font-size: 1.4rem; min-width: 0; flex: 1; }
	.prog { order: 3; flex-basis: 100%; }
	.pname { display: none; }
	.pch { min-width: 0; }

<script id="calc">
const C = (() => {
	const n = v => v < 0 ? '−' + (-v) : String(v + 0);          // segno meno vero (e niente «−0»)
	const p = v => v < 0 ? '(' + n(v) + ')' : n(v);             // negativi tra parentesi
	const sq = (s, k = 2) => `${s}<sup>${k}</sup>`;
	const eq = (...t) => t.join(' = ');
	const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
	const R = (v, t) => ({ v, t });
	const SETS = ['N', 'Z', 'Q', 'R'];
	const sq9 = x => R(x * x, eq(sq(p(x)), x * x));
	return {
		n, p, frac, SETS,
		// i numeri del primo passo: s = l'insieme più piccolo che li contiene; q = la frazione che li scrive
		NUMS: [
			{ k: '7', h: '7', v: 7, s: 'N' },
			{ k: '0', h: '0', v: 0, s: 'N' },
			{ k: 'm3', h: '−3', v: -3, s: 'Z' },
			{ k: 'q34', h: frac(3, 4), v: 3 / 4, s: 'Q', q: [3, 4] },
			{ k: 'm05', h: '−0,5', v: -0.5, s: 'Q', q: [-1, 2] },
			{ k: 'p03', h: '0,<span class="ov">3</span>', v: 1 / 3, s: 'Q', q: [1, 3] },
			{ k: 'r2', h: '√2', v: Math.SQRT2, s: 'R', irr: 2 },
			{ k: 'pi', h: 'π', v: Math.PI, s: 'R', irr: 'pi' }
		],
		// (a + b)² e a² + b²
		sqSum: (a, b) => R((a + b) ** 2, eq(sq(`(${n(a)} + ${p(b)})`), sq(p(a + b)), (a + b) ** 2)),
		sumSq: (a, b) => R(a * a + b * b, eq(`${sq(p(a))} + ${sq(p(b))}`, `${a * a} + ${b * b}`, a * a + b * b)),
		// x³ + 2x e 3x²
		cubeL: x => R(x ** 3 + 2 * x, eq(`${sq(p(x), 3)} + 2 · ${p(x)}`, `${n(x ** 3)} + ${p(2 * x)}`, n(x ** 3 + 2 * x))),
		cubeR: x => R(3 * x * x, eq(`3 · ${sq(p(x))}`, `3 · ${x * x}`, 3 * x * x)),
		// 7 + x e 3x − 1
		linL: x => R(7 + x, eq(`7 + ${p(x)}`, n(7 + x))),
		linR: x => R(3 * x - 1, eq(`3 · ${p(x)} − 1`, `${n(3 * x)} − 1`, n(3 * x - 1))),
		// x² = 9
		sq9,
		// 5 − 2t = 1
		tSol: R(5 - 2 * 2, eq('5 − 2 · 2', 5 - 2 * 2)),
		// 5x + 4 = x − 4
		verL: x => R(5 * x + 4, eq(`5 · ${p(x)} + 4`, `${n(5 * x)} + 4`, n(5 * x + 4))),
		verR: x => R(x - 4, eq(`${n(x)} − 4`, n(x - 4))),
		// 4 + 3x = 19
		pt2L: x => R(4 + 3 * x, eq(`4 + 3 · ${p(x)}`, `4 + ${n(3 * x)}`, n(4 + 3 * x))),
		// x(x + 3) − 4 = (x + 1)²
		pt3L: x => R(x * (x + 3) - 4, eq(`${p(x)} · (${n(x)} + 3) − 4`, `${p(x)} · ${p(x + 3)} − 4`, `${n(x * (x + 3))} − 4`, n(x * (x + 3) - 4))),
		pt3R: x => R((x + 1) ** 2, eq(sq(`(${n(x)} + 1)`), sq(p(x + 1)), (x + 1) ** 2)),
		// quanti elementi ha S?
		HOW: [
			{ f: 'x − 4 = 6', test: x => x - 4 === 6, S: [10], chk: [R(6, eq('10 − 4', 6))] },
			{ f: 'x + 5 = x', test: x => x + 5 === x, S: [] },
			{ f: '2(x + 3) = 2x + 6', test: x => 2 * (x + 3) === 2 * x + 6, S: 'R' }
		],
		// espressioni con lettere (scritte con ^ per le potenze; la pagina le impagina)
		P5: { L: ['3a(a + 2b)', '3a^2 + 6ab'], R: ['(a + 3b)^2 + 2a^2 − 9b^2', 'a^2 + 6ab + 9b^2 + 2a^2 − 9b^2', '3a^2 + 6ab'] },
		// (a + b)(a + b): gli archetti (termine della prima parentesi, termine della seconda, prodotto) e i passaggi
		PROD: { arcs: [['a', 'a', 'a^2'], ['a', 'b', 'ab'], ['b', 'a', 'ba'], ['b', 'b', 'b^2']],
			rows: ['(a + b)(a + b)', 'a^2 + ab + ba + b^2', 'a^2 + 2ab + b^2'], not: 'a^2 + b^2', more: '2ab' },
		// esercizi: riconosci le identità; ogni membro con i suoi passaggi [espressione, perché]
		EX: [
			{ f: 'a^2 + 6 = (a + 3)(a + 2)', id: false, more: '5a',
				L: [['a^2 + 6', '']],
				R: [['(a + 3)(a + 2)', ''], ['a^2 + 2a + 3a + 6', 'proprietà distributiva'], ['a^2 + 5a + 6', 'termini simili']],
				ce: { a: 1, L: R(1 ** 2 + 6, eq(`${sq(1)} + 6`, 1 ** 2 + 6)), R: R((1 + 3) * (1 + 2), eq('(1 + 3)(1 + 2)', `${1 + 3} · ${1 + 2}`, (1 + 3) * (1 + 2))) } },
			{ f: '5a + 2b − 3a − 4b = 2(a − b)', id: true,
				L: [['5a + 2b − 3a − 4b', ''], ['2a − 2b', 'termini simili']],
				R: [['2(a − b)', ''], ['2a − 2b', 'proprietà distributiva']] },
			{ f: '(a + 7)(a − 7) = a^2 − 49', id: true,
				L: [['(a + 7)(a − 7)', ''], ['a^2 − 7a + 7a − 49', 'proprietà distributiva'], ['a^2 − 49', 'termini simili']],
				R: [['a^2 − 49', '']] },
			{ f: '(a − b)^2 = (b − a)^2', id: true,
				L: [['(a − b)^2', ''], ['a^2 − 2ab + b^2', 'quadrato di binomio']],
				R: [['(b − a)^2', ''], ['b^2 − 2ab + a^2', 'quadrato di binomio'], ['a^2 − 2ab + b^2', 'proprietà commutativa']] }
		]
	};
})();
</script>

<script>
(() => {
	'use strict';
	const $ = id => document.getElementById(id);
	const root = document.documentElement;

	// ---------- tema: chiaro di default, la scelta resta salvata ----------
	function applyTheme(dark, save) {
		root.dataset.theme = dark ? 'dark' : 'light';
		$('themeGlyph').textContent = dark ? '☀' : '☾';
		$('theme').setAttribute('aria-label', dark ? 'Attiva il tema chiaro' : 'Attiva il tema scuro');
		$('theme').title = dark ? 'Tema chiaro' : 'Tema scuro';
		if (save) { try { localStorage.setItem('matematica-tema', dark ? 'dark' : 'light'); } catch (e) {} }
	}
	let saved = null;
	try { saved = localStorage.getItem('matematica-tema'); } catch (e) {}
	applyTheme(saved === 'dark', false);
	$('theme').addEventListener('click', () => applyTheme(root.dataset.theme !== 'dark', true));

	// ---------- dimensione dei contenuti (zoom del passo), scelta salvata ----------
	const zInputs = [...document.querySelectorAll('[name="zoomLevel"]')];
	function applyZoom(v, save) {
		const z = ['100', '115', '130', '150'].includes(v) ? v : '100';
		root.dataset.zoom = z;
		zInputs.forEach(i => { i.checked = i.value === z; });
		if (save) { try { localStorage.setItem('matematica-zoom', z); } catch (e) {} }
	}
	let zSaved = null;
	try { zSaved = localStorage.getItem('matematica-zoom'); } catch (e) {}
	applyZoom(zSaved, false);
	zInputs.forEach(i => i.addEventListener('change', () => { if (i.checked) applyZoom(i.value, true); }));
	function setZoomMenu(open, back) {
		$('zpanel').hidden = !open;
		$('zoomBtn').setAttribute('aria-expanded', String(open));
		if (open) (zInputs.find(i => i.checked) || zInputs[0]).focus();
		else if (back) $('zoomBtn').focus();
	}
	$('zoomBtn').addEventListener('click', () => setZoomMenu($('zpanel').hidden));
	$('zclose').addEventListener('click', () => setZoomMenu(false, true));
	document.addEventListener('pointerdown', e => { if (!$('zpanel').hidden && !$('zmenu').contains(e.target)) setZoomMenu(false, false); });
	document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('zpanel').hidden) { e.preventDefault(); setZoomMenu(false, true); } }, true);

	// ---------- piccoli aiuti per il testo ----------
	const m = s => `<span class="m">${s}</span>`;
	const F = s => s.replace(/[abctxyPSU]/g, '<i>$&</i>').replace(/\^(\d)/g, '<sup>$1</sup>');   // lettere in corsivo, potenze in apice
	const f = s => m(F(s));
	const P = s => `<p>${s}</p>`;
	const DL = (lab, s) => `<div class="def"><div class="dl">${lab}</div>${s}</div>`;
	const SYM = { N: 'ℕ', Z: 'ℤ', Q: 'ℚ', R: 'ℝ' };
	const NAME = { N: 'numeri naturali', Z: 'numeri interi', Q: 'numeri razionali', R: 'numeri reali' };
	const NN = m('ℕ'), ZZ = m('ℤ'), QQ = m('ℚ'), RR = m('ℝ');
	const sost = x => `Sostituendo <span class="xbox">${m(`${F('x')} = ${C.n(x)}`)}</span>`;
	const msg = (h, c = '') => `<p class="msg ${h ? c : 'empty'}">${h || '&nbsp;'}</p>`;
	const fig = (W, H, inner, label, cls = '') => `<div class="fig ${cls}"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${label}">${inner}</svg></div>`;
	const calc = t => `<span class="calc">${t.split(' = ').map((s, i) => `<span class="cs">${i ? '= ' : ''}${s}</span>`).join(' ')}</span>`;
	const ub = (e, lab) => `<span class="ub"><span class="e">${e}</span><span class="br"></span><span class="lab">${lab}</span></span>`;
	const pick = (lab, vals, cur, act, cls = () => '') => `<div class="pick"><span class="pl m"><i>${lab}</i> =</span>${vals.map(v =>
		`<button type="button" class="chip ${cls(v)}" data-act="${act}" data-v="${v}" data-k="${act}${v}" aria-pressed="${v === cur}">${C.n(v)}</button>`).join('')}</div>`;
	// due membri affiancati, con = oppure ≠ in mezzo
	const mems = (L, R, same) => `<div class="mems">
		<div class="mbox ${same ? 'in' : 'out'}">${L.lab ? `<div class="ml">${L.lab}</div>` : ''}<div class="mh">${L.h}</div>${calc(L.t)}</div>
		<span class="rel ${same ? 'in' : 'out'}" role="img" aria-label="${same ? 'uguale' : 'diverso'}">${same ? '=' : '≠'}</span>
		<div class="mbox ${same ? 'in' : 'out'}">${R.lab ? `<div class="ml">${R.lab}</div>` : ''}<div class="mh">${R.h}</div>${calc(R.t)}</div></div>`;
	// passaggi scoperti uno alla volta
	const drow = (e, why, show, cls = '') => `<div class="drow ${show ? cls : 'hide'}"${show ? '' : ' aria-hidden="true"'}><span class="e">${e}</span><span class="why">${why}</span></div>`;
	const nextCtl = (k, max, lab) => `<div class="ctl"><button type="button" class="btn pri" data-act="next" data-k="next"${k >= max ? ' disabled' : ''}>passaggio successivo</button><button type="button" class="btn" data-act="reset" data-k="reset" aria-label="${lab}">↺</button></div>`;
	const X_ = s => `<span class="cx">${s}</span>`;
	// insieme delle soluzioni scritto per elencazione
	const setS = (vals, h = C.n) => vals.length ? `{${vals.map(h).join(', ')}}` : '∅';
	const why = rs => rs.map(r => m(r.t)).join(', ');
	// domanda sì/no con risposta subito (esercizi a–d)
	const yn = (st, ans, fb) => `<div class="ctl yn">${[['sì', '1'], ['no', '0']].map(([t, v]) =>
		`<button type="button" class="btn opt ${st.ans === v ? (v === ans ? 'ok' : 'no') : ''} ${st.ans != null && v === ans ? 'right' : ''}" data-act="ans" data-v="${v}" data-k="ans${v}" aria-pressed="${st.ans === v}">${t}</button>`).join('')}</div>` +
		(st.ans != null ? `<p class="fb ${st.ans === ans ? 'ok' : 'no'}">${fb}</p>` : '');
	// ---------- (a + b)² = (a + b)(a + b) con gli archetti: ogni termine della prima parentesi per ogni termine della seconda ----------
	function prodArcs(k) {
		// un simbolo alla volta, centrato nella sua posizione: con qualunque font nulla esce dal disegno
		const B = 228, x0 = 34, grp = o => [['(', 0], ['a', 27], ['+', 81], ['b', 136], [')', 162]].map(([t, x]) => [t, x0 + o + x]);
		const R = [...grp(275), ...grp(460)];                                  // (a + b)(a + b)
		const X = (t, j) => R.filter(q => q[0] === t)[j][1];                   // j-esima comparsa del termine
		const sup = s => s.replace(/\^(\d)/, '<tspan dy="-22" font-size="32" font-style="normal">$1</tspan>');
		let g = [...grp(0), ['=', x0 + 230], ...R].map(([t, x]) => `<text class="pt${/[ab]/.test(t) ? ' v' : ''}" x="${x}" y="${B}">${t}</text>`).join('') +
			`<text class="pt" style="font-size:40px" x="${x0 + 185}" y="${B - 26}">2</text>`;
		// sopra a·a (basso) e a·b (alto), sotto b·a (basso) e b·b (alto); l'archetto alto parte un po' più fuori
		const G = [[B - 56, -1, 62, 8], [B - 56, -1, 130, -8], [B + 14, 1, 52, 9], [B + 14, 1, 156, -9]];
		C.PROD.arcs.forEach(([p, q, r], i) => {
			if (k <= i) return;
			const [y0, d, h, dx] = G[i], x1 = X(p, 0) + dx, x2 = X(q, 1), c = y0 + d * h / 0.75, ya = y0 + d * h, xm = (x1 + x2) / 2;
			const hl = k >= 6 && r.length === 2;                               // ab e ba, quando si usa la commutativa
			g += `<g class="late"><path class="arc" d="M${x1},${y0} C${x1},${c} ${x2},${c} ${x2},${y0}"/><circle class="arc-end" cx="${x1}" cy="${y0}" r="5"/><circle class="arc-end" cx="${x2}" cy="${y0}" r="5"/>` +
				`<rect class="alb${hl ? ' hl' : ''}" x="${xm - 31}" y="${ya - 28}" width="62" height="54" rx="10"/><text class="al" x="${xm}" y="${ya + 16}">${sup(r)}</text></g>`;
		});
		return fig(690, 440, g, '(a + b) per (a + b): ogni termine della prima parentesi per ogni termine della seconda');
	}

	// ---------- ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ disegnati uno dentro l'altro ----------
	const ORD = C.SETS, idx = s => ORD.indexOf(s);
	function nest(st) {
		const curN = C.NUMS.find(x => x.k === st.cur);
		const box = (i, inner) => {
			const s = ORD[i], on = !curN || idx(curN.s) <= i;
			const els = C.NUMS.filter(x => x.s === s && st.placed[x.k]).map(x => `<span class="el${x.k === st.cur ? ' hl' : ''}">${m(x.h)}</span>`).join('');
			return `<div class="ns n${s}${on ? '' : ' off'}"><span class="nsl">${m(SYM[s])}<span class="nn">${NAME[s]}</span></span><div class="nsr">${inner}<div class="els">${els}<span class="more" aria-hidden="true">…</span></div></div></div>`;
		};
		let h = '';
		for (let i = 0; i < 4; i++) h = box(i, h);
		return `<div class="nest">${h}</div><p class="ncap">Ogni insieme contiene infiniti numeri: qui ne vediamo solo alcuni.</p>`;
	}
	function nestMsg(st) {
		const x = C.NUMS.find(q => q.k === st.cur);
		if (!x) return '<p class="msg tall empty">&nbsp;</p>';
		const list = L => L.length > 1 ? L.slice(0, -1).join(', ') + ' e ' + L.at(-1) : L[0] || '';   // «ℤ, ℚ e ℝ»
		const i = idx(x.s), yes = list(ORD.slice(i).map(s => m(SYM[s]))), no = list(ORD.slice(0, i).map(s => m(SYM[s])));
		const pre = x.q && x.h.includes(',') ? `${m(`${x.h} = ${x.q[0] < 0 ? '−' : ''}${C.frac(Math.abs(x.q[0]), x.q[1])}`)}: ` : '';
		return `<p class="msg tall in"><span>${pre}${m(x.h)} sta in ${yes}${no ? `, ma non in ${no}` : ''}</span></p>`;
	}

	// ---------- i passi ----------
	const CH = ['Gli insiemi numerici', 'Un prodotto notevole', 'Le identità', 'Le equazioni', 'Riepilogo'];
	const AB = [-1, 0, 1, 2, 3, 5];
	const MAP_ARROW = '<span class="mc" aria-hidden="true"><svg viewBox="0 0 48 24"><path d="M4,12 H38" marker-end="url(#ah-acc)"/></svg></span>';

	const STEPS = [
		// ---------- capitolo «Gli insiemi numerici» ----------
		// 1
		{ ch: 0, title: `I numeri che conosciamo: ${NN}, ${ZZ}, ${QQ}, ${RR}`,
			text: `<table class="symt"><tr><td>${NN}</td><td><b>naturali</b>: ${m('0, 1, 2, 3, …')}</td></tr>
				<tr><td>${ZZ}</td><td><b>interi</b> (o relativi): anche i negativi, ${m('−1, −2, −3, …')}</td></tr>
				<tr><td>${QQ}</td><td><b>razionali</b>: le frazioni, anche scritte come decimali finiti o periodici</td></tr>
				<tr><td>${RR}</td><td><b>reali</b>: anche i numeri che non si scrivono come frazione, come ${m('√2')} e ${m('π')}</td></tr></table>` +
				P(`Ogni insieme contiene il precedente: ${m('ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ')}.`),
			init: () => ({ placed: {}, cur: null }),
			view: st => `<div class="col"><p class="ncap top">Alcuni esempi:</p><div class="chips">${C.NUMS.map(x => `<button type="button" class="chip" data-act="n" data-v="${x.k}" data-k="n${x.k}" aria-pressed="${x.k === st.cur}">${m(x.h)}</button>`).join('')}</div>${nest(st)}</div>` + nestMsg(st),
			act(st, a, v) { st.placed[v] = 1; st.cur = v; }
		},
		// ---------- capitolo «Un prodotto notevole» ----------
		// 3
		{ ch: 1, title: 'Il controesempio',
			text: DL('Definizione (Controesempio)', P('Un <b>controesempio</b> è un caso in cui le due espressioni danno risultati diversi.')) +
				P(`Ad esempio: il prodotto notevole ${f('(a + b)^2 = a^2 + b^2')} è scritto bene?`) +
				P('Qualcuno ha risposto di sì: invece non è vero, e si può vedere in due modi.') +
				P('<b>Primo modo</b>: mettiamo dei numeri al posto delle lettere.'),
			init: () => ({ a: null, b: null }),
			view(st) {
				const P2 = pick('a', AB, st.a, 'a') + pick('b', AB, st.b, 'b');
				if (st.a == null || st.b == null) return `<div class="col">${P2}</div>` + msg('');
				const L = C.sqSum(st.a, st.b), R = C.sumSq(st.a, st.b), same = L.v === R.v;
				return `<div class="col">${P2}
					${mems({ h: f('(a + b)^2'), t: L.t }, { h: f('a^2 + b^2'), t: R.t }, same)}</div>` +
					msg(same ? `Qui vengono uguali, ${m(`${L.v} = ${R.v}`)}: un caso che funziona non basta, proviamo altri numeri.` : `${m(`${L.v} ≠ ${R.v}`)}: è un <b>controesempio</b>.<br><b>Quindi ${f('(a + b)^2 = a^2 + b^2')} è sbagliata</b>.`, same ? '' : 'out');
			},
			act(st, a, v) { st[a] = +v; }
		},
		// 4
		{ ch: 1, title: 'Il quadrato di un binomio',
			text: P('<b>Secondo modo</b>: facciamo il prodotto.') +
				P('Ogni termine della prima parentesi si moltiplica per ogni termine della seconda.'),
			init: () => ({ k: 0 }),
			view(st) {
				const k = st.k, Q = C.PROD, hl = s => `<span class="tn">${F(s)}</span>`;
				const r1 = k >= 6 ? `${F('a^2 + ')}${hl('ab')} + ${hl('ba')}${F(' + b^2')}` : F(Q.rows[1]);
				return prodArcs(k) + `<div class="dblk"${k < 5 ? ' style="visibility:hidden"' : ''}>${drow('= ' + r1, 'proprietà distributiva', k >= 5)}${drow(`= ${F('a^2 + ')}${hl('ab')} + ${hl('ab')}${F(' + b^2')}`, 'proprietà commutativa', k >= 6)}${drow('= ' + F(Q.rows[2]), 'termini simili', k >= 7, 'ok')}</div>` +
					nextCtl(k, 7, 'Ricomincia') +
					msg(k >= 7 ? `${f('(a + b)^2 = ' + Q.rows[2])}: rispetto ad ${f(Q.not)} c’è in più ${f(Q.more)}.<br><b>Quindi il prodotto notevole giusto è ${f('(a + b)^2 = ' + Q.rows[2])}</b>.` : '', 'in');
			},
			act(st, a) { st.k = a === 'next' ? Math.min(7, st.k + 1) : 0; }
		},
		// ---------- capitolo «Le identità» ----------
		// 5
		{ ch: 2, title: 'Che cos’è un’identità?',
			text: DL('Definizione (Identità)', P('Un’<b>identità</b> è un’uguaglianza tra due espressioni letterali che è vera <b>qualunque</b> numero si metta al posto delle lettere.') +
				P('L’espressione a sinistra dell’uguale è il <b>primo membro</b>, quella a destra il <b>secondo membro</b>.')) +
				P(`Ad esempio ${f('(a + b)^2 = a^2 + 2ab + b^2')} è un’identità: l’abbiamo ottenuta con le regole del calcolo, senza provare numeri.`) +
				P('In questo e in altri esercizi ho visto che pensavate: «se funziona con qualche esempio, funziona sempre».') +
				P('Non basta: un’identità deve valere per <b>qualunque</b> numero.'),
			view: () => `<div class="col"><div><p class="bigf">${m(`${ub(F('(a + b)^2'), 'primo membro')} = ${ub(F('a^2 + 2ab + b^2'), 'secondo membro')}`)}</p><p class="midf">${m(`∀ ${F('a')}, ${F('b')} ∈ ℝ`)}</p><p class="cap sp">${m('∀')} si legge «per ogni»</p></div>
				<div><p class="cap">Un altro esempio</p><p class="midf">${m(`${F('a(b − c) = ab − ac')} &nbsp; ∀ ${F('a')}, ${F('b')}, ${F('c')} ∈ ℝ`)}</p></div></div>`
		},
		// 6
		{ ch: 2, title: 'Come si verifica un’identità',
			text: DL('Metodo (Verificare un’identità)', P('Per dire che <b>non</b> è un’identità basta un <b>controesempio</b>.') +
				P('Per dire che <b>è</b> un’identità si semplifica <b>ogni membro per conto suo</b>: se alla fine i due membri diventano la stessa espressione, è un’identità.')),
			init: () => ({ k: 0 }),
			view(st) {
				const k = st.k, done = k >= 3, Q = C.P5;
				const r4 = done ? F('a^2 + 6ab ') + X_(F('+ 9b^2')) + F(' + 2a^2 ') + X_(F('− 9b^2')) : F(Q.R[1]);
				return `<div class="col"><p class="midf">${m(`${F(Q.L[0])} = ${F(Q.R[0])}`)}</p>
					<div class="dblk"><div class="ml">primo membro</div>${drow(F(Q.L[0]), '', true)}${drow('= ' + F(Q.L[1]), 'proprietà distributiva', k >= 1, done ? 'ok' : '')}</div>
					<div class="dblk"><div class="ml">secondo membro</div>${drow(F(Q.R[0]), '', true)}${drow('= ' + r4, 'quadrato di binomio', k >= 2)}${drow('= ' + F(Q.R[2]), 'termini simili', k >= 3, 'ok')}</div>
					${nextCtl(k, 3, 'Ricomincia')}</div>` +
					msg(done ? `I due membri sono diventati la stessa espressione, ${f('3a^2 + 6ab')}.<br><b>Quindi è un’identità</b>.` : '', 'in');
			},
			act(st, a) { st.k = a === 'next' ? Math.min(3, st.k + 1) : 0; }
		},
		// 7
		{ ch: 2, title: 'Perché pochi esempi non bastano?',
			text: P(`Prendiamo ${f('x^3 + 2x = 3x^2')} e proviamo i numeri più comodi.`),
			init: () => ({ seen: {}, last: null }),
			view(st) {
				const X4 = [0, 1, 2, 3], cell = (x, g) => {
					if (!st.seen[x]) return `<td class="unk">?</td>`;
					return `<td class="${C.cubeL(x).v === C.cubeR(x).v ? 'in' : 'out'}">${g(x).v}</td>`;
				};
				const x = st.last;
				let out = '';
				if (x != null) {
					const L = C.cubeL(x), R = C.cubeR(x), same = L.v === R.v;
					out = msg(`${sost(x)}<br>${m(L.t)}<br>${m(R.t)}${same ? '' : `<br>${m(`${L.v} ≠ ${R.v}`)}.<br><b>Quindi non è un’identità</b>.`}`, same ? 'in' : 'out');
				} else out = msg('');
				return `<div class="col"><table class="tt">
					<tr><th class="rh">${f('x')}</th>${X4.map(x => `<th><button type="button" class="chip" data-act="x" data-v="${x}" data-k="x${x}" aria-pressed="${x === st.last}">${x}</button></th>`).join('')}</tr>
					<tr><th class="rh">primo membro ${f('x^3 + 2x')}</th>${X4.map(x => cell(x, C.cubeL)).join('')}</tr>
					<tr><th class="rh">secondo membro ${f('3x^2')}</th>${X4.map(x => cell(x, C.cubeR)).join('')}</tr></table>` + out +
					([0, 1, 2, 3].every(v => st.seen[v]) ? `<div class="legend late"><p>Con 0, 1 e 2 i due membri vengono uguali, con 3 no: chi avesse provato solo i primi tre numeri avrebbe sbagliato.</p></div>` : '') + '</div>';
			},
			act(st, a, v) { st.seen[+v] = 1; st.last = +v; }
		},
		// 8–11: esercizi a–d
		...C.EX.map((E, i) => {
			const nL = E.L.length - 1, max = nL + E.R.length - 1, fin = E.L.at(-1)[0];
			const FB = [
				`No: con ${f(`a = ${E.ce?.a}`)} il primo membro vale ${m(E.ce?.L.t)} e il secondo ${m(E.ce?.R.t)}.`,
				`Sì: tutti e due i membri diventano ${f(fin)}.`,
				`Sì: il primo membro è la somma di due termini per la loro differenza, ${f('(a + 7)(a − 7) = a^2 − 7^2 = ' + fin)}.`,
				`Sì: tutti e due i membri diventano ${f(fin)}.`][i];
			return { ch: 2, title: `Esercizio ${'abcd'[i]}: è un’identità?`,
				text: st => yn(st, E.id ? '1' : '0', FB),
				init: () => ({ k: 0, ans: null }),
				view(st) {
					const k = st.k, done = k >= max;
					const blk = (lab, rows, off) => `<div class="dblk"><div class="ml">${lab}</div>${rows.map(([e, w], j) =>
						drow((j ? '= ' : '') + F(e), w, j === 0 || k >= off + j, done && j === rows.length - 1 ? (E.id ? 'ok' : 'no') : '')).join('')}</div>`;
					return `<div class="col"><p class="midf">${f(E.f)}</p>${blk('primo membro', E.L, 0)}${blk('secondo membro', E.R, nL)}${nextCtl(k, max, 'Ricomincia')}</div>` +
						msg(!done ? '' : E.id ? `Alla fine i due membri sono la stessa espressione, ${f(fin)}.<br><b>Quindi è un’identità</b>.`
							: `Nel secondo membro c’è in più ${f(E.more)} (con ${f(`a = ${E.ce.a}`)} si ottiene ${m(`${E.ce.L.v} ≠ ${E.ce.R.v}`)}).<br><b>Quindi non è un’identità</b>.`, E.id ? 'in' : 'out');
				},
				act(st, a, v) { if (a === 'ans') st.ans = v; else st.k = a === 'next' ? Math.min(max, st.k + 1) : 0; }
			};
		}),
		// ---------- capitolo «Le equazioni» ----------
		// 12
		{ ch: 3, title: 'E se l’uguaglianza non vale sempre?',
			text: st => P('Un’identità vale per ogni valore delle lettere.') +
				P('E se un’uguaglianza non vale sempre?') +
				P('Ci sono valori che la rendono vera?') +
				P('Quanti?') +
				P(`Prendiamo ${f('7 + x = 3x − 1')}.`) +
				(st.seen[4] ? P(`<b>Quindi l’uguaglianza è vera per alcuni valori di ${f('x')} e falsa per altri.</b>`) : ''),
			init: () => ({ seen: { 0: 1 }, x: 0 }),
			view(st) {
				const Y0 = 300, K = 13, W = 44;
				let s = `<line class="base" x1="70" y1="${Y0}" x2="960" y2="${Y0}"/><text class="xl" x="62" y="${Y0 + 83}" text-anchor="end">x</text>`;
				for (let x = 0; x <= 6; x++) {
					const gx = 150 + x * 128, L = C.linL(x).v, R = C.linR(x).v, same = L === R;
					if (st.seen[x]) {
						const bar = (v, x0, cls) => {
							const top = v >= 0 ? Y0 - v * K : Y0, h = Math.abs(v) * K;
							return `<rect class="${cls}" x="${x0}" y="${top}" width="${W}" height="${h}"/><text class="bv${same ? ' eqv' : ''}" x="${x0 + W / 2}" y="${v >= 0 ? top - 10 : Y0 + h + 26}">${C.n(v)}</text>`;
						};
						s += bar(L, gx - W - 3, 'bar1') + bar(R, gx + 3, 'bar2');
					}
					const c = x === st.x ? 'sel' : st.seen[x] ? (same ? 'okc' : '') : '';
					s += `<g class="hit ${c}" role="button" tabindex="0" aria-label="x uguale ${x}" aria-pressed="${x === st.x}" data-act="x" data-v="${x}" data-k="x${x}"><rect class="ha" x="${gx - 64}" y="0" width="128" height="${Y0 + 104}"/><rect class="lb" x="${gx - 32}" y="${Y0 + 50}" width="64" height="44" rx="11"/><text class="tl" x="${gx}" y="${Y0 + 83}">${x}</text></g>`;
				}
				const x = st.x, L = C.linL(x), R = C.linR(x), same = L.v === R.v;
				return `<div class="key"><span><span class="sw s1"></span>primo membro ${f('7 + x')}</span><span><span class="sw s2"></span>secondo membro ${f('3x − 1')}</span></div>` +
					fig(1000, 410, s, 'i due membri per x da 0 a 6', 'wide') +
					msg(`${sost(x)}<br>${m(L.t)}<br>${m(R.t)}<br><b>Quindi con ${f(`x = ${x}`)} è ${same ? 'vera' : 'falsa'}</b>`, same ? 'in' : 'out');
			},
			act(st, a, v) { st.x = +v; st.seen[+v] = 1; }
		},
		// 13
		{ ch: 3, title: 'Che cos’è un’equazione?',
			text: DL('Definizione (Equazione)', P('Un’<b>equazione</b> è un’uguaglianza tra due espressioni letterali, per la quale ci chiediamo <b>per quali valori</b> delle lettere è vera.') +
				P('La lettera di cui cerchiamo i valori è l’<b>incognita</b>.') +
				P('I valori che rendono vera l’uguaglianza sono le <b>soluzioni</b> (o <b>radici</b>).')) +
				P(`Ad esempio in ${f('7 + x = 3x − 1')} l’incognita è ${f('x')} e la soluzione è ${f('x = 4')}.`),
			view: () => `<div class="col"><p class="bigf">${m(`${ub(F('7 + x'), 'primo membro')} = ${ub(F('3x − 1'), 'secondo membro')}`)}</p>

		},
		// 14
		{ ch: 3, title: 'L’insieme delle soluzioni',
			text: DL('Definizione (Insieme delle soluzioni)', P(`Le soluzioni di un’equazione formano l’<b>insieme delle soluzioni</b> ${f('S')}.`) +
				P(`<b>Risolvere</b> un’equazione vuol dire trovare <b>tutte</b> le sue soluzioni, cioè determinare ${f('S')}.`)) +
				P(`${f('S')} può essere <b>vuoto</b> (${m(`${F('S')} = ∅`)}), <b>finito</b> e non vuoto oppure <b>infinito</b>.`),
			init: () => ({ open: {} }),
			view(st) {
				const INFO = [
					['finito: un elemento', `${m('10')} è l’unico numero che, diminuito di 4, dà 6: ${why(C.HOW[0].chk)}`],
					['vuoto', 'nessun numero, aumentato di 5, resta uguale a sé stesso'],

				return `<div class="col"><div class="kgrid three">${C.HOW.map((e, i) => {

					return `<button type="button" class="kc ${o ? 'in' : ''}" data-act="o" data-v="${i}" data-k="o${i}" aria-expanded="${!!o}"><span class="kf">${f(e.f)}</span>` +
						(o ? `<span class="ks">${m(`${F('S')} = ${S}`)} <span class="kt">${INFO[i][0]}</span></span><span class="kw">${INFO[i][1]}</span>` : `<span class="qs">${m(`${F('S')} = ?`)}</span>`) + '</button>';

			act(st, a, v) { st.open[+v] = 1; }
		},
		// 15
		{ ch: 3, title: 'Soluzioni per tentativi',
			text: P('Per ora cerchiamo le soluzioni per tentativi.') +
				P(`Ad esempio ${f('x^2 = 9')}: quali numeri, messi al posto di ${f('x')}, rendono vera l’uguaglianza?`),
			init: () => ({ seen: {}, last: null }),
			view(st) {
				const V = [-4, -3, -2, -1, 0, 1, 2, 3, 4], ok = x => C.sq9(x).v === 9;
				const found = V.filter(x => st.seen[x] && ok(x)), all = found.length === 2, x = st.last;
				const mid = found.length ? `soluzioni trovate: ${m(found.map(C.n).join(', '))}` : '&nbsp;';
				let out = msg('');
				if (x != null) {
					const r = C.sq9(x);
					out = msg(ok(x) ? `${m(r.t)}: ${m(C.n(x))} è una soluzione.${all ? '<br><b>Quindi abbiamo trovato due soluzioni</b>.' : '<br>Ce ne sono altre?'}` : `${m(`${r.t} ≠ 9`)}: ${m(C.n(x))} non è una soluzione.`, ok(x) ? 'in' : 'out');
				}
				return `<div class="col"><p class="bigf">${f('x^2 = 9')}</p>` +
					pick('x', V, x, 'x', v => st.seen[v] ? (ok(v) ? 'in' : 'out') : '') +
					`<p class="midf">${mid}</p></div>` + out;
			},
			act(st, a, v) { st.seen[+v] = 1; st.last = +v; }
		},
		// 17
		{ ch: 3, title: 'Per tentativi tra i naturali',
			text: P(`Un’altra equazione: ${f('4 + 3x = 19')}.`) +
				P('Proviamo i numeri naturali: quali rendono vera l’uguaglianza?'),
			init: () => ({ seen: {}, last: null }),
			view(st) {
				const X8 = [0, 1, 2, 3, 4, 5, 6, 7], ok = x => C.pt2L(x).v === 19, x = st.last;
				const cell = (x, v) => st.seen[x] ? `<td class="${ok(x) ? 'in' : 'out'}">${v}</td>` : `<td class="unk">?</td>`;
				const bad = X8.find(v => st.seen[v] && !ok(v));
				let out = msg('');
				if (x != null) { const L = C.pt2L(x); out = msg(`${sost(x)}<br>${m(ok(x) ? L.t : `${L.t} ≠ 19`)}`, ok(x) ? 'in' : 'out'); }
				return `<div class="col"><div class="ttw"><table class="tt">
					<tr><th class="rh">${f('x')}</th>${X8.map(x => `<th><button type="button" class="chip" data-act="x" data-v="${x}" data-k="x${x}" aria-pressed="${x === st.last}">${x}</button></th>`).join('')}</tr>
					<tr><th class="rh">primo membro ${f('4 + 3x')}</th>${X8.map(x => cell(x, C.pt2L(x).v)).join('')}</tr>
					<tr><th class="rh">secondo membro ${m('19')}</th>${X8.map(x => `<td class="${st.seen[x] ? (ok(x) ? 'in' : 'out') : ''}">19</td>`).join('')}</tr></table></div>` + out +
					`<div class="legend">${bad != null ? `<p class="late">Con ${f(`x = ${bad}`)} è falsa: basta questo per dire che non è un’identità.</p>` : ''}` +
					(st.seen[5] ? `<p class="late">Con ${f('x = 5')}: ${m(C.pt2L(5).t.split(' = ')[0] + ' = 19')}.<br><b>Quindi ${f('x = 5')} è una soluzione</b>.</p>` : '') + '</div></div>';
			},
			act(st, a, v) { st.seen[+v] = 1; st.last = +v; }
		},
		// 18
		{ ch: 3, title: 'La verifica per sostituzione',
			text: DL('Definizione (Verifica per sostituzione)', P('Si mette il numero al posto dell’incognita e si calcolano i due membri <b>separatamente</b>.') +
				P('Se vengono uguali, il numero è una soluzione.')),
			init: () => ({ x: -2 }),

				return `<div class="col"><p class="bigf">${f('5x + 4 = x − 4')}</p>${pick('x', [-2, 1], st.x, 'x')}
					${mems({ lab: 'primo membro', h: f('5x + 4'), t: L.t }, { lab: 'secondo membro', h: f('x − 4'), t: R.t }, same)}</div>` +
					msg(same ? `${m(`${C.n(L.v)} = ${C.n(R.v)}`)}.<br><b>Quindi ${f(`x = ${C.n(st.x)}`)} è una soluzione</b>.` : `${m(`${C.n(L.v)} ≠ ${C.n(R.v)}`)}.<br><b>Quindi ${f(`x = ${C.n(st.x)}`)} non è una soluzione</b>.`, same ? 'in' : 'out');
			},
			act(st, a, v) { st.x = +v; }
		},
		// esercizio: è una soluzione? (Prova tu 3)
		{ ch: 3, title: 'Esercizio: è una soluzione?',
			text: P(`Quali di questi numeri sono soluzioni di ${f('x(x + 3) − 4 = (x + 1)^2')}?`),
			init: () => ({ x: null }),
			view(st) {
				let out = msg(''), mm = '';
				if (st.x != null) {
					const L = C.pt3L(st.x), R = C.pt3R(st.x), same = L.v === R.v;
					mm = mems({ lab: 'primo membro', h: f('x(x + 3) − 4'), t: L.t }, { lab: 'secondo membro', h: f('(x + 1)^2'), t: R.t }, same);
					out = msg(same ? `${m(`${C.n(L.v)} = ${C.n(R.v)}`)}.<br><b>Quindi ${f(`x = ${C.n(st.x)}`)} è una soluzione</b>.` : `${m(`${C.n(L.v)} ≠ ${C.n(R.v)}`)}.<br><b>Quindi ${f(`x = ${C.n(st.x)}`)} non è una soluzione</b>.`, same ? 'in' : 'out');
				}
				return `<div class="col"><p class="bigf">${f('x(x + 3) − 4 = (x + 1)^2')}</p>${pick('x', [5, -1], st.x, 'x')}${mm}</div>` + out;
			},
			act(st, a, v) { st.x = +v; }
		},
		// 19
		{ ch: 3, title: 'Sono tutte?',
			text: P('Siamo andati per tentativi: abbiamo trovato alcune soluzioni e abbiamo verificato per sostituzione che lo sono.') +
				P('Ma sono <b>tutte</b>?') +
				P('Per tentativi non possiamo saperlo: avremmo dovuto provare <b>tutti</b> i numeri, ma già i numeri naturali sono <b>infiniti</b>, quindi è impossibile.') +
				P(`Nella prossima lezione vedremo dei procedimenti che ci permettono di ricavare le soluzioni e di capire com’è fatto&nbsp;${f('S')}.`),
			view: () => `<div class="col"><table class="dt tut"><tr><th>equazione</th><th>soluzioni trovate</th><th></th></tr>${[
				['7 + x = 3x − 1', '4'], ['x^2 = 9', '−3, 3'], ['4 + 3x = 19', '5'], ['5x + 4 = x − 4', '−2']].map(([e, s]) =>
				`<tr><td class="v">${f(e)}</td><td class="v">${m(s)}</td><td class="q">ce ne sono altre?</td></tr>`).join('')}</table></div>`
		},
		// ---------- capitolo «Riepilogo» ----------
		// 20: riepilogo a schema
		{ ch: 4, full: true, title: 'Che cosa abbiamo visto: insiemi numerici e identità',
			view() {
				const EX = [['N', '0, 7'], ['Z', '−3'], ['Q', `${C.frac(3, 4)}, −0,5`], ['R', '√2, π']];
				return `<div class="map">
					<section class="mb"><h3>Gli insiemi numerici</h3>
						<p class="mbig">${m('ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ')}</p>
						<table class="mt"><tr><th></th><th>numeri</th><th>ad esempio</th></tr>${EX.map(([s, e]) => `<tr><td class="s">${m(SYM[s])}</td><td>${NAME[s].replace('numeri ', '')}${s === 'Z' ? ' (relativi)' : ''}</td><td>${m(e)}</td></tr>`).join('')}</table>
						<p>Ogni insieme contiene il precedente e ha numeri in più: <span class="in">${m('−3 ∈ ℤ')}</span> ma <span class="out">${m('−3 ∉ ℕ')}</span>.</p>
					</section>${MAP_ARROW}
					<section class="mb"><h3>Le identità</h3>
						<p>Un’<b>identità</b> è un’uguaglianza tra due espressioni letterali che è vera <b>qualunque</b> numero si metta al posto delle lettere.</p>
						<p>Per dire che <b>non</b> lo è basta un <b>controesempio</b>: ${f('(a + b)^2 = a^2 + b^2')} è sbagliata, con ${f('a = b = 1')} si ottiene ${m(`${C.sqSum(1, 1).v} ≠ ${C.sumSq(1, 1).v}`)}.</p>
						<p>Qualche esempio che funziona non basta: ${f('x^3 + 2x = 3x^2')} è vera per ${f('x = 0, 1, 2')} ma non per ${f('x = 3')} (${m(`${C.cubeL(3).v} ≠ ${C.cubeR(3).v}`)}).</p>
						<p>Per dire che <b>è</b> un’identità si semplifica <b>ogni membro per conto suo</b>: se alla fine i due membri diventano la stessa espressione, è un’identità.<br>Facendo il prodotto ${f('(a + b)(a + b)')} si trova il prodotto notevole giusto:</p>
						<p class="mcen">${f('(a + b)^2 = a^2 + 2ab + b^2')} &nbsp;${m(`∀ ${F('a')}, ${F('b')} ∈ ℝ`)}</p>
					</section></div>`;
			}
		},
		// 21: riepilogo a schema
		{ ch: 4, full: true, title: `Che cosa abbiamo visto: equazioni e insieme delle soluzioni`,
			view() {
				const V = C.verL(-2), W = C.verR(-2);
				return `<div class="map">
					<section class="mb"><h3>Le equazioni</h3>
						<p>Un’<b>equazione</b> è un’uguaglianza tra due espressioni letterali, per la quale ci chiediamo <b>per quali valori</b> delle lettere è vera.</p>
						<p class="mcen">${f('7 + x = 3x − 1')}: &nbsp;incognita ${f('x')}, soluzione (o&nbsp;radice) ${f(`x = ${C.linL(4).v === C.linR(4).v ? 4 : '?'}`)}</p>
						<p><b>Verifica per sostituzione</b>: si mette il numero al posto dell’incognita e si calcolano i due membri separatamente.<br>In ${f('5x + 4 = x − 4')} con ${f('x = −2')}: ${m(V.t)} e ${m(W.t)}: sono uguali, ${f('x = −2')} è una soluzione.</p>
					</section>${MAP_ARROW}
					<section class="mb"><h3>L’insieme delle soluzioni ${f('S')}</h3>
						<table class="mt"><tr><th>${f('S')} può essere</th><th>ad esempio</th><th></th></tr>
							<tr><td>vuoto</td><td>${f('x + 5 = x')}</td><td>${m(`${F('S')} = ∅`)}</td></tr>
							<tr><td>finito e non vuoto</td><td>${f('x − 4 = 6')}</td><td>${m(`${F('S')} = {10}`)}</td></tr>
							<tr><td>infinito</td><td>${f('2(x + 3) = 2x + 6')}</td><td>${m(`${F('S')} = ℝ`)}</td></tr></table>
						<p><b>Risolvere</b> un’equazione vuol dire trovare <b>tutte</b> le soluzioni, cioè determinare ${f('S')}.</p>
						<p><b>Sono tutte?</b><br>Per tentativi non possiamo saperlo: i numeri sono infiniti.<br>Nella prossima lezione: procedimenti per ricavare le soluzioni.</p>
					</section></div>`;
			}
		}
	];

	// ---------- riepilogo da stampare: i due schemi ricomposti su un foglio ----------
	(() => {
		const ps = document.createElement('section');
		ps.className = 'print-summary';
		ps.setAttribute('aria-hidden', 'true');
		const tmp = document.createElement('div');
		tmp.innerHTML = STEPS.filter(x => x.full).map(x => x.view({})).join('');
		const B = [...tmp.querySelectorAll('section.mb')].map(b => b.outerHTML);   // Insiemi, Identità, Equazioni, S
		const T = '<h1 class="ps-t">Identità ed equazioni – Lezione 1: riepilogo</h1>';
		ps.innerHTML = `<div class="ps-port">${T}<div class="ps-row">${B[0]}${B[1]}</div><div class="ps-row">${B[2]}${B[3]}</div></div>` +
			`<div class="ps-land">${T}${tmp.innerHTML}</div>`;
		document.body.appendChild(ps);
		document.addEventListener('click', e => { if (e.target.closest?.('[data-print]')) window.print(); });
	})();

	// ---------- motore ----------
	const S = {};
	let cur = 0, lastLeft = '';
	let nextLesson = null;   // indirizzo della lezione successiva, se sul sito c'è
	const shown = new Set();   // testi con dissolvenza già comparsi nel passo
	const main = $('main'), left = $('left'), stage = $('stage');
	const stOf = i => S[i] ??= (STEPS[i].init ? STEPS[i].init() : {});

	// barra di avanzamento
	(() => {
		let h = '', i = 0;
		CH.forEach((name, c) => {
			const n = STEPS.filter(s => s.ch === c).length;
			h += `<div class="pch" style="--n:${n}" data-ch="${c}"><div class="segs">`;
			for (let j = 0; j < n; j++, i++) h += `<button type="button" class="seg" data-go="${i}" aria-label="${name}, passo ${i + 1}"></button>`;
			h += `</div><span class="pname">${name}</span></div>`;
		});
		$('prog').innerHTML = h;
		$('prog').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });
	})();

	function renderLeft() {
		const P = STEPS[cur], st = stOf(cur);
		const T = typeof P.text === 'function' ? P.text(st) : P.text;
		const h = (P.full ? `<div class="thead"><h2>${P.title}</h2><span class="tacts"><button type="button" class="btn" data-print><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg>Stampa il riepilogo</button>${cur === STEPS.length - 1 && nextLesson ? `<a class="btn pri" href="${nextLesson}">Prossima lezione →</a>` : ''}</span></div>` : `<h2>${P.title}</h2>`) +
			(T ? `<div class="txt">${T}</div>` : '');
		if (h !== lastLeft) left.innerHTML = lastLeft = h;          // se non cambia, non si ridisegna
	}
	function renderStage() {
		const old = stage.querySelector('.fig.wide, .ttw')?.scrollLeft || 0;
		stage.innerHTML = STEPS[cur].view(stOf(cur));
		// figura larga sul telefono: resta dov'era, ma il valore scelto si vede
		const w = stage.querySelector('.fig.wide, .ttw'), sel = w?.querySelector('.sel, [aria-pressed="true"]');
		if (!sel) return;
		w.scrollLeft = old;
		const r = w.getBoundingClientRect(), b = sel.getBoundingClientRect();
		if (b.right > r.right) w.scrollLeft += b.right - r.right + 40;
		else if (b.left < r.left) w.scrollLeft -= r.left - b.left + 40;
	}
	// testo per chi usa un lettore di schermo: apici e frazioni si leggono
	const say = e => {
		const c = e.cloneNode(true);
		c.querySelectorAll('sup').forEach(s => { s.textContent = ' alla ' + s.textContent; });
		c.querySelectorAll('.frac').forEach(q => { q.textContent = `${q.children[0].textContent} fratto ${q.children[1].textContent}`; });
		c.querySelectorAll('.ov').forEach(q => { q.textContent = q.textContent + ' periodico'; });
		c.querySelectorAll('br').forEach(b => b.replaceWith(' '));   // le righe a capo non devono attaccare le frasi
		return c.textContent;
	};
	function renderChrome() {
		const P = STEPS[cur];
		$('h1').textContent = CH[P.ch];
		document.querySelectorAll('.seg').forEach((b, i) => {
			b.classList.toggle('cur', i === cur); b.classList.toggle('done', i < cur);
			if (i === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
		});
		document.querySelectorAll('.pch').forEach(p => p.classList.toggle('cur', +p.dataset.ch === P.ch));
		$('prev').disabled = cur === 0;
		$('next').disabled = cur === STEPS.length - 1;
		$('count').textContent = `${cur + 1} / ${STEPS.length}`;
	}
	function go(i) {
		cur = Math.max(0, Math.min(STEPS.length - 1, i));
		main.classList.toggle('full', !!STEPS[cur].full);
		renderChrome(); renderLeft(); renderStage();
		shown.clear(); stage.querySelectorAll('.late').forEach(e => shown.add(e.textContent));
		left.scrollTop = 0; stage.scrollTop = 0;
		const h = '#passo-' + (cur + 1);
		if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) {} }
	}
	// dopo un'azione: ridisegna e rimette il fuoco dov'era
	function refresh() {
		const fk = document.activeElement?.dataset?.k;
		if (typeof STEPS[cur].text === 'function') renderLeft();
		renderStage();
		// la dissolvenza solo per ciò che compare adesso, non per ciò che si vedeva già
		stage.querySelectorAll('.late').forEach(e => { if (shown.has(e.textContent)) e.classList.remove('late'); else shown.add(e.textContent); });
		if (fk) {
			const t = main.querySelector(`[data-k="${CSS.escape(fk)}"]`);
			(t && !t.disabled ? t : main.querySelector('[data-k="reset"]'))?.focus({ preventScroll: true });
		}
		$('live').textContent = [...main.querySelectorAll('.fb, .msg:not(.empty), .kc[aria-expanded="true"]')].map(say).join(' ');
	}
	main.addEventListener('click', e => {
		const t = e.target.closest('[data-act]');
		if (!t || !main.contains(t) || t.disabled) return;
		STEPS[cur].act(stOf(cur), t.dataset.act, t.dataset.v);
		refresh();
	});
	main.addEventListener('keydown', e => {
		if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('g[role="button"]')) {
			e.preventDefault();
			e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
		}
	});
	document.addEventListener('keydown', e => {
		if (e.altKey || e.ctrlKey || e.metaKey || e.defaultPrevented) return;
		if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
		if (e.key === 'ArrowRight' && cur < STEPS.length - 1) { e.preventDefault(); go(cur + 1); }
		if (e.key === 'ArrowLeft' && cur > 0) { e.preventDefault(); go(cur - 1); }
	});
	$('prev').addEventListener('click', () => go(cur - 1));
	$('next').addEventListener('click', () => go(cur + 1));
	const fromHash = () => { const r = /^#passo-(\d{1,2})$/.exec(location.hash); return r ? +r[1] - 1 : null; };
	window.addEventListener('hashchange', () => { const i = fromHash(); if (i != null && i !== cur) go(i); });
	// ---------- prossima lezione: solo sul sito, e solo se il file della lezione successiva c'è;
	// il link compare nell'intestazione dell'ultimo riepilogo ----------
	if (location.protocol.startsWith('http')) $('homeBtn').hidden = false;   // sul sito si torna all'elenco delle lezioni; da file no
	const ln = /lezione-(\d+)(?:\.html)?$/.exec(location.pathname);
	if (ln && location.protocol.startsWith('http')) {
		const url = location.pathname.replace(/lezione-\d+(?:\.html)?$/, `lezione-${+ln[1] + 1}.html`);
		fetch(url, { method: 'HEAD', cache: 'no-store' })
			.then(r => { if (r.ok) { nextLesson = url; renderLeft(); } })
			.catch(() => {});
	}
