<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { const r = document.documentElement, t = localStorage.getItem('matematica-tema'), z = localStorage.getItem('matematica-zoom'); if (t === 'dark') r.dataset.theme = 'dark'; if (['115', '130', '150'].includes(z)) r.dataset.zoom = z; } catch (e) {}</script>
<title>Equazioni – Lezione 2: equivalenza e risoluzione</title>
<link rel="stylesheet" href="../../assets/fonts/lezioni.css">
<style>
:root {
	--bg: #F3F6F9;
	--grid: #E2E8EF;
	--panel: #FFFFFF;
	--ink: #17212E;
	--ink2: #4A5566;
	--line: #D3DBE4;
	--acc: #2A4DB5;
	--on-acc: #FFFFFF;
	--acc-fill: rgba(42, 77, 181, 0.08);
	--acc-soft: rgba(42, 77, 181, 0.30);
	--two: #B35C00;
	--in: #13804A;
	--in-bg: #DFF3E7;
	--out: #BE3131;
	--out-bg: #FBE3E3;
	--hl: #FFEFA8;
	--hover: #EAF0F8;
	--chip: #F3F6F9;
	--focus: #2A4DB5;
	--ctl: #8C9AAB;
	--shadow: rgba(0, 0, 0, 0.25);
	--ui: "Lexend", system-ui, "Segoe UI", Roboto, sans-serif;
	--math: "STIX Two Text", "STIX Two Math", "Cambria Math", "DejaVu Serif", "Noto Sans Math", Cambria, "Times New Roman", serif;
}
:root[data-theme="dark"] {
	color-scheme: dark;
	--bg: #0F141A;
	--grid: #19212B;
	--panel: #161D26;
	--ink: #E6EBF1;
	--ink2: #A8B3C0;
	--line: #2A3440;
	--acc: #86A5F7;
	--on-acc: #0F141A;
	--acc-fill: rgba(134, 165, 247, 0.10);
	--acc-soft: rgba(134, 165, 247, 0.34);
	--two: #F2A65A;
	--in: #4FC98C;
	--in-bg: #173327;
	--out: #FF7C7C;
	--out-bg: #3A1D20;
	--hl: #3D3517;
	--hover: #1E2835;
	--chip: #1B232E;
	--focus: #86A5F7;
	--ctl: #56657A;
	--shadow: rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(14px, min(1.05vw, 1.9vh), 21px); }
body {
	margin: 0; height: 100%;
	background-color: var(--bg);
	background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
	background-size: 24px 24px;
	color: var(--ink); font-family: var(--ui); line-height: 1.4;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; max-width: 1800px; margin: 0 auto; padding: 0.8rem 16px 0.9rem; display: flex; flex-direction: column; gap: 0.7rem; }

/* ---------- barra in alto ---------- */
header.top { display: flex; align-items: center; gap: 0.6rem 2rem; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; min-width: 10.5ch; white-space: nowrap; }
.prog { flex: 1; display: flex; gap: 0.7rem; min-width: 0; }
.pch { flex: var(--n) 1 0; min-width: max-content; display: flex; flex-direction: column; gap: 0.1rem; }
.segs { display: flex; gap: 3px; }
.seg { flex: 1; min-width: 0; height: 1.5rem; padding: 0; border: 0; background: none; cursor: pointer; position: relative; border-radius: 4px; }
.seg::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 0.5rem; transform: translateY(-50%); border-radius: 3px; background: var(--line); }
.seg.done::before { background: var(--acc-soft); }
.seg.cur::before { background: var(--acc); height: 0.75rem; }
.pname { font-size: 0.95rem; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pch.cur .pname { color: var(--ink); font-weight: 700; }
#theme { flex: none; width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; font-size: 1.3rem; line-height: 1; padding: 0; }
#theme:hover { border-color: var(--acc); }
.tools { flex: none; display: flex; align-items: center; gap: 0.5rem; position: relative; }   /* il pannello dello zoom si allinea al bordo destro dei due bottoni */
.zmenu { position: static; }
#homeBtn { width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); color: var(--ink); display: grid; place-items: center; }
#homeBtn:hover { border-color: var(--acc); }
#homeBtn svg { width: 1.4rem; height: 1.4rem; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#zoomBtn { width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; padding: 0; display: grid; place-items: center; }
#zoomBtn:hover, #zoomBtn[aria-expanded="true"] { border-color: var(--acc); }
#zoomBtn svg { width: 1.45rem; height: 1.45rem; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.zpanel { position: absolute; top: calc(100% + 0.6rem); right: 0; z-index: 30; width: min(21rem, calc(100vw - 2rem)); padding: 0.8rem 0.9rem 0.9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px var(--shadow); }
.zhead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.55rem; font-weight: 700; }
.zhead button { width: 2.4rem; height: 2.4rem; min-width: 40px; min-height: 40px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; padding: 0; display: grid; place-items: center; }
.zhead button svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.zopts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
.zopts label { position: relative; display: grid; place-items: center; min-height: 44px; border: 2px solid var(--ctl); border-radius: 10px; cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; }
.zopts input { position: absolute; opacity: 0; pointer-events: none; }
.zopts label:has(input:checked) { border-color: var(--acc); background: var(--acc-fill); color: var(--acc); }
.zopts label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
:root[data-zoom="115"] main.step { zoom: 1.15; }
:root[data-zoom="130"] main.step { zoom: 1.3; }
:root[data-zoom="150"] main.step { zoom: 1.5; }

/* ---------- il passo ---------- */
main.step { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 1.4rem; }
.left { display: flex; flex-direction: column; gap: 0.75rem; min-height: 0; overflow: auto; padding: 0.2rem 0.3rem 0.2rem 0; }
.left h2 { margin: 0; font-size: 1.9rem; line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; }
.tag { display: inline-block; vertical-align: 0.3em; margin-left: 0.6rem; padding: 0.1rem 0.65rem; border: 2px solid var(--ctl); border-radius: 999px; font-size: 0.95rem; font-weight: 500; letter-spacing: 0.02em; color: var(--ink2); white-space: nowrap; }
.txt { font-size: 1.35rem; line-height: 1.45; }
.txt p { margin: 0 0 0.45em; }
.txt p:last-child { margin-bottom: 0; }
.def { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--acc); border-radius: 0 12px 12px 0; padding: 0.6rem 1rem 0.7rem; margin-bottom: 0.5em; }
.def .dl { font-size: 0.95rem; letter-spacing: 0.01em; font-weight: 700; color: var(--acc); margin-bottom: 0.15rem; }
.def p { margin: 0 0 0.3em; }
.def .fm { text-align: center; margin: 0.35em 0 0.2em; font-size: 1.1em; }

/* 1.08em: le cifre di STIX hanno la stessa altezza di quelle di Lexend, così i numeri nel testo e nelle formule sono uguali */
.m { font-family: var(--math); font-size: 1.08em; line-height: 1; white-space: nowrap; }
.m .m { font-size: 1em; }
.m i, i.m { font-style: italic; }
.m sup { font-size: 0.64em; line-height: 0; }
.m sub { font-size: 0.64em; line-height: 0; }
b { font-weight: 700; }
.frac { display: inline-flex; flex-direction: column; align-items: stretch; text-align: center; vertical-align: middle; line-height: 1.1; margin: 0 0.1em; }
.frac > span { padding: 0 0.15em; }
.frac > span:first-child { border-bottom: 0.06em solid currentColor; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.8rem; min-height: 0; overflow: auto; }
.fig { flex: 1 1 auto; min-height: 7rem; position: relative; }
.fig > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.col > .fig { align-self: stretch; }
.col { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; min-height: 0; }
.ctl { display: flex; gap: 0.8rem; justify-content: center; align-items: center; flex-wrap: wrap; }
.fb { margin: 0; padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 1.25rem; border-left: 5px solid; }
.fb.ok { background: var(--in-bg); border-color: var(--in); }
.fb.no { background: var(--out-bg); border-color: var(--out); }

/* bottoni */
.btn { font-size: 1.25rem; font-weight: 500; min-height: max(3rem, 44px); min-width: max(3rem, 44px); padding: 0 1.2rem; border-radius: 12px; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; box-shadow: 0 2px 0 var(--ctl); }
.btn:hover:not(:disabled) { border-color: var(--acc); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.pri { background: var(--acc); color: var(--on-acc); border-color: var(--acc); box-shadow: 0 2px 0 var(--shadow); }
.btn[aria-pressed="true"] { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.btn.opt[aria-pressed="true"] { color: inherit; }
.opt.ok { background: var(--in-bg) !important; border-color: var(--in) !important; color: var(--in) !important; }
.opt.no { background: var(--out-bg) !important; border-color: var(--out) !important; color: var(--out) !important; }
.opt.right:not(.ok) { border-color: var(--in); }
.btn.set { font-family: var(--math); font-size: 1.8rem; min-width: 4rem; }


.msg { margin: 0; min-height: 2.6rem; padding: 0.45rem 1rem; border-radius: 10px; font-size: 1.35rem; text-align: center; background: var(--chip); border-left: 5px solid var(--line); }
.msg.in { background: var(--in-bg); border-left-color: var(--in); }
.msg.out { background: var(--out-bg); border-left-color: var(--out); }
.msg.empty { visibility: hidden; }

.bigf { font-size: 2.6rem; text-align: center; margin: 0; }
.midf { font-size: 1.7rem; text-align: center; margin: 0; }

/* scelta dei valori */
.pl { font-size: 1.6rem; min-width: 2.6ch; text-align: right; margin-right: 0.2rem; }

/* i due membri */
.mems { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 0.7rem; width: 100%; }
.mbox { border: 2px solid var(--line); border-radius: 12px; padding: 0.45rem 0.8rem 0.6rem; background: var(--panel); min-width: 0; text-align: center; }
.mbox .ml { font-size: 1.1rem; color: var(--ink2); }
.mbox .mh { font-size: 1.35rem; margin: 0.15rem 0 0.35rem; }
.mbox.in { border-color: var(--in); background: var(--in-bg); }
.mbox.out { border-color: var(--out); background: var(--out-bg); }
.calc { font-family: var(--math); font-size: 1.6rem; line-height: 1.4; }
.calc .cs { white-space: nowrap; }
.rel { font-family: var(--math); font-size: 2.6rem; line-height: 1; }
.rel.in { color: var(--in); }
.rel.out { color: var(--out); }
.tarr { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 0.7rem; width: 100%; margin: -0.4rem 0; color: var(--acc); font-size: 1.35rem; text-align: center; }
.tarr .rel { visibility: hidden; }

/* tabelle */
.ttw { max-width: 100%; overflow-x: auto; }
.tt { border-collapse: collapse; }
.tt th, .tt td { border: 1px solid var(--line); padding: 0.3rem 0.7rem; text-align: center; }
.tt th { font-weight: 400; font-size: 1.15rem; }
.tt th.rh { text-align: left; }
.tt th.rh .m { font-size: 1.5rem; }
.tt td { font-family: var(--math); font-size: 1.7rem; min-width: 5.5rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tt td.in { background: var(--in-bg); color: var(--in); }
.tt td.out { background: var(--out-bg); color: var(--out); font-weight: 700; }
.tt td.vd { font-family: var(--ui); font-size: 1.3rem; font-weight: 700; }
.tt .cb { font-family: var(--math); font-size: 1em; min-width: 3.2rem; min-height: 44px; padding: 0 0.6rem; border: 2px dashed var(--ctl); border-radius: 10px; background: var(--chip); color: var(--ink2); cursor: pointer; }
.tt .cb:hover { border-color: var(--acc); }
.dt { border-collapse: collapse; width: min(100%, 40rem); }
.dt th { font-weight: 400; font-size: 1rem; color: var(--ink2); padding: 0.2rem 0.4rem; border-bottom: 2px solid var(--line); }
.dt th .m { font-size: 1.45rem; color: var(--ink); }
.dt td { padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--line); text-align: center; }
.dt td.v { font-family: var(--math); font-size: 1.4rem; white-space: nowrap; }
.dt td.in { color: var(--in); font-weight: 700; }
.dt td.out { color: var(--out); }

/* passaggi */
.dblk { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 0.4rem 1rem 0.55rem; background: var(--panel); }
.dblk .ml { font-size: 1.1rem; color: var(--ink2); }
.drow { display: flex; align-items: baseline; justify-content: space-between; gap: 0.2rem 1rem; flex-wrap: wrap; }
.drow .e { font-family: var(--math); font-size: 1.75rem; line-height: 1.45; }
.drow .e sup, .drow .e sub { font-size: 0.64em; line-height: 0; }
.drow .e i { font-style: italic; }
.drow .why { font-size: 1.25rem; color: var(--ink); }
.drow.hide { visibility: hidden; }
.drow.ok .e, .drow.no .e { background: var(--in-bg); color: var(--in); border-radius: 6px; padding: 0 0.3rem; margin-left: -0.3rem; }
.drow.no .e { background: var(--out-bg); color: var(--out); }
/* esercizi «soluzioni in insiemi diversi» */
.vrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 1rem 2.2rem; }
.exl { display: grid; grid-template-columns: max-content max-content minmax(max-content, 1fr); justify-content: center; gap: 0.55rem 1rem; align-items: center; width: min(100%, 52rem); max-width: 100%; }
.exl .lt { font-weight: 700; font-size: 1.3rem; }
.exl .xf { font-size: 1.3rem; }
.exl .bs { display: flex; gap: 0.5rem; }
.exl .fb { grid-column: 1 / -1; margin-top: -0.25rem; width: 0; min-width: 100%; }
.cx { text-decoration: line-through; text-decoration-color: var(--out); text-decoration-thickness: 0.09em; color: var(--ink2); }
.tn { background: var(--hl); border-radius: 4px; padding: 0 0.12em; }

/* parentesi sotto una parte della formula */
.ub { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top; }
.ub .br { align-self: stretch; height: 0.4rem; border: 2px solid var(--acc); border-top: 0; border-radius: 0 0 8px 8px; margin-top: 0.3rem; }
.ub .lab { font-family: var(--ui); font-size: 1.1rem; font-style: normal; color: var(--acc); white-space: nowrap; margin-top: 0.25rem; line-height: 1.25; }
.cap { font-size: 1.05rem; color: var(--ink2); text-align: center; margin: 0; }

/* schede */
.kgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.8rem; width: 100%; }
.kgrid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kc { border: 2px solid var(--line); border-radius: 12px; padding: 0.5rem 0.7rem 0.6rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.45rem; min-width: 0; text-align: center; }
.kc.in { border-color: var(--in); background: var(--in-bg); }
.kc.out { border-color: var(--out); background: var(--out-bg); }
.kf { font-size: 1.4rem; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.2rem 0.6rem; }
.kt { font-size: 1.05rem; font-family: var(--ui); font-weight: 700; color: var(--acc); background: var(--acc-fill); border-radius: 999px; padding: 0.1rem 0.8rem; }
.kc.in .kv { color: var(--in); }
.kc.out .kv { color: var(--out); }
.kv { font-weight: 700; font-size: 1.2rem; }
.ks { font-size: 1.2rem; font-weight: 500; }
.kw { font-size: 1.05rem; color: var(--ink2); text-align: center; }
button.kc { font: inherit; color: inherit; background: var(--panel); border-color: var(--ctl); box-shadow: 0 2px 0 var(--ctl); cursor: pointer; min-height: 7rem; }
button.kc:hover { border-color: var(--acc); }
button.kc.in, button.kc.out { box-shadow: none; }
button.kc.in { background: var(--in-bg); border-color: var(--in); }
button.kc.out { background: var(--out-bg); border-color: var(--out); }
button.kc > span { display: block; }
button.kc > span.kf { display: flex; }
.kc .qs { font-size: 1.6rem; color: var(--ctl); font-family: var(--math); }
.krs { display: flex; flex-direction: column; gap: 0.3rem; width: 100%; }
.kr { font-size: 1.15rem; text-align: center; padding: 0.25rem 0.6rem; border-radius: 8px; border-left: 4px solid var(--line); background: var(--chip); width: 100%; }
.kr.in { background: var(--panel); border-color: var(--in); }
.kr.out { background: var(--panel); border-color: var(--out); }
.xbox { display: inline-block; border: 2px solid currentColor; border-radius: 6px; padding: 0 0.35em; margin-left: 0.2em; }
.bset { display: inline-flex; align-items: center; vertical-align: middle; }
.bset.tall .br { display: inline-block; transform: scaleY(1.9); margin: 0 0.06em; }

/* riquadro di una formula (come \boxed) */
/* schema ad albero: dal principio generale ai due princìpi */
.tree { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 54rem; }
.tree .tr { border: 2px solid var(--acc); border-radius: 12px; padding: 0.4rem 1.2rem; font-size: 1.35rem; font-weight: 700; color: var(--acc); background: var(--panel); text-align: center; }
.tree .fork { display: block; width: 50%; height: 2rem; overflow: visible; }
.tree .fork path { fill: none; stroke: var(--acc); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.bx { display: inline-block; border: 2px solid var(--acc); border-radius: 10px; padding: 0.2em 0.65em; background: var(--panel); }
.midf .bx { line-height: 1.45; }

/* freccia con l'operazione sopra (e, se serve, la freccia di ritorno sotto) */
.xa { display: inline-flex; flex-direction: column; align-items: stretch; vertical-align: middle; margin: 0 0.3em; color: var(--acc); line-height: 1.1; font-style: normal; }
.xa .xt { font-family: var(--math); font-size: 0.72em; text-align: center; padding: 0 0.45em; white-space: nowrap; }
.xa .xr { position: relative; height: 0.08em; min-width: 2.1em; margin: 0.14em 0.34em 0.14em 0; background: currentColor; }
.xa .xr::after { content: ""; position: absolute; top: 50%; right: -0.34em; transform: translateY(-50%); border-left: 0.42em solid currentColor; border-top: 0.21em solid transparent; border-bottom: 0.21em solid transparent; }
.xa .xr.back { margin: 0.14em 0 0.14em 0.34em; }
.xa .xr.back::after { right: auto; left: -0.34em; border-left: 0; border-right: 0.42em solid currentColor; }
.xa .off { visibility: hidden; }
.kc:has(> .kf.rv) { container-type: inline-size; }
.kf.rv { flex-wrap: nowrap; gap: 0; font-size: min(1.6rem, 10.5cqi); }   /* grande sulla LIM, ma dentro la scheda anche con lo zoom */

/* equazioni in catena: andata e ritorno */
.chain { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.5rem 0.2rem; font-size: 1.75rem; }
.chain .m { font-size: 1.15em; }
.eqb { display: inline-flex; flex-direction: column; align-items: center; gap: 0.3rem; border: 2px solid var(--line); border-radius: 12px; padding: 0.35rem 0.9rem 0.45rem; background: var(--panel); }
.eqb .sv { font-size: 0.8em; color: var(--in); }
.eqb.off, .eqb .off { visibility: hidden; }



/* universo e insieme delle soluzioni */
.vu { fill: var(--acc-fill); stroke: var(--acc); stroke-width: 4; }
.vs { fill: var(--in-bg); stroke: var(--in); stroke-width: 4; }
.vl { font-family: var(--math); font-style: italic; font-size: 46px; fill: var(--acc); }
.vl.s { fill: var(--in); }

/* tentativi */
.inp { font-family: var(--math); font-size: 1.6rem; width: 7em; min-height: max(3rem, 44px); padding: 0 0.6rem; border: 2px solid var(--ctl); border-radius: 12px; background: var(--panel); color: var(--ink); }
.inp:hover { border-color: var(--acc); }

/* ---------- navigazione ---------- */
footer.nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.nb { font-size: 1.25rem; font-weight: 500; min-height: max(3.1rem, 44px); min-width: 44px; padding: 0 1.7rem; border-radius: 999px; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; box-shadow: 0 2px 0 var(--ctl); }

/* ---------- animazioni ---------- */

/* passi di riepilogo: uno schema a tutta larghezza */

<!-- Conti mostrati nella pagina: funzioni pure, controllate anche fuori dal browser (C.check()). -->
<script id="calc">
const C = (() => {
	const n = v => v < 0 ? '−' + (-v) : String(v + 0);          // segno meno vero (e niente «−0»)
	const p = v => v < 0 ? '(' + n(v) + ')' : n(v);             // negativi tra parentesi
	const sq = (s, k = 2) => `${s}<sup>${k}</sup>`;
	const eq = (...t) => t.join(' = ');
	const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
	const R = (v, t) => ({ v, t });
	const SETS = ['N', 'Z', 'Q', 'R'];
	const inSet = (v, s) => s === 'N' ? Number.isInteger(v) && v >= 0 : s === 'Z' ? Number.isInteger(v) : true;
	const setH = vals => vals.length ? `{${vals.map(n).join(', ')}}` : '∅';
	const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
	// soluzioni intere di A(x) = B(x) cercate tra −20 e 20 (per le equazioni di questa lezione bastano)
	const solve = (A, B, xs = range(-20, 20)) => xs.filter(x => A(x) === B(x));
	const sq9 = x => R(x * x, eq(sq(p(x)), x * x));

	// frazioni esatte {a, b}, ridotte, con b > 0
	const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
	const Q = (a, b = 1) => { if (b < 0) { a = -a; b = -b; } const g = gcd(a, b) || 1; return { a: a / g, b: b / g }; };
	const qadd = (x, y) => Q(x.a * y.b + y.a * x.b, x.b * y.b);
	const qmul = (x, y) => Q(x.a * y.a, x.b * y.b);
	const qcmp = (x, y) => Math.sign(x.a * y.b - y.a * x.b);
	const qh = x => x.b === 1 ? n(x.a) : (x.a < 0 ? '−' : '') + frac(Math.abs(x.a), x.b);
	// numero scritto dai ragazzi (16, −3, 16,5 oppure 133/8) → frazione; null se non è un numero
	function parseQ(s) {
		s = String(s).trim().replace(/−/g, '-').replace(/\s+/g, '');
		let r = /^(-?)(\d{1,6})(?:[.,](\d{1,4}))?$/.exec(s);
		if (r) { const d = r[3] || ''; return Q((r[1] ? -1 : 1) * Number(r[2] + d), 10 ** d.length); }
		r = /^(-?\d{1,6})\/(\d{1,6})$/.exec(s);
		return r && +r[2] > 0 ? Q(+r[1], +r[2]) : null;
	}
	// valore decimale con la virgola, due cifre: «= …» se è esatto, «≈ …» se è arrotondato
	function qdec(x) {
		const r = Math.round(x.a / x.b * 100);
		return `${qcmp(Q(r, 100), x) === 0 ? '=' : '≈'} ${n(r / 100).replace('.', ',')}`;
	}

	// x + x/7 = 19: la soluzione 133/8 non si trova a tentativi
	const AGG = (() => {
		const L = x => qadd(x, qmul(x, Q(1, 7)));
		const sol = Q(19 * 7, 8), s7 = qmul(sol, Q(1, 7));      // 8x/7 = 19 → x = 133/8;  x/7 = 19/8
		return { L, sol, s7, t: eq(`${qh(sol)} + ${qh(s7)}`, frac(sol.a + s7.a, sol.b), n(qcmp(L(sol), Q(19)) === 0 ? 19 : NaN)) };
	})();
	// la stessa equazione resa sempre più semplice (ogni riga ha S = {133/8})
	const CHAIN = [
		x => qcmp(AGG.L(x), Q(19)) === 0,                  // x + x/7 = 19
		x => qcmp(qmul(Q(7), AGG.L(x)), Q(7 * 19)) === 0,  // 7(x + x/7) = 7 · 19
		x => qcmp(qadd(qmul(Q(7), x), x), Q(133)) === 0,   // 7x + x = 133
		x => qcmp(qmul(Q(8), x), Q(133)) === 0,            // 8x = 133
		x => qcmp(x, Q(133, 8)) === 0                      // x = 133/8
	];

	// esempio guida: 3x − 2 = 7, soluzione 3
	const A3 = x => 3 * x - 2;
	const GUIDE = { S: solve(A3, () => 7), S2: solve(x => 3 * x, () => 9), A0: A3(3), T0: A3(3) + 2, At: eq('3 · 3 − 2', A3(3)) };
	// la stessa operazione T sui due membri, con x = 3 (i due membri valgono 7)
	const TOPS = [
		{ k: 'p', lab: 'aggiungo 2', op: '+ 2', T: v => v + 2, h: s => `${s} + 2`, A: '3x − 2 + 2', B: '7 + 2' },
		{ k: 'm', lab: 'moltiplico per 3', op: '· 3', T: v => 3 * v, h: (s, e) => `3 · ${e ? `(${s})` : s}`, A: '3(3x − 2)', B: '3 · 7' },
		{ k: 's', lab: 'elevo al quadrato', op: 'al quadrato', T: v => v * v, h: (s, e) => sq(e ? `(${s})` : s), A: '(3x − 2)^2', B: '7^2' }
	].map(o => ({ ...o, v: o.T(A3(3)), At: eq(o.h('3 · 3 − 2', true), o.h('7'), o.T(A3(3))), Bt: eq(o.h('7'), o.T(7)) }));
	// x = 1 e x² = 1
	const SQ1 = { S1: solve(x => x, () => 1), S2: solve(x => x * x, () => 1) };
	// reversibile o no
	const REV = { p2: [5, 5 + 2, 5 + 2 - 2], t3: [5, 5 * 3, 5 * 3 / 3], sq: [[1, 1 * 1], [-1, (-1) * (-1)]], z: [3 * 0, 5 * 0] };
	// i princìpi: x + 5 = 12, 3x = 9, x = 3 per 0
	const P1 = { S: solve(x => x + 5, () => 12), d: 12 - 5 };
	const P2 = { S: solve(x => 3 * x, () => 9), d: 9 / 3 };
	const ZERO = { S: solve(x => x, () => 3), all: range(-20, 20).every(x => x * 0 === 3 * 0) };
	// esercizi a, b, c
	const HOW = [
		{ A: x => x - 4, B: () => 6, S: [10], chk: R(6, eq('10 − 4', 10 - 4)) },
		{ A: x => x + 5, B: x => x, S: [] },
		{ A: x => 2 * (x + 3), B: x => 2 * x + 6, S: 'U' }
	];
	const mul = (a, x, xs = p(x)) => R(a * x, eq(`${a} · ${xs}`, n(a * x)));
	// esercizi «soluzioni in insiemi diversi» (spostati dalla lezione 1)
	const PT4chk = [R(-14, eq('2 · (−7)', '−14')), R(2, eq(`5 · ${frac(2, 5)}`, 2)), [R(5, eq(sq('(−√5)'), 5)), R(5, eq(sq('(√5)'), 5))]];
	const PT4 = [
		{ f: '2x = −14', test: x => 2 * x === -14, sol: -7, h: '−7', why: {
			N: [mul(2, 0)], Z: [mul(2, -7)], Q: [mul(2, -7)] } },
		{ f: '5x = 2', test: x => 5 * x === 2, sol: 2 / 5, h: frac(2, 5), why: {
			N: [0, 1].map(x => mul(5, x)), Z: [-1, 0, 1].map(x => mul(5, x)), Q: [mul(5, 2 / 5, frac(2, 5))] } },
		{ f: 'x^2 = 5', h: '−√5, √5' }
	];
	// il segno del numero davanti alla x: −2x = 10, −x = 16
	const SIGN = { a: solve(x => -2 * x, () => 10)[0], b: solve(x => -x, () => 16)[0] };

	// equivalenti in quale universo? Le soluzioni reali di ciascuna; in ogni U si tengono quelle che stanno in U
	const EQV = [
		{ e: ['5x − 2 = 18', 'x^2 = 16'], sol: [[4], [-4, 4]], pat: 'N' },
		{ e: ['2x = 1', '3x = 2'], sol: [[{ v: 1 / 2, h: frac(1, 2) }], [{ v: 2 / 3, h: frac(2, 3) }]], pat: 'NZ' },
		{ e: ['x + 5 = 2', '2x = −6'], sol: [[-3], [-3]], pat: 'NZQR' }
	].map(E => {
		const sol = E.sol.map(L => L.map(q => typeof q === 'number' ? { v: q, h: n(q) } : q));
		const U = Object.fromEntries(SETS.map(s => {
			const [S1, S2] = sol.map(L => L.filter(q => inSet(q.v, s)));
			return [s, { S1, S2, eq: S1.length === S2.length && S1.every((q, i) => q.v === S2[i].v) }];
		}));
		return { ...E, sol, U };
	});
	const WHERE = { f: 'x^2 = 9', sols: [-3, 3], why: { N: [sq9(3)], Z: [sq9(3), sq9(-3)], Q: [sq9(3), sq9(-3)], R: [sq9(3), sq9(-3)] } };
	const WHERE2 = { f: 'x^2 = 2', sols: [{ v: -Math.SQRT2, h: '−√2' }, { v: Math.SQRT2, h: '√2' }],
		why: { N: [], Z: [], Q: [], R: [R(2, eq(sq('(√2)'), 2)), R(2, eq(sq('(−√2)'), 2))] },
		// 2 sta tra 1² e 2²: nessun naturale (o intero) ha quadrato 2
		note: { N: `<span class="m">${eq(sq(0), 0)}</span> e <span class="m">${eq(sq(1), 1)}</span> sono minori di 2.<br>Da 2 in poi i quadrati sono <span class="m">${eq(sq(2), 4)}</span>, <span class="m">${eq(sq(3), 9)}</span>, …: tutti maggiori di 2.<br><b>Quindi nessun numero naturale ha quadrato 2</b>.`,
			Z: `<span class="m">${eq(sq(0), 0)}</span>, <span class="m">${eq(sq(1), 1)}</span> e <span class="m">${eq(sq('(−1)'), 1)}</span> sono minori di 2.<br>Gli altri interi hanno quadrati <span class="m">${eq(sq(2), sq('(−2)'), 4)}</span>, <span class="m">${eq(sq(3), sq('(−3)'), 9)}</span>, …: tutti maggiori di 2.<br><b>Quindi nessun numero intero ha quadrato 2</b>.`,
			Q: 'nessuna frazione ha per quadrato 2', R: '' } };
	// S nei quattro universi
	const UTAB = [
		{ f: 'x^2 = 9', S: Object.fromEntries(SETS.map(s => [s, setH(WHERE.sols.filter(v => inSet(v, s)))])) },
		{ f: 'x^2 = 2', S: Object.fromEntries(SETS.map(s => [s, s === 'R' ? `{${WHERE2.sols.map(q => q.h).join(', ')}}` : '∅'])) }
	];

	// controllo di tutti i numeri mostrati: restituisce l'elenco di ciò che non torna
	function check() {
		const bad = [], ok = (c, s) => { if (!c) bad.push(s); };
		const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
		const xs = range(-20, 20);
		ok(WHERE.sols.every(x => x * x === 9) && same(solve(x => x * x, () => 9), [-3, 3]), 'x² = 9');
		ok(WHERE2.sols.every(q => Math.abs(q.v * q.v - 2) < 1e-12), 'x² = 2');
		ok(UTAB[0].S.N === '{3}' && UTAB[0].S.Z === '{−3, 3}' && UTAB[1].S.Q === '∅', 'tabella U');
		ok(AGG.sol.a === 133 && AGG.sol.b === 8 && AGG.s7.a === 19 && AGG.s7.b === 8 && AGG.sol.a + AGG.s7.a === 152 && 152 / 8 === 19, 'x + x/7 = 19');
		ok(CHAIN.every(t => t(AGG.sol)) && !CHAIN.some(t => t(Q(16))), 'catena 133/8');
		ok(same(GUIDE.S, [3]) && same(GUIDE.S2, [3]) && GUIDE.A0 === 7 && GUIDE.T0 === 9 && 9 - 2 === 7, '3x − 2 = 7');
		ok(same(TOPS.map(o => o.v), [9, 21, 49]), 'operazioni T');
		ok(same(SQ1.S1, [1]) && same(SQ1.S2, [-1, 1]), 'x = 1 → x² = 1');
		ok(same(REV.p2, [5, 7, 5]) && same(REV.t3, [5, 15, 5]) && REV.sq[0][1] === REV.sq[1][1] && same(REV.z, [0, 0]), 'reversibili');
		ok(same(P1.S, [7]) && P1.d === 7 && same(P2.S, [3]) && P2.d === 3, 'princìpi');
		ok(same(ZERO.S, [3]) && ZERO.all, 'per 0');
		ok(same(solve(HOW[0].A, HOW[0].B), [10]) && HOW[0].chk.v === 6, 'esercizio a');
		ok(solve(HOW[1].A, HOW[1].B).length === 0 && xs.every(x => HOW[1].A(x) - HOW[1].B(x) === 5), 'esercizio b');
		ok(solve(HOW[2].A, HOW[2].B).length === xs.length, 'esercizio c');
		ok(PT4[0].test(-7) && PT4[1].test(2 / 5) && PT4chk[0].v === -14 && PT4chk[1].v === 2 && PT4chk[2].every(q => q.v === 5), 'soluzioni in insiemi diversi');
		ok(SIGN.a === -5 && SIGN.b === -16, 'segno');
		ok(same(solve(x => 5 * x - 2, () => 18), [4]) && same(solve(x => x * x, () => 16), [-4, 4]), 'equivalenti a');
		ok(solve(x => 2 * x, () => 1).length === 0 && solve(x => 3 * x, () => 2).length === 0 && 2 * (1 / 2) === 1 && Math.abs(3 * (2 / 3) - 2) < 1e-12, 'equivalenti b');
		ok(same(solve(x => x + 5, () => 2), [-3]) && same(solve(x => 2 * x, () => -6), [-3]), 'equivalenti c');
		ok(EQV.every(E => SETS.filter(s => E.U[s].eq).join('') === E.pat), 'equivalenti: in quali universi');
		ok(qcmp(parseQ('16,625'), Q(133, 8)) === 0 && qcmp(parseQ('133/8'), Q(133, 8)) === 0 && parseQ('ciao') === null && parseQ('1/0') === null, 'lettura dei numeri');
		ok(qdec(AGG.L(Q(16))) === '≈ 18,29' && qdec(AGG.L(Q(133, 8))) === '= 19', 'decimali');
		return bad;
	}

	return { n, p, sq, frac, SETS, inSet, setH, Q, qh, qcmp, qdec, parseQ, AGG, CHAIN, GUIDE, TOPS, SQ1, REV, P1, P2, ZERO, HOW, PT4, PT4chk, SIGN, EQV, WHERE, WHERE2, UTAB, check };
})();
</script>

<script>
(() => {
	'use strict';
	const $ = id => document.getElementById(id);
	const root = document.documentElement;

	// ---------- tema: chiaro di default, la scelta resta salvata ----------
	function applyTheme(dark, save) {
		root.dataset.theme = dark ? 'dark' : 'light';
		$('themeGlyph').textContent = dark ? '☀' : '☾';
		$('theme').setAttribute('aria-label', dark ? 'Attiva il tema chiaro' : 'Attiva il tema scuro');
		$('theme').title = dark ? 'Tema chiaro' : 'Tema scuro';
		if (save) { try { localStorage.setItem('matematica-tema', dark ? 'dark' : 'light'); } catch (e) {} }
	}
	let saved = null;
	try { saved = localStorage.getItem('matematica-tema'); } catch (e) {}
	applyTheme(saved === 'dark', false);
	$('theme').addEventListener('click', () => applyTheme(root.dataset.theme !== 'dark', true));

	// ---------- dimensione dei contenuti (zoom del passo), scelta salvata ----------
	const zInputs = [...document.querySelectorAll('[name="zoomLevel"]')];
	function applyZoom(v, save) {
		const z = ['100', '115', '130', '150'].includes(v) ? v : '100';
		root.dataset.zoom = z;
		zInputs.forEach(i => { i.checked = i.value === z; });
		if (save) { try { localStorage.setItem('matematica-zoom', z); } catch (e) {} }
	}
	let zSaved = null;
	try { zSaved = localStorage.getItem('matematica-zoom'); } catch (e) {}
	applyZoom(zSaved, false);
	zInputs.forEach(i => i.addEventListener('change', () => { if (i.checked) applyZoom(i.value, true); }));
	function setZoomMenu(open, back) {
		$('zpanel').hidden = !open;
		$('zoomBtn').setAttribute('aria-expanded', String(open));
		if (open) (zInputs.find(i => i.checked) || zInputs[0]).focus();
		else if (back) $('zoomBtn').focus();
	}
	$('zoomBtn').addEventListener('click', () => setZoomMenu($('zpanel').hidden));
	$('zclose').addEventListener('click', () => setZoomMenu(false, true));
	document.addEventListener('pointerdown', e => { if (!$('zpanel').hidden && !$('zmenu').contains(e.target)) setZoomMenu(false, false); });
	document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('zpanel').hidden) { e.preventDefault(); setZoomMenu(false, true); } }, true);

	// ---------- piccoli aiuti per il testo ----------
	const m = s => `<span class="m">${s}</span>`;
	// lettere in corsivo, potenze in apice, indici in pedice (x_0 → x₀); solo formule, mai testo o HTML
	const F = s => s.replace(/[abctxyABEPSTU]/g, '<i>$&</i>').replace(/\^(\d)/g, '<sup>$1</sup>').replace(/_(\d)/g, '<sub>$1</sub>');
	const f = s => m(F(s));
	const P = s => `<p>${s}</p>`;
	const DL = (lab, s) => `<div class="def"><div class="dl">${lab}</div>${s}</div>`;
	const FM = s => `<p class="fm">${s}</p>`;
	const SYM = { N: 'ℕ', Z: 'ℤ', Q: 'ℚ', R: 'ℝ' };
	const NAME = { N: 'numeri naturali', Z: 'numeri interi', Q: 'numeri razionali', R: 'numeri reali' };
	const NN = m('ℕ'), ZZ = m('ℤ'), QQ = m('ℚ'), RR = m('ℝ');
	const bset = (inner, o = '{', c = '}') => `<span class="bset${inner.includes('class="frac"') ? ' tall' : ''}"><span class="br">${o}</span><span>${inner}</span><span class="br">${c}</span></span>`;
	const msg = (h, c = '') => `<p class="msg ${h ? c : 'empty'}">${h || '&nbsp;'}</p>`;
	const fig = (W, H, inner, label, cls = '') => `<div class="fig ${cls}"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${label}">${inner}</svg></div>`;
	const calc = t => `<span class="calc">${t.split(' = ').map((s, i) => `<span class="cs">${i ? '= ' : ''}${s}</span>`).join(' ')}</span>`;
	const ub = (e, lab) => `<span class="ub"><span class="e">${e}</span><span class="br"></span><span class="lab">${lab}</span></span>`;
	// due membri affiancati, con = in mezzo
	const mems = (L, R) => `<div class="mems">
		<div class="mbox in">${L.lab ? `<div class="ml">${L.lab}</div>` : ''}<div class="mh">${L.h}</div>${calc(L.t)}</div>
		<span class="rel in" role="img" aria-label="uguale">=</span>
		<div class="mbox in">${R.lab ? `<div class="ml">${R.lab}</div>` : ''}<div class="mh">${R.h}</div>${calc(R.t)}</div></div>`;
	// passaggi scoperti uno alla volta
	const drow = (e, why, show, cls = '') => `<div class="drow ${show ? cls : 'hide'}"${show ? '' : ' aria-hidden="true"'}><span class="e">${e}</span><span class="why">${why}</span></div>`;
	const rows = (k, list, lab = '', okLast = '') => `<div class="dblk">${lab ? `<div class="ml">${lab}</div>` : ''}${list.map(([e, w], j) => drow(typeof e === 'string' ? F(e) : e.h, w, j <= k, okLast && j === list.length - 1 ? okLast : '')).join('')}</div>`;
	const nextCtl = (k, max, lab = 'Ricomincia') => `<div class="ctl"><button type="button" class="btn pri" data-act="next" data-k="next"${k >= max ? ' disabled' : ''}>passaggio successivo</button><button type="button" class="btn" data-act="reset" data-k="reset" aria-label="${lab}">↺</button></div>`;
	const stepAct = max => (st, a) => { st.k = a === 'next' ? Math.min(max, st.k + 1) : 0; };
	const tn = s => `<span class="tn">${s}</span>`;
	// divisioni scritte come frazioni (in seconda niente «:» nei calcoli)
	const fr = (a, b) => C.frac(F(a), F(b));
	const frEq = (a, b, c, d) => ({ h: `${fr(a, b)} = ${fr(c, d)}` });
	const bx = s => `<span class="bx">${s}</span>`;
	// freccia con l'operazione sopra; con due etichette: andata sopra, ritorno sotto
	const xa = t => `<span class="xa"><span class="xt">${t}</span><span class="xr"></span><span class="xt">&nbsp;</span></span>`;
	const xab = (t, b, s1 = true, s2 = true) => `<span class="xa"><span class="xt${s1 ? '' : ' off'}">${t}</span><span class="xr${s1 ? '' : ' off'}"></span><span class="xr back${s2 ? '' : ' off'}"></span><span class="xt${s2 ? '' : ' off'}">${b}</span></span>`;
	const eqb = (e, sv = '', show = true, svShow = true) => `<span class="eqb${show ? '' : ' off'}">${e}${sv ? `<span class="sv${svShow ? '' : ' off'}">${sv}</span>` : ''}</span>`;
	const setS = (vals, h = C.n) => vals.length ? `{${vals.map(h).join(', ')}}` : '∅';
	const SS = (i, vals) => m(`${F(`S_${i}`)} = ${setS(vals)}`);
	const why = rs => rs.map(r => m(r.t)).join(', ');
	const setBtns = (act, on, keys) => `<div class="ctl">${keys.map(k => `<button type="button" class="btn set" data-act="${act}" data-v="${k}" data-k="${act}${k}" aria-pressed="${on(k)}" aria-label="${NAME[k]}">${SYM[k]}</button>`).join('')}</div>`;
	// schede da scoprire: davanti sempre visibile, dietro dopo il tocco
	const card = (st, i, front, back, cls = 'in', hid = '?') => `<button type="button" class="kc ${st.open[i] ? cls : ''}" data-act="o" data-v="${i}" data-k="o${i}" aria-expanded="${!!st.open[i]}">${front}${st.open[i] ? back : `<span class="qs">${hid}</span>`}</button>`;
	const openAct = (st, a, v) => { st.open[v] = 1; };
	const ORD = C.SETS;
	const sost = x => `Sostituendo <span class="xbox">${m(`${F('x')} = ${C.n(x)}`)}</span>`;
	// esercizio: una riga per voce, risposta subito
	const quiz = (st, items, opts, cls = '') => `<div class="exl">${items.map((it, i) => {
		const a = st.ans[i], ok = a === it.ans;
		return `<span class="lt">${'abcd'[i]}.</span><span class="xf">${it.h ?? f(it.f)}</span><span class="bs">${opts.map(([t, v]) =>
			`<button type="button" class="btn opt ${cls} ${a === v ? (ok ? 'ok' : 'no') : ''} ${a != null && v === it.ans ? 'right' : ''}" data-act="ans" data-v="${i},${v}" data-k="a${i}-${v}" aria-pressed="${a === v}">${t}</button>`).join('')}</span>` +
			(a != null ? `<p class="fb ${ok ? 'ok' : 'no'}">${it.fb}</p>` : '');
	}).join('')}</div>`;
	const ansAct = (st, a, v) => { const [i, x] = v.split(','); st.ans[+i] = x; };

	// ---------- retta dei numeri ----------
	function nline(o) {
		const { n0, n1, x0, x1, y } = o, k = (x1 - x0) / (n1 - n0), X = v => x0 + (v - n0) * k;
		let s = `<line class="ax" x1="${x0 - 0.6 * k}" y1="${y}" x2="${x1 + 0.75 * k}" y2="${y}" marker-end="url(#ah-ink)"/>`;
		for (let v = n0; v <= n1; v++) {
			const x = X(v);
			s += `<line class="tk" x1="${x}" y1="${y - 11}" x2="${x}" y2="${y + 11}"/><text class="tl" x="${x}" y="${y + 51}">${C.n(v)}</text>`;
		}
		return { s, X, k };
	}
	// soluzioni sulla retta: punti verdi, quelli aggiunti arancioni; full = tutta la retta
	function solLine(pts, full, label) {
		const L = nline({ n0: -4, n1: 4, x0: 110, x1: 870, y: 150 }), X = L.X;
		let g = L.s;
		if (full) g += `<line class="rline" x1="${X(-4) - 0.5 * L.k}" y1="150" x2="${X(4) + 0.5 * L.k}" y2="150"/><text class="slab acc" x="${X(0)}" y="60">tutti i numeri</text>`;
		for (const q of pts) {
			const c = q.add ? 'add' : 'in';
			g += `<circle class="${q.add ? 'ringadd' : 'ringin'}" cx="${X(q.v)}" cy="150" r="11"/><text class="sm ${c}" x="${X(q.v)}" y="105">${C.n(q.v)}</text>` +
				(q.add ? `<text class="slab add" x="${X(q.v)}" y="60">aggiunta</text>` : '');
		}
		return fig(1000, 225, g, label);
	}

	// ---------- dove cerchiamo: un'equazione, le sue soluzioni sulla retta e S nell'universo scelto ----------
	function whereView(st, which) {
		const s = st.s, L = nline({ n0: -4, n1: 4, x0: 110, x1: 870, y: 170 }), X = L.X;
		let g = L.s;
		if (s === 'R') g += `<line class="rline" x1="${X(-4) - 0.5 * L.k}" y1="170" x2="${X(4) + 0.5 * L.k}" y2="170"/>`;   // in ℝ la retta è piena
		else {
			// in ℚ tutte le frazioni con denominatore fino a 8: fitte e non equidistanti
			const pts = new Set();
			if (s === 'Q') { for (let d = 1; d <= 8; d++) for (let k = -4 * d; k <= 4 * d; k++) pts.add(k / d); }
			else for (let v = s === 'N' ? 0 : -4; v <= 4; v++) pts.add(v);
			for (const v of pts) g += `<circle class="dot" cx="${X(v)}" cy="170" r="${Number.isInteger(v) ? 8 : 2.5}"/>`;
		}
		let ff, Sh, ww, ok;
		if (which === 0) {
			const e = C.WHERE;
			for (const v of e.sols) {
				const o = C.inSet(v, s), x = X(v);
				g += `<circle class="${o ? 'ringin' : 'ring'}" cx="${x}" cy="170" r="10"/><text class="sm ${o ? 'in' : 'out'}" x="${x}" y="100">${C.n(v)}</text>`;
			}
			const S = e.sols.filter(v => C.inSet(v, s)), t = s === 'N' ? `${m('−3')} non è in ${NN}` : '';
			ff = e.f; Sh = setS(S); ww = why(e.why[s]) + (t ? ': ' + t : ''); ok = S.length > 0;
		} else {
			const e = C.WHERE2;
			ok = s === 'R';
			for (const q of e.sols) {
				const x = X(q.v);
				g += `<circle class="${ok ? 'ringin' : 'ring'}" cx="${x}" cy="170" r="10"/><text class="sm ${ok ? 'in' : 'out'}" x="${x}" y="100">${q.h}</text>`;
			}
			const w = why(e.why[s]), t = e.note[s];
			ff = e.f; Sh = ok ? `{${e.sols.map(q => q.h).join(', ')}}` : '∅'; ww = w + (w && t ? ': ' : '') + (t || '');
		}
		return setBtns('s', k => k === s, ['N', 'Z', 'Q', 'R']) + fig(1000, 250, g, 'le soluzioni sulla retta dei numeri') +
			`<div class="col"><div class="kc ${ok ? 'in' : 'out'}" style="width:min(100%,36rem)"><div class="kf">${f(ff)}</div><div class="ks">Con ${f(`U = ${SYM[s]}`)}, ${m(`${F('S')} = ${Sh}`)}</div><div class="kw">${ww}</div></div></div>`;
	}

	// U con dentro S (anche piccolo, per le inclusioni)
	const venn = () => `<div class="fig" style="max-height:13rem"><svg viewBox="0 0 1000 300" role="img" aria-label="l’insieme delle soluzioni S dentro l’insieme universo U">
		<rect class="vu" x="230" y="20" width="540" height="260" rx="34"/><text class="vl" x="262" y="76">U</text>
		<ellipse class="vs" cx="545" cy="168" rx="160" ry="82"/><text class="vl s" x="545" y="184" text-anchor="middle">S</text></svg></div>`;

	// ---------- i passi ----------
	const CH = [
		['L’insieme universo', 'Universo'],
		['Equazioni equivalenti', 'Equivalenti'],
		['Il principio generale di equivalenza', 'Principio generale'],
		['I due princìpi', 'Due princìpi'],
		[`Che cosa può succedere a ${f('S')}?`, 'Tre casi'],
		['Riepilogo', 'Riepilogo']
	];
	const plain = s => s.replace(/<[^>]+>/g, '');
	const MAP_ARROW = '<span class="mc" aria-hidden="true"><svg viewBox="0 0 48 24"><path d="M4,12 H38" marker-end="url(#ah-acc)"/></svg></span>';
	const G = C.GUIDE, SOLH = C.qh(C.AGG.sol);
	const AGGF = `${F('x')} + ${C.frac(F('x'), 7)} = 19`;

	// gli esercizi a, b, c: i passaggi, la domanda finale e la risposta
	const EXR = [
		{ f: 'x − 4 = 6', rows: [['x − 4 = 6', ''], ['x − 4 + 4 = 6 + 4', '+ 4 da tutti e due i lati (primo principio)'], ['x = 10', 'calcoli']],
			end: () => msg(`Verifica: ${m(C.HOW[0].chk.t)}.<br><b>Quindi ${m(`${F('S')} = ${setS(C.HOW[0].S)}`)}: una sola soluzione</b>.`, 'in') },
		{ f: 'x + 5 = x', rows: [['x + 5 = x', ''], ['x + 5 − x = x − x', `${f('− x')} da tutti e due i lati (primo principio)`], ['5 = 0', 'termini simili']], q: '5 = 0',
			end: () => msg(`Per nessuno: ${m('5 = 0')} è sempre falsa.<br><b>Quindi ${f('S = ∅')}</b>.`, 'out') },
		{ f: '2(x + 3) = 2x + 6', rows: [['2(x + 3) = 2x + 6', ''], ['2x + 6 = 2x + 6', 'proprietà distributiva'], ['2x + 6 − 2x − 6 = 2x + 6 − 2x − 6', `${f('− 2x − 6')} da tutti e due i lati (primo principio)`], ['0 = 0', 'termini simili']], q: '0 = 0',
			end: () => msg(`Per tutti: ${m('0 = 0')} è sempre vera.<br><b>Quindi ${f('S = U = ℝ')}</b>.`, 'in') }
	];
	const NAMES = [['determinata', 'in', `${m(`${F('S')} = {10}`)}`, 'finito, non vuoto'], ['impossibile', 'out', f('S = ∅'), 'vuoto'], ['indeterminata', 'in', f('S = U'), 'infinito']];

	const STEPS = [
		// ---------- «L’insieme universo» ----------
		// 1
		{ ch: 0, title: 'L’insieme universo',
			text: P(`Trattiamo equazioni in una sola incognita, ${f('x')}: per questo un’equazione la indichiamo sempre con ${f('A(x) = B(x)')}.`) +
				P(`${f('A(x)')} è il primo membro, ${f('B(x)')} il secondo membro.`) +
				DL('Definizione (Insieme universo)', P(`L’insieme in cui cerchiamo le soluzioni di un’equazione si chiama <b>insieme universo</b> e si indica con ${f('U')}.`) +
				P(`L’insieme delle soluzioni ${f('S')} è formato dagli elementi ${f('x')} dell’universo ${f('U')} che rendono vera l’equazione.`) +
				P(`Se non diciamo diversamente, ${f('U = ℝ')}.`)),
			view: () => `<div class="col"><p class="bigf">${m(`${F('S')} = {${ub(F('x ∈ U'), 'gli elementi<br>dell’universo')} | ${ub(F('A(x) = B(x)'), 'che rendono vera<br>l’equazione')}}`)}</p>
				<p class="cap">${m('|')} si legge «tali che».</p>
				${venn()}<p class="midf"><b>Quindi ${f('S ⊆ U')}</b>.</p></div>`
		},
		// 2
		{ ch: 0, title: `Le soluzioni che stanno in ${f('U')}`,
			text: P(`I numeri reali che rendono vera ${f('x^2 = 9')} sono ${m('−3')} e ${m('3')}.`) + P(`Quali stanno nell’universo ${f('U')}?`),
			init: () => ({ s: 'N' }),
			view: st => whereView(st, 0),
			act(st, a, v) { st.s = v; }
		},
		// 3
		{ ch: 0, title: 'Nessuna soluzione razionale',
			text: P(`I numeri reali che rendono vera ${f('x^2 = 2')} sono ${m('−√2')} e ${m('√2')}, che non si scrivono come frazione.`) + P(`Quali stanno nell’universo ${f('U')}?`),
			init: () => ({ s: 'Q' }),
			view: st => whereView(st, 1),
			act(st, a, v) { st.s = v; }
		},
		// 4
		{ ch: 0, title: `${f('S')} dipende dall’universo`,
			text: st => P(`Ricapitoliamo: quanto vale ${f('S')} in ogni universo?`) +
				(C.UTAB.every((r, i) => C.SETS.every(s => st.open[i + s])) ? P('<b>Quindi la stessa equazione può avere insiemi delle soluzioni diversi se cambia l’universo.</b>') : ''),
			init: () => ({ open: {} }),
			view(st) {

		// esercizi: soluzioni in insiemi diversi (spostati dalla lezione 1): S è dato, si verifica e si dice dove sta

			text: P(`Con ${f('U = ℝ')}, l’insieme delle soluzioni di ${f(C.PT4[j].f)} è ${m(`${F('S')} = ${bset(C.PT4[j].h)}`)}.`) +

			init: () => ({ ver: 0, ans: [] }),
			view(st) {
				const e = C.PT4[j], chk = C.PT4chk[j], small = ['Z', 'Q', 'R'][j];
				const vbox = !st.ver ? `<div class="ctl"><button type="button" class="btn pri" data-act="ver" data-k="ver">verifica</button></div>`
					: j < 2 ? `<p class="msg in">${sost(e.sol).replace(C.n(e.sol), e.h)}<br>${m(chk.t)}<br><b>Quindi ${m(e.h)} è una soluzione</b>.</p>`
					: `<p class="msg in">Sostituendo <span class="xbox">${m(`${F('x')} = −√5`)}</span><br>${m(chk[0].t)}<br>Sostituendo <span class="xbox">${m(`${F('x')} = √5`)}</span><br>${m(chk[1].t)}<br><b>Quindi ${m('−√5')} e ${m('√5')} sono soluzioni</b>.</p>`;

					`${m(`${e.h} ∈ ℚ`)} (quindi anche in ${RR}), ma non è un intero: ${m(`${e.h} ∉ ℤ`)}, ${m(`${e.h} ∉ ℕ`)}.`,

					`${m(`${F('S')} = ${bset(e.h)} ⊂ ℚ`)}.<br>Se ${f('U')} è ${QQ} o ${RR}, allora ${m(`${F('S')} = ${bset(e.h)}`)}.<br>Se ${f('U')} è ${NN} o ${ZZ}, allora ${m(`${F('S')} = ∅`)}.`,
					`${m(`${F('S')} = {−√5, √5} ⊂ ℝ`)}.<br>Se ${f('U')} è ${RR}, allora ${m(`${F('S')} = {−√5, √5}`)}.<br>Se ${f('U')} è ${NN}, ${ZZ} o ${QQ}, allora ${m(`${F('S')} = ∅`)}.`][j], 'in');

		// ---------- «Equazioni equivalenti» ----------

		{ ch: 1, title: 'A tentativi non basta',

					card(st, 1, `<span class="kf">${f('x^2 = 9')}<span>e</span>${f('x = 3')}</span>`, `<span class="kf">${SS(1, S9)}</span><span class="kf">${SS(2, F3)}</span><span class="kv">non equivalenti</span>`, 'out', `${f('S_1')}, ${f('S_2')} ?`) +
					'</div></div>';
			},

		},
		// esercizi: equivalenti in quale universo?
		...[0, 1, 2].map(j => ({ ch: 1, title: 'Esercizio: equivalenti in quale universo?',

			},

		// 11

			text: P('Chiediamo che l’operazione sia reversibile, così da non aggiungere soluzioni.') +

		{ ch: 3, title: 'Dal principio generale ai due princìpi',

		// 13

				const k = st.k;
				return `<div class="col">${rows(k, [['x + 5 = 12', ''], ['x + 5 − 5 = 12 − 5', '− 5 da tutti e due i lati (primo principio)'], [`x = ${C.P1.d}`, 'calcoli']], '', 'ok')}${nextCtl(k, 2)}
					<div class="chain">${eqb(f('A(x) = B(x)'))}${xab(F('+ c'), F('− c'))}${eqb(f('A(x) + c = B(x) + c'))}</div>
					<p class="cap">Aggiungere ${f('c')} è reversibile: si torna indietro togliendo ${f('c')}.</p></div>` +
					msg(k >= 2 ? `Si torna indietro con ${m('+ 5')}: da ${f('x = 7')} si risale a ${f('x + 5 = 12')}.<br><b>Quindi ${m(`${F('S')} = ${setS(C.P1.S)}`)}</b>.` : '', 'in');
			},
			act: stepAct(2)
		},
		// 14
		{ ch: 3, title: 'Secondo principio di equivalenza',
			text: DL('Proprietà (Secondo principio di equivalenza)', P('Moltiplicando o dividendo i due membri di un’equazione per uno stesso numero diverso da zero si ottiene un’equazione equivalente.') +
					FM(`${f('c ∈ ℝ')}, ${f('c ≠ 0')}:<br>${f('A(x) = B(x) ⟺ c · A(x) = c · B(x)')}<br>${m(`${F('A(x) = B(x) ⟺ ')}${fr('A(x)', 'c')} = ${fr('B(x)', 'c')}`)}`)) +
				P(`Ad esempio, per togliere il ${m('· 3')} da ${f('3x = 9')} applico l’operazione inversa, ${m(': 3')}, da tutti e due i lati.`),
			init: () => ({ k: 0 }),
			view(st) {
				const k = st.k;
				return `<div class="col">${rows(k, [['3x = 9', ''], [frEq('3x', '3', '9', '3'), 'divido i due membri per 3 (secondo principio)'], [`x = ${C.P2.d}`, 'calcoli']], '', 'ok')}${nextCtl(k, 2)}
					<div class="chain">${eqb(f('A(x) = B(x)'))}${xab(F('· c'), F(': c'))}${eqb(f('c · A(x) = c · B(x)'))}</div>
					<p class="cap">Moltiplicare per ${f('c')} è reversibile: si torna indietro dividendo per ${f('c')}.</p></div>` +
					msg(k >= 2 ? `Si torna indietro con ${m('· 3')}: da ${f('x = 3')} si risale a ${f('3x = 9')}.<br><b>Quindi ${m(`${F('S')} = ${setS(C.P2.S)}`)}</b>.` : '', 'in');
			},
			act: stepAct(2)
		},
		// il segno del numero davanti alla x
		{ ch: 3, title: `Il segno del numero davanti alla ${f('x')}`,
			text: P(`Con il secondo principio si divide per il numero davanti alla ${f('x')}, <b>segno compreso</b>.`) +
				P(`In ${f('−x')} il numero davanti alla ${f('x')} è ${m('−1')}.`),
			init: () => ({ k: 0 }),
			view(st) {
				const k = st.k;
				return `<div class="col">${rows(k, [['−2x = 10', ''], [frEq('−2x', '−2', '10', '−2'), 'divido i due membri per −2 (secondo principio)'], [`x = ${C.n(C.SIGN.a)}`, 'calcoli']], '', 'ok')}` +
					`${rows(k - 3, [['−x = 16', ''], [frEq('−x', '−1', '16', '−1'), 'divido i due membri per −1 (secondo principio)'], [`x = ${C.n(C.SIGN.b)}`, 'calcoli']], '', 'ok')}${nextCtl(k, 5)}</div>` +
					msg(k >= 5 ? `<b>Quindi per ${f('−2x = 10')}, ${m(`${F('S')} = ${setS([C.SIGN.a])}`)}; per ${f('−x = 16')}, ${m(`${F('S')} = ${setS([C.SIGN.b])}`)}</b>.` : '', 'in');
			},
			act: stepAct(5)
		},
		// 15
		{ ch: 3, title: `Perché ${f('c ≠ 0')}?`,
			text: P(`Moltiplicare per ${m('0')} non è reversibile: ${m(`3 · 0 = 5 · 0 = ${C.REV.z[0]}`)}.`) + P(`Dal risultato ${m('0')} non si risale al numero di partenza.`),
			init: () => ({ k: 0 }),
			view(st) {
				const k = st.k;
				return `<div class="col"><div class="dblk">${drow(F('x = 3'), m(`${F('S')} = ${setS(C.ZERO.S)}`), true)}${drow(F('x · 0 = 3 · 0'), '· 0 da tutti e due i lati', k >= 1)}${drow('0 = 0', f('S = U'), k >= 2, 'no')}</div>` +
					solLine(k >= 2 ? [] : C.ZERO.S.map(v => ({ v })), k >= 2, 'le soluzioni sulla retta dei numeri') + nextCtl(k, 2) + '</div>' +
					msg(k >= 2 ? `Prima ${m(`${F('S')} = ${setS(C.ZERO.S)}`)}, dopo ${f('S = U')}.<br><b>Quindi moltiplicando per ${m('0')} si aggiungono soluzioni: serve ${f('c ≠ 0')}</b>.` : '', 'out');
			},
			act: stepAct(2)
		},
		// i due princìpi insieme: prima il principio, poi i calcoli
		{ ch: 3, title: 'Risolvere con i due princìpi',
			text: P('A ogni passaggio diciamo quale principio usiamo e lo applichiamo ai due membri.') + P('Solo dopo facciamo i calcoli.'),
			init: () => ({ k: 0 }),
			view(st) {
				const k = st.k;
				return `<div class="col">${rows(k, [['3x − 2 = 7', ''], ['3x − 2 + 2 = 7 + 2', '+ 2 da tutti e due i lati (primo principio)'], ['3x = 9', 'calcoli'], [frEq('3x', '3', '9', '3'), 'divido i due membri per 3 (secondo principio)'], ['x = 3', 'calcoli']], '', 'ok')}${nextCtl(k, 4)}</div>` +
					msg(k >= 4 ? `<b>Quindi ${m(`${F('S')} = ${setS(G.S)}`)}</b>.` : '', 'in');
			},
			act: stepAct(4)
		},
		// ---------- «Che cosa può succedere a S?» ----------
		// 16
		...EXR.map((E, i) => {
			const nr = E.rows.length - 1, max = nr + (E.q ? 1 : 0);
			return { ch: 4, title: `Esercizio ${'abc'[i]}`,
				text: P(`Risolviamo ${f(E.f)} con i princìpi di equivalenza.`) + P(`Che cosa succede a ${f('S')}?`),
				init: () => ({ k: 0 }),
				view(st) {
					const k = st.k;
					const out = k < nr ? msg('') : E.q && k === nr ? msg(`Per quali ${f('x ∈ U')} è vera ${m(E.q)}?`) : E.end();
					return `<div class="col">${rows(k, E.rows)}${nextCtl(k, max)}</div>` + out;
				},
				act: stepAct(max)
			};
		}),
		// 17
		{ ch: 4, title: 'Determinata, impossibile, indeterminata',
			text: st => DL('Definizione (Equazione determinata, impossibile, indeterminata)', P(`Un’equazione è <b>determinata</b> se ${f('S')} è finito e non vuoto.`) + P(`È <b>impossibile</b> se ${f('S = ∅')}.`) + P(`È <b>indeterminata</b> se ${f('S')} è infinito.`)) +
				P('Sono i tre casi visti nella lezione 1: ora hanno un nome.') +
				P(`Un’identità è un’equazione indeterminata: è vera per ogni valore della ${f('x')}.`) +
				([0, 1, 2].every(i => st.open[i]) ? P(`<b>Quindi ${f('x − 4 = 6')} è determinata, ${f('x + 5 = x')} è impossibile, ${f('2(x + 3) = 2x + 6')} è indeterminata: è un’identità.</b>`) : ''),
			init: () => ({ open: {} }),
			view(st) {
				return `<div class="col"><div class="kgrid three">${EXR.map((E, i) => card(st, i, `<span class="kf">${f(E.f)}</span><span class="ks">${NAMES[i][2]}</span>`,
					`<span class="kw">${f('S')} ${NAMES[i][3]}</span><span class="kv">${NAMES[i][0]}</span>`, NAMES[i][1])).join('')}</div></div>`;
			},
			act: openAct
		},
		// ---------- «Riepilogo» ----------
		// 20
		{ ch: 5, full: true, title: 'Che cosa abbiamo visto: universo ed equazioni equivalenti',
			view: () => `<div class="map m3">
				<section class="mb"><h3>L’insieme universo ${f('U')}</h3>
					<p>È l’insieme in cui cerchiamo le soluzioni.</p>
					<p class="mcen">${f('S = {x ∈ U | A(x) = B(x)} ⊆ U')}</p>
					<p>La stessa equazione può avere insiemi delle soluzioni diversi se cambia l’universo.<br>${f('x^2 = 2')}: con ${f('U = ℚ')}, ${f('S = ∅')}; con ${f('U = ℝ')}, ${f(`S = ${C.UTAB[1].S.R}`)}.</p>
					<p>Se non diciamo diversamente, ${f('U = ℝ')}.</p>
				</section>${MAP_ARROW}
				<section class="mb"><h3>Equazioni equivalenti</h3>
					<p>Due equazioni, nello stesso universo, sono <b>equivalenti</b> se hanno lo stesso insieme delle soluzioni.</p>
					<p class="mbig">${f('E_1 ∼ E_2 ⟺ S_1 = S_2')}</p>
					<p>${f('3x − 2 = 7')} e ${f('3x = 9')} sono equivalenti: ${m(`${F('S')} = ${setS(G.S)}`)}.<br>${f('x^2 = 9')} e ${f('x = 3')} no.</p>
					<p>Dipende dall’universo: ${f('5x − 2 = 18')} e ${f('x^2 = 16')} sono equivalenti in ${NN}, non in ${ZZ}.</p>
				</section>${MAP_ARROW}
				<section class="mb"><h3>Operazioni reversibili</h3>
					<p>Dal risultato possiamo risalire senza ambiguità al numero di partenza: risultati uguali vengono solo da numeri uguali.</p>
					<p>${m('+ 2')} e ${m('· 3')} sono reversibili; elevare al quadrato no, ${m('1<sup>2</sup> = (−1)<sup>2</sup>')}; ${m('· 0')} no.</p>
					<p><b>Principio generale di equivalenza</b>: applicando ai due membri la stessa operazione reversibile, definita per tutti i valori dei membri, si ottiene un’equazione equivalente.</p>
					<p>Andata: non perdiamo soluzioni.<br>Ritorno: non aggiungiamo soluzioni.</p>
				</section></div>`
		},
		// 21
		{ ch: 5, full: true, title: 'Che cosa abbiamo visto: i princìpi e i tre casi',
			view: () => `<div class="map">
				<section class="mb"><h3>I princìpi di equivalenza</h3>
					<p>Sono il principio generale con ${m('+')} e ${m('−')} (primo) e con ${m('·')} e ${m(':')} (secondo).</p>
					<p><b>Primo</b>: ${f('A(x) = B(x) ⟺ A(x) + c = B(x) + c')}<br>${f('A(x) = B(x) ⟺ A(x) − c = B(x) − c')}<br>${f('c')} numero oppure espressione polinomiale in ${f('x')}.</p>
					<p><b>Secondo</b>: ${f('A(x) = B(x) ⟺ c · A(x) = c · B(x)')}<br>${m(`${F('A(x) = B(x) ⟺ ')}${fr('A(x)', 'c')} = ${fr('B(x)', 'c')}`)}<br>${f('c ∈ ℝ')}, ${f('c ≠ 0')}, perché ${m('· 0')} non è reversibile.</p>
					<p>A ogni passaggio prima il principio, poi i calcoli.<br>Per togliere un termine o un fattore si applica l’operazione inversa; si divide per il numero davanti alla ${f('x')}, segno compreso.</p>
					<p class="mcen">${f('3x − 2 = 7')}${xa(`${m('+ 2')} (primo)`)}${f('3x = 9')}${xa(`${m(': 3')} (secondo)`)}${f('x = 3')}</p>
				</section>${MAP_ARROW}
				<section class="mb"><h3>Che cosa può succedere a ${f('S')}</h3>
					<table class="mt"><tr><td>${f('S')} finito, non vuoto</td><td><b>determinata</b></td><td>${f('x − 4 = 6')}</td></tr><tr><td>${f('S = ∅')}</td><td><b>impossibile</b></td><td>${f('x + 5 = x')}</td></tr><tr><td>${f('S')} infinito</td><td><b>indeterminata</b></td><td>${f('2(x + 3) = 2x + 6')}</td></tr></table>
					<p>${f('x + 5 = x')} diventa ${m('5 = 0')}, falsa per ogni ${f('x')}.<br>${f('2(x + 3) = 2x + 6')} diventa ${m('0 = 0')}, vera per ogni ${f('x')}.</p>
					<p>Un’identità è un’equazione indeterminata.</p>
				</section></div>
				<p class="mres"><span>Risolvere vuol dire trovare ${f('S')}: si sostituisce l’equazione con equazioni equivalenti sempre più semplici, che hanno lo stesso ${f('S')}.</span></p>`
		}
	];

	// ---------- riepilogo da stampare: i due schemi ricomposti su un foglio ----------
	(() => {
		const ps = document.createElement('section');
		ps.className = 'print-summary';
		ps.setAttribute('aria-hidden', 'true');
		const tmp = document.createElement('div');
		tmp.innerHTML = STEPS.filter(x => x.full).map(x => x.view({})).join('');
		const B = [...tmp.querySelectorAll('section.mb')].map(b => b.outerHTML);   // Universo, Equivalenti, Reversibili, Princìpi, Tre casi
		const res = tmp.querySelector('.mres').outerHTML;
		const T = '<h1 class="ps-t">Equazioni – Lezione 2: riepilogo</h1>';
		ps.innerHTML = `<div class="ps-port">${T}<div class="ps-row">${B[0]}${B[1]}</div><div class="ps-row">${B[2]}${B[3]}</div><div class="ps-row">${B[4]}${res}</div></div>` +
			`<div class="ps-land">${T}${tmp.innerHTML}</div>`;
		document.body.appendChild(ps);
		document.addEventListener('click', e => { if (e.target.closest?.('[data-print]')) window.print(); });
	})();

	// ---------- motore ----------
	const S = {};
	let cur = 0, lastLeft = '';
	let nextLesson = null;   // indirizzo della lezione successiva, se sul sito c'è
	const shown = new Set();   // testi con dissolvenza già comparsi nel passo
	const main = $('main'), left = $('left'), stage = $('stage');
	const stOf = i => S[i] ??= (STEPS[i].init ? STEPS[i].init() : {});

	// barra di avanzamento
	(() => {
		let h = '', i = 0;
		CH.forEach(([, name], c) => {
			const n = STEPS.filter(s => s.ch === c).length;
			h += `<div class="pch" style="--n:${n}" data-ch="${c}"><div class="segs">`;
			for (let j = 0; j < n; j++, i++) h += `<button type="button" class="seg" data-go="${i}" aria-label="${plain(CH[c][0])}, passo ${i + 1}"></button>`;
			h += `</div><span class="pname">${name}</span></div>`;
		});
		$('prog').innerHTML = h;
		$('prog').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });
	})();

	function renderLeft() {
		const P = STEPS[cur], st = stOf(cur);
		const T = typeof P.text === 'function' ? P.text(st) : P.text;
		const h = (P.full ? `<div class="thead"><h2>${P.title}</h2><span class="tacts"><button type="button" class="btn" data-print><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg>Stampa il riepilogo</button>${cur === STEPS.length - 1 && nextLesson ? `<a class="btn pri" href="${nextLesson}">Prossima lezione →</a>` : ''}</span></div>` : `<h2>${P.title}${P.tag ? `<span class="tag">${P.tag}</span>` : ''}</h2>`) +
			(T ? `<div class="txt">${T}</div>` : '');
		if (h !== lastLeft) left.innerHTML = lastLeft = h;          // se non cambia, non si ridisegna
	}
	function renderStage() {
		const old = stage.querySelector('.ttw')?.scrollLeft || 0;
		stage.innerHTML = STEPS[cur].view(stOf(cur));
		const w = stage.querySelector('.ttw');
		if (w) w.scrollLeft = old;
	}
	// testo per chi usa un lettore di schermo: apici, pedici e frazioni si leggono
	const say = e => {
		const c = e.cloneNode(true);
		c.querySelectorAll('sup').forEach(s => { s.textContent = ' alla ' + s.textContent; });
		c.querySelectorAll('sub').forEach(s => { s.textContent = ' ' + s.textContent; });
		c.querySelectorAll('.frac').forEach(q => { q.textContent = `${q.children[0].textContent} fratto ${q.children[1].textContent}`; });
		c.querySelectorAll('br').forEach(b => b.replaceWith(' '));   // le righe a capo non devono attaccare le frasi
		return c.textContent;
	};
	function renderChrome() {
		const P = STEPS[cur];
		$('h1').innerHTML = CH[P.ch][0];
		document.querySelectorAll('.seg').forEach((b, i) => {
			b.classList.toggle('cur', i === cur); b.classList.toggle('done', i < cur);
			if (i === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
		});
		document.querySelectorAll('.pch').forEach(p => p.classList.toggle('cur', +p.dataset.ch === P.ch));
		$('prev').disabled = cur === 0;
		$('next').disabled = cur === STEPS.length - 1;
		$('count').textContent = `${cur + 1} / ${STEPS.length}`;
	}
	function go(i) {
		cur = Math.max(0, Math.min(STEPS.length - 1, i));
		main.classList.toggle('full', !!STEPS[cur].full);
		renderChrome(); renderLeft(); renderStage();
		shown.clear(); stage.querySelectorAll('.late').forEach(e => shown.add(e.textContent));
		left.scrollTop = 0; stage.scrollTop = 0;
		const h = '#passo-' + (cur + 1);
		if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) {} }
	}
	// dopo un'azione: ridisegna e rimette il fuoco dov'era
	function refresh() {
		const fk = document.activeElement?.dataset?.k;
		if (typeof STEPS[cur].text === 'function') { lastLeft = ''; renderLeft(); }
		renderStage();
		// la dissolvenza solo per ciò che compare adesso, non per ciò che si vedeva già
		stage.querySelectorAll('.late').forEach(e => { if (shown.has(e.textContent)) e.classList.remove('late'); else shown.add(e.textContent); });
		if (fk) {
			const t = main.querySelector(`[data-k="${CSS.escape(fk)}"]`);
			(t && !t.disabled ? t : main.querySelector('[data-k="reset"]'))?.focus({ preventScroll: true });
		}
		$('live').textContent = [...main.querySelectorAll('.fb, .msg:not(.empty), .kc[aria-expanded="true"]')].map(say).join(' ');
	}
	main.addEventListener('click', e => {
		const t = e.target.closest('[data-act]');
		if (!t || !main.contains(t) || t.disabled) return;
		STEPS[cur].act(stOf(cur), t.dataset.act, t.dataset.v);
		refresh();
	});
	main.addEventListener('keydown', e => {
		if (e.key === 'Enter' && e.target.id === 'try') { e.preventDefault(); main.querySelector('[data-act="try"]')?.click(); }
	});
	document.addEventListener('keydown', e => {
		if (e.altKey || e.ctrlKey || e.metaKey || e.defaultPrevented) return;
		if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
		if (e.key === 'ArrowRight' && cur < STEPS.length - 1) { e.preventDefault(); go(cur + 1); }
		if (e.key === 'ArrowLeft' && cur > 0) { e.preventDefault(); go(cur - 1); }
	});
	$('prev').addEventListener('click', () => go(cur - 1));
	$('next').addEventListener('click', () => go(cur + 1));
	const fromHash = () => { const r = /^#passo-(\d{1,2})$/.exec(location.hash); return r ? +r[1] - 1 : null; };
	window.addEventListener('hashchange', () => { const i = fromHash(); if (i != null && i !== cur) go(i); });
	// ---------- prossima lezione: solo sul sito, e solo se il file della lezione successiva c'è;
	// il link compare nell'intestazione dell'ultimo riepilogo ----------
	if (location.protocol.startsWith('http')) $('homeBtn').hidden = false;   // sul sito si torna all'elenco delle lezioni; da file no
	const ln = /lezione-(\d+)(?:\.html)?$/.exec(location.pathname);
	if (ln && location.protocol.startsWith('http')) {
		const url = location.pathname.replace(/lezione-\d+(?:\.html)?$/, `lezione-${+ln[1] + 1}.html`);
		fetch(url, { method: 'HEAD', cache: 'no-store' })
			.then(r => { if (r.ok) { nextLesson = url; renderLeft(); } })
			.catch(() => {});
	}
	go(fromHash() ?? 0);
})();
</script>
</body>
</html>
