<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { const r = document.documentElement, t = localStorage.getItem('matematica-tema'), z = localStorage.getItem('matematica-zoom'); if (t === 'dark') r.dataset.theme = 'dark'; if (['115', '130', '150'].includes(z)) r.dataset.zoom = z; } catch (e) {}</script>
<title>Le proprietà delle operazioni – Lezione 3</title>
<link rel="stylesheet" href="../../assets/fonts/lezioni.css">
<style>
:root {
	--bg: #F3F6F9;
	--grid: #E2E8EF;
	--panel: #FFFFFF;
	--ink: #17212E;
	--ink2: #4A5566;
	--line: #D3DBE4;
	--acc: #2A4DB5;
	--on-acc: #FFFFFF;
	--acc-fill: rgba(42, 77, 181, 0.08);
	--acc-soft: rgba(42, 77, 181, 0.30);
	--acc2: #B4540A;
	--in: #13804A;
	--in-bg: #DFF3E7;
	--out: #BE3131;
	--out-bg: #FBE3E3;
	--hl: #FFEFA8;
	--hover: #EAF0F8;
	--chip: #F3F6F9;
	--focus: #2A4DB5;
	--ctl: #8C9AAB;
	--shadow: rgba(0, 0, 0, 0.25);
	--nero: #17212E;
	--bianco: #FFFFFF;
	--ui: "Lexend", system-ui, "Segoe UI", Roboto, sans-serif;
	--math: "STIX Two Text", "STIX Two Math", "Cambria Math", Cambria, "Times New Roman", serif;
}
:root[data-theme="dark"] {
	color-scheme: dark;
	--bg: #0F141A;
	--grid: #19212B;
	--panel: #161D26;
	--ink: #E6EBF1;
	--ink2: #A8B3C0;
	--line: #2A3440;
	--acc: #86A5F7;
	--on-acc: #0F141A;
	--acc-fill: rgba(134, 165, 247, 0.10);
	--acc-soft: rgba(134, 165, 247, 0.34);
	--acc2: #F2A65A;
	--in: #4FC98C;
	--in-bg: #173327;
	--out: #FF7C7C;
	--out-bg: #3A1D20;
	--hl: #3D3517;
	--hover: #1E2835;
	--chip: #1B232E;
	--focus: #86A5F7;
	--ctl: #56657A;
	--shadow: rgba(0, 0, 0, 0.5);
	--nero: #000000;
	--bianco: #FFFFFF;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(14px, min(1.05vw, 1.9vh), 21px); }
body {
	margin: 0; height: 100%;
	background-color: var(--bg);
	background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
	background-size: 24px 24px;
	color: var(--ink); font-family: var(--ui); line-height: 1.4;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; max-width: 1800px; margin: 0 auto; padding: 0.8rem 16px 0.9rem; display: flex; flex-direction: column; gap: 0.7rem; }

/* ---------- barra in alto ---------- */
header.top { display: flex; align-items: center; gap: 0.6rem 2rem; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; min-width: 10.5ch; white-space: nowrap; }
.prog { flex: 1; display: flex; gap: 0.7rem; min-width: 0; }
.pch { flex: var(--n) 1 0; min-width: max-content; display: flex; flex-direction: column; gap: 0.1rem; }
.segs { display: flex; gap: 3px; }
.seg { flex: 1; min-width: 0; height: 1.5rem; padding: 0; border: 0; background: none; cursor: pointer; position: relative; border-radius: 4px; }
.seg::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 0.5rem; transform: translateY(-50%); border-radius: 3px; background: var(--line); }
.seg.done::before { background: var(--acc-soft); }
.seg.cur::before { background: var(--acc); height: 0.75rem; }
.pname { font-size: 0.95rem; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pch.cur .pname { color: var(--ink); font-weight: 700; }
#theme { flex: none; width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; font-size: 1.3rem; line-height: 1; padding: 0; }
#theme:hover { border-color: var(--acc); }
.tools { flex: none; display: flex; align-items: center; gap: 0.5rem; position: relative; }   /* il pannello dello zoom si allinea al bordo destro dei due bottoni */
.zmenu { position: static; }
#homeBtn { width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); color: var(--ink); display: grid; place-items: center; }
#homeBtn:hover { border-color: var(--acc); }
#homeBtn svg { width: 1.4rem; height: 1.4rem; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#zoomBtn { width: 2.75rem; height: 2.75rem; min-width: 44px; min-height: 44px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; padding: 0; display: grid; place-items: center; }
#zoomBtn:hover, #zoomBtn[aria-expanded="true"] { border-color: var(--acc); }
#zoomBtn svg { width: 1.45rem; height: 1.45rem; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.zpanel { position: absolute; top: calc(100% + 0.6rem); right: 0; z-index: 30; width: min(21rem, calc(100vw - 2rem)); padding: 0.8rem 0.9rem 0.9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px var(--shadow); }
.zhead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.55rem; font-weight: 700; }
.zhead button { width: 2.4rem; height: 2.4rem; min-width: 40px; min-height: 40px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; padding: 0; display: grid; place-items: center; }
.zhead button svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.zopts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
.zopts label { position: relative; display: grid; place-items: center; min-height: 44px; border: 2px solid var(--ctl); border-radius: 10px; cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; }
.zopts input { position: absolute; opacity: 0; pointer-events: none; }
.zopts label:has(input:checked) { border-color: var(--acc); background: var(--acc-fill); color: var(--acc); }
.zopts label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
:root[data-zoom="115"] main.step { zoom: 1.15; }
:root[data-zoom="130"] main.step { zoom: 1.3; }
:root[data-zoom="150"] main.step { zoom: 1.5; }


/* ---------- il passo ---------- */
main.step { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 1.4rem; }
.left { display: flex; flex-direction: column; gap: 0.75rem; min-height: 0; overflow: auto; padding: 0.2rem 0.3rem 0.2rem 0; }
.left h2 { margin: 0; font-size: 1.9rem; line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; }
.tag { display: inline-block; vertical-align: 0.3em; margin-left: 0.6rem; padding: 0.1rem 0.65rem; border: 2px solid var(--ctl); border-radius: 999px; font-size: 0.95rem; font-weight: 500; letter-spacing: 0.02em; color: var(--ink2); white-space: nowrap; }
.txt { font-size: 1.35rem; line-height: 1.45; }
.txt p { margin: 0 0 0.45em; }
.txt p:last-child { margin-bottom: 0; }
.def { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--acc); border-radius: 0 12px 12px 0; padding: 0.6rem 1rem 0.7rem; margin-bottom: 0.5em; }
.def .dl { font-size: 0.95rem; letter-spacing: 0.01em; font-weight: 700; color: var(--acc); margin-bottom: 0.15rem; }
.def p { margin: 0 0 0.3em; }
.def .formula { text-align: center; font-size: 1.25em; margin: 0.25em 0 0.1em; }
.small { font-size: 0.85em; color: var(--ink2); }
.sym { display: grid; grid-template-columns: 2.2rem auto; gap: 0.2rem 0.6rem; align-items: baseline; margin-top: 0.3rem; }
.sym .m { font-size: 1.5em; text-align: center; }

/* 1.08em: le cifre di STIX hanno la stessa altezza di quelle di Lexend, così i numeri nel testo e nelle formule sono uguali */
.m { font-family: var(--math); font-size: 1.08em; line-height: 1; white-space: nowrap; }
.m .m { font-size: 1em; }
.m i, i.m { font-style: italic; }
b { font-weight: 700; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.8rem; min-height: 0; overflow: auto; }
.fig { flex: 1 1 auto; min-height: 7rem; position: relative; }
.fig > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.col { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem; min-height: 0; }
.ctl { display: flex; gap: 0.8rem; justify-content: center; align-items: center; flex-wrap: wrap; }

/* domanda */
.q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0.75rem 1rem; }
.qq { margin: 0 0 0.6rem; font-size: 1.35rem; font-weight: 500; }
.opts { display: flex; gap: 0.7rem; flex-wrap: wrap; }
.fb { margin: 0.7rem 0 0; padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 1.25rem; border-left: 5px solid; }
.fb.ok { background: var(--in-bg); border-color: var(--in); }
.fb.no { background: var(--out-bg); border-color: var(--out); }

/* bottoni */
.btn { font-size: 1.25rem; font-weight: 500; min-height: 3rem; min-width: 3rem; padding: 0 1.2rem; border-radius: 12px; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; box-shadow: 0 2px 0 var(--ctl); }
.btn:hover:not(:disabled) { border-color: var(--acc); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.pri { background: var(--acc); color: var(--on-acc); border-color: var(--acc); box-shadow: 0 2px 0 var(--shadow); }
.btn.big { font-size: 1.6rem; min-width: 5.5rem; }
.btn[aria-pressed="true"] { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.opt.ok { background: var(--in-bg); border-color: var(--in); color: var(--in); }
.opt.no { background: var(--out-bg); border-color: var(--out); color: var(--out); }
.opt.right:not(.ok) { border-color: var(--in); }

.chip { display: inline-flex; align-items: center; justify-content: center; gap: 0.3em; font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; min-height: 2.8rem; min-width: 2.8rem; padding: 0.3em 0.85em; border-radius: 999px; border: 2px solid var(--ctl); background: var(--panel); color: var(--ink); box-shadow: 0 2px 0 var(--ctl); line-height: 1; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--acc); }
.chip.in { background: var(--in-bg); border-color: var(--in); color: var(--in); box-shadow: none; }
.chip.out { background: var(--out-bg); border-color: var(--out); color: var(--out); box-shadow: none; }
.chip.sel { background: var(--hl); border-color: var(--ink2); }
.chip .m { font-size: 1.05em; }
.ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; margin: 0; }

.msg { margin: 0; min-height: 2.6rem; padding: 0.45rem 1rem; border-radius: 10px; font-size: 1.35rem; text-align: center; background: var(--chip); border-left: 5px solid var(--line); }
.msg.in { background: var(--in-bg); border-left-color: var(--in); }
.msg.out { background: var(--out-bg); border-left-color: var(--out); }
.msg.hl { background: var(--hl); border-left-color: var(--ink2); }
.msg.empty { visibility: hidden; }

/* insiemi disegnati */
.setw { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
.set-cap { font-size: 1.25rem; font-weight: 500; color: var(--acc); }
.set { position: relative; border: 3px solid var(--acc); background: var(--acc-fill); border-radius: 50%; display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 10; width: 22rem; padding: 9% 13%; }
.set.wide { width: min(100%, 30rem); }
.set.small { width: 15rem; }
.set.dashed { border-style: dashed; }
.set-in { display: flex; flex-wrap: wrap; gap: 0.55rem 0.8rem; justify-content: center; align-items: center; }
.set-name { position: absolute; left: -3%; top: -7%; color: var(--acc); font-size: 2rem; }
.qm { position: absolute; right: -4%; top: -6%; font-size: 2.2rem; font-weight: 700; color: var(--acc); }
.el { display: inline-flex; align-items: center; justify-content: center; min-width: 2.7rem; min-height: 2.7rem; border-radius: 50%; font-size: 1.65rem; border: 2px solid transparent; background: none; padding: 0 0.2em; }
button.el { cursor: pointer; border-color: var(--ctl); background: var(--panel); }
button.el:hover { border-color: var(--acc); }
.el.hl { background: var(--hl) !important; border-color: var(--ink2) !important; }
.el.in { background: var(--in-bg); color: var(--in); border-color: var(--in); }
.braces { font-size: 2rem; display: flex; align-items: center; gap: 0.1rem; flex-wrap: wrap; justify-content: center; }
.braces .el { font-size: 1em; min-width: 2.4rem; min-height: 2.4rem; }
.braces.line { display: block; text-align: center; }
.braces.line .el { vertical-align: middle; min-width: 2.2rem; min-height: 2.2rem; margin: -0.3rem 0; }
.braces .cm { margin: 0 0.1rem 0 -0.1rem; }
.tray { display: flex; flex-wrap: wrap; gap: 0.7rem; justify-content: center; min-height: 3rem; }
.row2 { display: flex; align-items: center; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
/* passi 4, 6, 11: come si scrive un insieme, pari e dispari */
.ways { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; width: 100%; max-width: 48rem; }
.way { border: 2px solid var(--line); border-radius: 12px; padding: 0.6rem 0.8rem 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; text-align: center; }
.way .wl { font-size: 1.1rem; color: var(--ink2); }
.way > .m { font-size: 1.75rem; }
.fline { margin: 0; font-size: 1.6rem; text-align: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.2rem 0.5rem; }
.fline .m { font-size: 1.15em; }
.fcap { margin: 0 0 -0.5rem; font-size: 1.1rem; color: var(--ink2); }
.sw { flex: none; width: 1.7rem; height: 1.3rem; border-radius: 6px; border: 3px solid var(--acc); background: var(--panel); }
.sw.ev { background: var(--acc); }
.pd { display: grid; gap: 1rem; }
.outside { min-width: 6rem; display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; }

.cases { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; width: 100%; max-width: 44rem; }
.case { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-items: center; gap: 0.1rem 0.8rem; text-align: left; padding: 0.7rem 0.9rem; border-radius: 14px; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; box-shadow: 0 2px 0 var(--ctl); min-height: 44px; }
.case:hover { border-color: var(--acc); }
.case svg { grid-row: 1 / 3; width: 3.4rem; height: 3.4rem; }
.case .ct { font-size: 1.1rem; }
.case .cv { font-size: 1.35rem; font-weight: 700; color: var(--acc); min-height: 1.4em; }
.case[aria-pressed="true"] { border-color: var(--acc); background: var(--acc-fill); box-shadow: none; }
.ic-a { fill: var(--acc); }
.ic-b { fill: var(--ink2); }

/* numeri grandi (passo 15) */
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; gap: 0.6rem 1rem; width: 100%; max-width: 50rem; }
.nbox { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.nbox label, .nbox .nlab { font-size: 1.05rem; color: var(--ink2); }
.nin, .nout { font-family: var(--ui); font-weight: 500; font-variant-numeric: tabular-nums; font-size: var(--fs, 2.3rem); line-height: 1.2; padding: 0.35em 0.5em; border-radius: 12px; min-height: 2.2em; width: 100%; overflow-wrap: anywhere; }
.nin { border: 2px solid var(--acc); background: var(--panel); color: var(--ink); box-shadow: inset 0 2px 0 var(--acc-fill); }
.nout { display: block; border: 2px solid var(--line); background: var(--chip); }
.cmp .lt { font-size: 3rem; padding-bottom: 0.35em; color: var(--acc); }

/* passo 12 */
.zrow { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.zctl { flex: 1 1 16rem; display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 0.3rem 0.8rem; }
.zctl label { font-size: 1.2rem; color: var(--ink2); }
.zctl input[type="range"] { width: 100%; min-width: 6rem; accent-color: var(--acc); height: 2.75rem; }
.zval { font-variant-numeric: tabular-nums; font-size: 1.15rem; min-width: 5.5ch; text-align: right; }
.stairs { width: 18rem; height: auto; flex: none; }

/* tabelle */
.symt { border-collapse: collapse; font-size: 1.1rem; width: 100%; }
.symt th { text-align: left; font-weight: 500; color: var(--ink2); font-size: 1rem; padding: 0.15rem 0.6rem; border-bottom: 2px solid var(--line); }
.symt td { padding: 0.18rem 0.6rem; border-bottom: 1px solid var(--line); }
.symt td:first-child { text-align: center; }
.symt td:first-child .m { font-size: 1.45em; }

.cases3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; width: 100%; }
.c3 { border: 2px solid var(--line); border-radius: 12px; padding: 0.5rem; text-align: center; color: var(--ink2); min-height: 5.2rem; }
.c3 .m { font-size: 1.9rem; display: block; margin: 0.15rem 0 0.35rem; }
.c3 .ex { font-size: 1.3rem; font-weight: 500; min-height: 1.4em; display: block; }
.c3.on { border-color: var(--acc); background: var(--acc-fill); color: var(--ink); opacity: 1; }

.vf { display: grid; grid-template-columns: auto auto auto minmax(0, 24rem); align-items: center; gap: 0.9rem 0.8rem; max-width: 100%; }
.vf .why { min-height: 3rem; display: flex; align-items: center; }
.vf .f { font-size: 2.3rem; min-width: 5.5ch; text-align: center; }
.vf .btn { min-width: 3.3rem; padding: 0 0.8rem; }
.vf .why { font-size: 1.3rem; padding: 0.4rem 0.7rem; border-radius: 8px; border-left: 4px solid; }
.vf .why.ok { background: var(--in-bg); border-color: var(--in); }
.vf .why.no { background: var(--out-bg); border-color: var(--out); }
.vf .why.none { border-color: transparent; }

.bigf { font-size: 2.6rem; text-align: center; margin: 0; }
.bigf > .m { white-space: normal; }

.ops { display: grid; grid-template-columns: auto repeat(5, auto); align-items: start; justify-content: center; gap: 0.3rem 0.9rem; }
.ops .hd { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink2); text-align: center; align-self: end; }
.ops .on { font-size: 1.05rem; color: var(--ink2); align-self: center; padding-right: 0.4rem; text-align: right; }
.ops .sy { font-family: var(--math); font-size: 2.2rem; align-self: center; line-height: 1; padding-bottom: 1.3rem; }
.nm { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; min-width: 6.8rem; padding: 0.3rem 0.4rem; border-radius: 12px; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; box-shadow: 0 2px 0 var(--ctl); }
.nm:hover { border-color: var(--acc); }
.nm .n { font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
.nm .w { font-size: 1rem; font-weight: 700; color: var(--acc); min-height: 1.3em; }
.nm.res .w { color: var(--ink); }
.nm.op[aria-pressed="true"] { background: var(--acc-fill); border-color: var(--acc); box-shadow: none; }
.nm.res[aria-pressed="true"] { background: var(--hl); border-color: var(--ink2); box-shadow: none; }
.nm[aria-pressed="false"] .w { visibility: hidden; }

.clo { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 1.2rem 2.2rem; flex-wrap: wrap; }
.setrow { display: flex; align-items: center; gap: 1rem; }
.optab { border-collapse: separate; border-spacing: 0.4rem; }
.optab th { font-family: var(--math); font-size: 2.1rem; font-weight: 400; color: var(--acc); padding: 0 0.3rem; }
.optab th.corner { color: var(--ink); font-size: 2.4rem; font-weight: 700; }
.optab th.corner.dot, .ops .sy.dot { font-size: 3.4rem; }
.cell { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 7.2rem; min-height: 4.2rem; padding: 0.25rem 0.5rem; border-radius: 12px; border: 2px solid var(--ctl); background: var(--panel); box-shadow: 0 2px 0 var(--ctl); line-height: 1.15; }
button.cell { cursor: pointer; }
span.cell { border-color: var(--line); box-shadow: none; }
button.cell:hover { border-color: var(--acc); }
.cell .ex { font-family: var(--math); font-size: 1.5rem; }
.cell .rs { font-family: var(--math); font-size: 1.8rem; font-weight: 700; color: var(--ink2); }
.cell.in { background: var(--in-bg); border-color: var(--in); box-shadow: none; }
.cell.in .rs { color: var(--in); }
.cell.out { background: var(--out-bg); border-color: var(--out); box-shadow: none; }
.cell.out .rs { color: var(--out); }
.cell.mark { outline: 4px solid var(--out); outline-offset: 3px; }
.legend { display: grid; gap: 0.4rem; width: 100%; max-width: 40rem; }
.legend p { margin: 0; padding: 0.4rem 0.8rem; border-radius: 8px; border-left: 5px solid var(--line); font-size: 1.2rem; color: var(--ink2); }
.legend p.on.in { background: var(--in-bg); border-color: var(--in); color: var(--ink); }
.legend p.on.out { background: var(--out-bg); border-color: var(--out); color: var(--ink); }

/* passi 29-30: riepilogo, uno schema a tutta larghezza */
main.step.full { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 0.7rem; }
.step.full .left { overflow: visible; padding: 0; }
.step.full .panel { background: none; border: 0; border-radius: 0; padding: 0.2rem 0.2rem 0.4rem; }
.map { flex: 1 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 2.6rem minmax(0, 1fr) 2.6rem minmax(0, 1.15fr); }
.map.two { grid-template-columns: minmax(0, 1fr) 2.6rem minmax(0, 1.2fr); }
.mc { display: grid; place-items: center; }
.mc svg { width: 100%; height: auto; overflow: visible; }
.mc path { fill: none; stroke: var(--acc); stroke-width: 3; }
.mb { min-width: 0; container-type: inline-size; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 0.8rem 1rem 0.9rem; display: flex; flex-direction: column; gap: 0.6rem; font-size: 1.3rem; }
.mbody { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; gap: 1.6rem; padding-top: 0.4rem; }
.mg { display: flex; flex-direction: column; gap: 0.6rem; }
.mb h3 { margin: 0; font-size: 1.4rem; line-height: 1.2; color: var(--acc); }
.mb p { margin: 0; text-wrap: balance; }
.mf { display: flex; flex-direction: column; gap: 0.15rem; }
.mf .wl { font-size: 0.9em; color: var(--ink2); }
/* con lo zoom al 130-150 % la formula lunga va a capo invece di uscire dal riquadro */
.mf > .m { white-space: normal; }
.mb .mbig { font-size: min(1.7rem, 10cqi); text-align: center; }
.mb .fline { font-size: 1.15rem; justify-content: flex-start; gap: 0.2rem 0.8rem; }
.mb .in { color: var(--in); }
.mb .out { color: var(--out); }
.mray { width: 100%; max-width: 26rem; height: auto; display: block; margin: 0 auto; }
.mray .arcl { font-size: 26px; }
.pcs { flex: 1; display: grid; grid-auto-rows: 1fr; gap: 0.4rem; }
.pc { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: center; align-items: baseline; gap: 0.1rem 0.8rem; font-size: 1.2rem; line-height: 1.3; text-align: left; padding: 0.3rem 0.8rem; border: 2px solid var(--ctl); border-left: 6px solid var(--acc); border-radius: 0 12px 12px 0; background: var(--panel); box-shadow: 0 2px 0 var(--ctl); cursor: pointer; min-height: 44px; }
.pc:hover { border-color: var(--acc); }
.pc > span:nth-child(2) { grid-column: 1 / -1; }
.pc .pgo { grid-column: 2; grid-row: 1; font-size: 0.9em; color: var(--ink2); white-space: nowrap; }
.mt { border-collapse: collapse; width: 100%; font-size: 1.2rem; line-height: 1.25; }
.mt th { text-align: left; font-weight: 500; color: var(--ink2); font-size: 1.05rem; padding: 0.1rem 0.4rem; border-bottom: 2px solid var(--line); }
.mt td { padding: 0.25rem 0.4rem; border-bottom: 1px solid var(--line); }
.mt td.s { text-align: center; width: 2.2rem; }
.mt td.s .m { font-size: 1.45em; }
.mt td.e { white-space: nowrap; }
/* riquadro stretto (telefono, zoom 130-150 %): l'esempio va a capo sotto la riga */
@container (max-width: 36rem) {
	.mt.opn, .mt.opn tbody { display: block; }
	.mt.opn tr { display: grid; grid-template-columns: 8.4em minmax(0, 1fr) minmax(0, 1fr); column-gap: 0.4rem; border-bottom: 1px solid var(--line); }
	.mt.opn tr:first-child { border-bottom-width: 2px; }
	.mt.opn th, .mt.opn td { border-bottom: 0; padding-left: 0.2rem; padding-right: 0; }
	.mt.opn th:nth-child(4) { display: none; }
	.mt.opn td.e { grid-column: 1 / -1; padding-top: 0; }
}
/* ancora più stretto (telefono con zoom 130-150 %): il nome dell'operazione va su una riga sua */
@container (max-width: 20rem) {
	.mt.opn tr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
	.mt.opn th:first-child { display: none; }
	.mt.opn td:first-child { grid-column: 1 / -1; font-weight: 500; }
}

/* ---------- navigazione ---------- */
footer.nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.nb { font-size: 1.25rem; font-weight: 500; min-height: 3.1rem; min-width: 44px; padding: 0 1.7rem; border-radius: 999px; border: 2px solid var(--ctl); background: var(--panel); cursor: pointer; box-shadow: 0 2px 0 var(--ctl); }
.nb:hover:not(:disabled) { border-color: var(--acc); }
.nb.pri { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.nb:disabled { opacity: 0.35; cursor: default; }
.count { color: var(--ink2); font-size: 1.05rem; font-variant-numeric: tabular-nums; }

/* ---------- SVG ---------- */
svg text { font-family: var(--ui); }
.ax { stroke: var(--ink); stroke-width: 3; }
.tk { stroke: var(--ink); stroke-width: 3; }
.tl { font-size: 30px; fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
.uu, .lv { font-family: var(--math); font-style: italic; font-size: 36px; fill: var(--ink); }
.lv { fill: var(--acc); text-anchor: middle; }
.brace { fill: none; stroke: var(--ink2); stroke-width: 2.2; }
.arc path { fill: none; stroke: var(--acc); stroke-width: 3; }
.arc.back path { stroke-dasharray: none; }
.arcl { font-size: 22px; fill: var(--acc); text-anchor: middle; font-weight: 500; }
.arcw { font-size: 24px; fill: var(--ink2); text-anchor: middle; }
.mk-ink { fill: var(--ink); }
.mk-acc { fill: var(--acc); }
.mk-out { fill: var(--out); }
.band { fill: var(--acc-fill); stroke: var(--acc); stroke-width: 3; }
.inb .tl { fill: var(--acc); font-weight: 700; }
.arc.outarc path { stroke: var(--out); stroke-dasharray: 7 6; }
.arc.outarc text { fill: var(--out); font-weight: 500; }
.dots { font-size: 34px; fill: var(--acc); font-weight: 700; }
.tok circle { fill: var(--acc); stroke: var(--panel); stroke-width: 5; }
.dot { fill: var(--acc); }
.odot { fill: var(--panel); stroke: var(--acc); stroke-width: 4; }
.ring { fill: var(--panel); stroke: var(--out); stroke-width: 3.5; }
.ringin { fill: var(--in); }
.rl { font-size: 28px; fill: var(--out); text-anchor: middle; font-weight: 500; }
.gl { font-size: 28px; fill: var(--in); text-anchor: middle; font-weight: 500; }
.nl { font-size: 24px; fill: var(--ink2); text-anchor: middle; }
.bb { font-family: var(--math); }
.ghostline { stroke: var(--out); stroke-width: 3; stroke-dasharray: 8 8; }
.lead { stroke: var(--out); stroke-width: 1.5; stroke-dasharray: 3 4; }
.ztl { font-size: 24px; fill: var(--ink2); text-anchor: middle; font-variant-numeric: tabular-nums; }
.zn { font-size: 34px; fill: var(--acc); text-anchor: middle; font-weight: 700; }
.zt { stroke: var(--ink2); stroke-width: 2; }
.ztn { stroke: var(--ink); stroke-width: 3.5; }
.hit { cursor: pointer; }
.hit:focus { outline: none; }
.ha { fill: transparent; }
.lb { fill: var(--chip); stroke: var(--ctl); stroke-width: 2; }
.hit:hover .lb { stroke: var(--acc); fill: var(--hover); }
.hit:focus-visible .lb { stroke: var(--focus); stroke-width: 4; }
.sel .lb, g.sel .lb { fill: var(--hl); stroke: var(--ink2); }
.sel .tl { font-weight: 700; }
.okc .lb { fill: var(--in-bg); stroke: var(--in); }
.okc .tl { fill: var(--in); font-weight: 700; }
.noc .lb { fill: var(--out-bg); stroke: var(--out); }
.noc .tl { fill: var(--out); font-weight: 700; }
.miss .lb { stroke: var(--in); stroke-dasharray: 6 5; }
.ev .lb, .hit.ev:hover .lb { fill: var(--acc); stroke: var(--acc); }
.ev .tl { fill: var(--on-acc); font-weight: 700; }
.od .lb, .hit.od:hover .lb { fill: var(--panel); stroke: var(--acc); stroke-width: 3; }
.od .tl { fill: var(--acc); font-weight: 700; }
.pk .lb, .hit.pk:hover .lb { stroke: var(--ink); stroke-width: 5; }
.st-line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.st-l { font-size: 20px; fill: var(--out); text-anchor: start; font-weight: 500; }
.st-n { font-size: 22px; fill: var(--ink2); text-anchor: middle; }
.st-x { stroke: var(--out); stroke-width: 3; }
.st-r { fill: var(--panel); stroke: var(--out); stroke-width: 3; stroke-dasharray: 4 3; }

/* ---------- animazioni ---------- */
.hop { animation: hop 0.38s ease-out; }
@keyframes hop { 0% { transform: translate(var(--dx), 0); } 50% { transform: translate(calc(var(--dx) / 2), -34px); } 100% { transform: translate(0, 0); } }
.arc.fresh path { stroke-dasharray: 1; animation: draw 0.38s ease-out; }
.arc.fresh text { animation: appear 0.3s 0.2s both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
.late { animation: appear 0.2s 0.45s both; }
.shake { animation: shake 0.35s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.pulse { animation: pulse 0.4s; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.35s ease-out; }
@keyframes grow { from { transform: scaleX(var(--s0)); } }
@keyframes pulse { 50% { transform: scale(1.18); } }
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- schermi stretti ---------- */
@media (max-width: 820px) {
	html, body { height: auto; }
	.app { height: auto; min-height: 100%; }
	header.top { flex-wrap: wrap; }
	h1 { font-size: 1.4rem; min-width: 0; flex: 1; }
	.prog { order: 3; flex-basis: 100%; }
	.pname { display: none; }
	.pch { min-width: 0; }
	main.step { grid-template-columns: minmax(0, 1fr); }
	.left, .panel { overflow: visible; }
	.left h2 { font-size: 1.5rem; }
	.txt, .qq { font-size: 1.15rem; }
	.fig { flex: none; min-height: 0; }
	.fig { overflow-x: auto; }
	.fig > svg { position: static; height: auto; }
	.fig > svg:not(#z8):not(#cnt) { width: 600px; max-width: none; }
	.stairs { width: min(100%, 18rem); }
	.set, .set.wide { width: min(100%, 22rem); }
	.cases, .ways { grid-template-columns: 1fr; }
	.fline { font-size: 1.25rem; }
	.cmp { grid-template-columns: minmax(0, 1fr); }
	.cmp .lt { padding: 0; text-align: center; transform: rotate(90deg); }
	.vf { grid-template-columns: auto auto auto; }
	.vf .why { grid-column: 1 / -1; margin-top: -0.5rem; }
	.vf .why.none { display: none; }
	.ops { gap: 0.3rem 0.4rem; }
	.nm { min-width: 0; padding: 0.3rem 0.3rem; }
	.nm .n { font-size: 1.5rem; }
	.nm .w { font-size: 0.72rem; }
	.ops .on { display: none; }
	.ops .sy.dot { font-size: 2.4rem; }
	.ops { grid-template-columns: repeat(5, auto); }
	.ops .sy { font-size: 1.6rem; }
	.cell { min-width: 4.6rem; }
	.cell .ex { font-size: 1.05rem; }
	.bigf { font-size: 1.8rem; }
	.map, .map.two { grid-template-columns: minmax(0, 1fr); }
	.mc { height: 2.6rem; }
	.mc svg { width: 2.6rem; transform: rotate(90deg); }
	footer.nav { position: sticky; bottom: 0; background: var(--bg); padding: 0.5rem 0; }
	.nb { padding: 0 1.1rem; }
}

/* titolo dei passi di riepilogo con il pulsante di stampa */
.thead { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem 1rem; flex-wrap: wrap; }
.thead .btn { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 1.1rem; min-height: 2.75rem; }
.thead .tacts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
a.btn { text-decoration: none; }
.thead .btn svg { width: 1.3rem; height: 1.3rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }

/* stampa: solo il riepilogo, un foglio; in verticale 2+2+1 riquadri, in orizzontale 3+2 con le frecce */
.print-summary, .ps-land { display: none; }
@media print {
	@page { margin: 0; }   /* orientamento libero; margine 0 = niente intestazioni del browser, il margine è nella sezione */
	:root, :root[data-theme="dark"] {
		color-scheme: light;
	--bg: #F3F6F9;
	--grid: #E2E8EF;
	--panel: #FFFFFF;
	--ink: #17212E;
	--ink2: #4A5566;
	--line: #D3DBE4;
	--acc: #2A4DB5;
	--on-acc: #FFFFFF;
	--acc-fill: rgba(42, 77, 181, 0.08);
	--acc-soft: rgba(42, 77, 181, 0.30);
	--acc2: #B4540A;
	--in: #13804A;
	--in-bg: #DFF3E7;
	--out: #BE3131;
	--out-bg: #FBE3E3;
	--hl: #FFEFA8;
	--hover: #EAF0F8;
	--chip: #F3F6F9;
	--focus: #2A4DB5;
	--ctl: #8C9AAB;
	--shadow: rgba(0, 0, 0, 0.25);
	}
	html { font-size: 7.8pt; height: auto; }
	body { height: auto; background: #FFFFFF; background-image: none; }
	.app { display: none !important; }
	.print-summary { display: block; padding: 9mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
	.ps-t { margin: 0 0 2.5mm; font-size: 1.7rem; }
	.ps-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 3mm; margin-bottom: 3mm; break-inside: avoid; }
	.ps-row.one { grid-template-columns: minmax(0, 1fr); }
	.print-summary .mb { container-type: normal; break-inside: avoid; }
	.print-summary .mt th { white-space: nowrap; }
	.print-summary .mb .mbig { font-size: 1.7rem; }
	.print-summary .pgo { display: none; }
	.print-summary .pc { box-shadow: none; cursor: default; }
	.print-summary *, .print-summary *::before, .print-summary *::after { animation: none !important; transition: none !important; }
}
@media print and (orientation: landscape) {
	html { font-size: 7.8pt; }   /* 8.2 non basta più: la tabella finiva su un secondo foglio */
	.ps-port { display: none; }
	.ps-land { display: block; }
	.ps-land .map + .map { margin-top: 2mm; }
}
/* in stampa lo schema resta su quattro colonne anche se il foglio è stretto come un telefono */
@media print {
	.print-summary .map.four { grid-template-columns: minmax(0, 1fr) 2.6rem minmax(0, 1fr) 2.6rem minmax(0, 1fr) 2.6rem minmax(0, 1fr); }
	.print-summary .mc { height: auto; }
	.print-summary .mc svg { width: 100%; transform: none; }
}

/* ---------- lezione 3 ---------- */
.arc { pointer-events: none; }
.txt > .formula { text-align: center; font-size: 1.15em; margin: 0.2em 0 0.4em; }
.m sup { font-size: 0.62em; line-height: 0; vertical-align: 0.5em; }
.formula > .m { white-space: normal; }
.formula .cs { font-size: 0.92em; }
.fg { white-space: nowrap; }
.cg .cc { white-space: normal; }
.c2 .ex > .m { white-space: normal; }

/* due riquadri affiancati (esempi, controesempi) */
.cases2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.8rem; width: 100%; max-width: 54rem; }
.c2 { border: 2px solid var(--line); border-radius: 12px; padding: 0.6rem 0.8rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem; text-align: center; font-size: 1.2rem; }
.c2 .wl { font-size: 1.25rem; color: var(--ink2); }
.c2 .ex { font-size: 1.75rem; }
.c2.in { border-color: var(--in); background: var(--in-bg); }
.c2.out { border-color: var(--out); background: var(--out-bg); }
.c2.out .ex:last-child { color: var(--out); font-weight: 700; }

/* graffa dei casi (non è un insieme) e graffa sotto «b volte» */
.cs { display: inline-flex; align-items: stretch; gap: 0.25em; vertical-align: middle; }
.cbr { position: relative; flex: none; width: 0.45em; }
.cbr svg, .ubb svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cbr path, .ubb path { fill: none; stroke: currentColor; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.cg { display: grid; grid-template-columns: auto auto; column-gap: 0.8em; row-gap: 0.35em; align-items: baseline; text-align: left; padding: 0.1em 0; }
.cg .cc { font-size: 0.85em; }
.ub { display: inline-flex; flex-direction: column; align-items: center; white-space: nowrap; }
.ub .ub { vertical-align: top; }
.ubb { position: relative; align-self: stretch; height: 0.4em; margin: 0.12em 0.1em 0; }
.ubl { font-size: 0.6em; line-height: 1.1; }

/* operazioni inverse (passo 1) */
.invs { display: grid; grid-template-columns: minmax(0, 1fr) 7rem minmax(0, 1fr); align-items: center; gap: 1.2rem 0.4rem; width: 100%; max-width: 46rem; }
.ic { border: 2px solid var(--line); border-radius: 14px; padding: 0.6rem 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; text-align: center; background: var(--panel); }
.ic .os { font-family: var(--math); font-size: 2.6rem; line-height: 1; color: var(--acc); }
.ic .os.dot { font-size: 5rem; line-height: 0.52; }
.ic .inm { font-size: 1.2rem; color: var(--ink2); }
.ic .ex { font-size: 1.6rem; }
.ic .m { white-space: normal; }
.ic .tg { font-size: 1.15rem; color: var(--ink2); }
.iar { display: flex; flex-direction: column; align-items: center; color: var(--acc); font-size: 1rem; font-weight: 500; }
.iar svg { width: 100%; height: auto; overflow: visible; }
.iar path { fill: none; stroke: var(--acc); stroke-width: 3; }

/* pallini, graffe e quadretti nei disegni */
/* «neri» e «bianchi» restano tali anche nel tema scuro */
.pa { fill: var(--nero); stroke: var(--ink2); stroke-width: 2; }
.pb { fill: var(--bianco); stroke: var(--ink); stroke-width: 3.5; }
.pg { fill: var(--ctl); }
.brl { font-family: var(--math); font-size: 32px; fill: var(--ink); text-anchor: middle; }
.brl.st { text-anchor: start; }
.brl.en { text-anchor: end; }
.brl.sm { font-size: 27px; fill: var(--ink2); }
.brl.out, .brl.sm.out { fill: var(--out); }
.it { font-style: italic; }
.brl .w { font-family: var(--ui); }
.cnt { font-size: 28px; fill: var(--acc); text-anchor: middle; font-weight: 700; }
.gbox { fill: var(--acc-fill); stroke: var(--acc); stroke-width: 3; }
.sq { fill: none; stroke: var(--ink2); stroke-width: 1.5; }
.sqo { fill: none; stroke: var(--ink); stroke-width: 3.5; }
.f0 { fill: var(--acc-soft); }
.f1 { fill: var(--hl); }
/* ciò che si toglie (non è un errore): grigio, non rosso */
.fx { fill: var(--chip); }
.xl { stroke: var(--ink2); stroke-width: 3; }
.sqx { fill: none; stroke: var(--ink2); stroke-width: 3.5; stroke-dasharray: 10 7; }
.cut { stroke: var(--ink); stroke-width: 4; stroke-dasharray: 12 8; }
.brace.out { stroke: var(--out); }
.seq { animation: appear 0.25s both; }
.arc.slow path { animation-duration: 1s; }

/* l'intervallo sulla semiretta (invariantiva della sottrazione) */
.ivd { stroke: var(--ink2); stroke-width: 2; stroke-dasharray: 4 5; }
.iva { fill: none; stroke: var(--acc); stroke-width: 3.5; }
.ivl { font-family: var(--math); font-size: 34px; fill: var(--acc); text-anchor: middle; font-weight: 700; }
.iv.out .iva { stroke: var(--out); }
.iv.out .ivl { fill: var(--out); }
.iv.ghost { opacity: 0.4; }
.iv.ghost .iva { stroke-dasharray: 8 7; }
.slide { animation: slide 0.3s ease-out; }
@keyframes slide { from { transform: translateX(var(--dx)); } }

/* pallini a gruppi (HTML: vanno a capo sul telefono) */
.dg { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.7rem; max-width: 48rem; }
.dflat { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.35rem; max-width: 26rem; padding: 0.45rem; border: 2px solid transparent; }
.grp { display: grid; grid-template-columns: repeat(var(--c), auto); gap: 0.35rem; padding: 0.45rem; border: 2px solid var(--acc); border-radius: 12px; background: var(--acc-fill); }
.grp.x { border-color: var(--ink2); background: var(--chip); border-style: dashed; }
.grp.x .pt { opacity: 0.4; }
.grp.bad { border-color: var(--out); background: var(--out-bg); }
.grp.rst { border: 2px dashed var(--acc2); background: none; }
.pt { display: block; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--nero); box-shadow: 0 0 0 2px var(--ink2); }
.pt.b { background: var(--bianco); border: 3px solid var(--ink); box-shadow: none; }
.pt.r { background: var(--acc2); }
.dblock { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
.dlab { font-size: 1.2rem; color: var(--ink2); }
.dlab.out { color: var(--out); font-weight: 500; }
.dlab.rest { color: var(--acc2); font-weight: 500; }
.dplus { font-family: var(--math); font-size: 2.4rem; line-height: 1; color: var(--ink2); }
.dg.vert { flex-direction: column; gap: 0.3rem; }

/* addendi a, raggruppati o in fila (associativa della moltiplicazione) */
.tiles { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.6rem 0.5rem; }
.tg { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
.tg .tc { font-size: 1.2rem; font-weight: 700; color: var(--acc); }
.tg .tr { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.35rem; padding: 0.4rem 0.5rem; border: 2px solid var(--acc); border-radius: 12px; background: var(--acc-fill); }
.tile { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border-radius: 8px; border: 2px solid var(--ink2); background: var(--panel); font-family: var(--math); font-style: italic; font-size: 2rem; }
.tp { font-family: var(--math); font-size: 1.7rem; color: var(--ink2); }

/* calcolo a mente: le righe si scoprono una alla volta */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; width: 100%; max-width: 60rem; }
.pair.one { grid-template-columns: minmax(0, 1fr); max-width: 30rem; }
.pair.one.wide { max-width: 44rem; }
.calc p:has(.ub) { margin-bottom: 0.5em; }
.pair > div { border: 2px solid var(--line); border-radius: 12px; padding: 0.7rem 0.9rem; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
:root[data-zoom="130"] .pair, :root[data-zoom="150"] .pair { grid-template-columns: minmax(0, 1fr); max-width: 34rem; }
.calc { display: flex; flex-direction: column; align-items: flex-start; gap: 0.35rem; min-height: 9.5rem; font-size: 1.6rem; }
.calc p { margin: 0; }
.calc .c0 { font-size: 1.15em; font-weight: 500; }
.calc .cw { display: block; font-size: 1rem; color: var(--ink2); margin-left: 1.2em; }
.chain { margin: 0.3em 0 0.5em; }
.chain p { margin: 0.15em 0; }
.chain .why { display: block; font-size: 0.85em; color: var(--ink2); margin-left: 1.4em; }
.uso { gap: 0.8rem; }
.uso .usoh { margin: 0; font-weight: 700; color: var(--ink2); }
.uso .def { font-size: 1.3rem; width: min(100%, 30rem); }
.calc .fin .m { color: var(--in); font-weight: 700; }

/* riepilogo */
.map.four { grid-template-columns: minmax(0, 1fr) 2.6rem minmax(0, 1fr) 2.6rem minmax(0, 1fr) 2.6rem minmax(0, 1fr); }
.map.one { grid-template-columns: minmax(0, 1fr); }
.mb p .m { white-space: normal; }
/* riquadro molto stretto (zoom 150 % su schermi piccoli): gli esempi possono andare a capo anche fuori dall'«=» */
@container (max-width: 10.5rem) { .mb p .fg { white-space: normal; } }
.mb .mf > .m + .m { margin-top: 0.2rem; }
.mb .out { color: var(--out); }
.mb .ex { color: var(--ink2); }
.mt.prop { font-size: 1.15rem; }
.mt.prop th { font-size: 1.1rem; }
.mt.prop th.s { text-align: center; }
.mt.prop th.s .m { font-size: 1.6em; color: var(--acc); }
.mt.prop th.s.dot .m { font-size: 2.6em; line-height: 0.5; }
.map.four .mf > .m { font-size: 1.2em; }
.mt.prop td { vertical-align: top; }
.mt.prop th + th, .mt.prop td + td { border-left: 1px solid var(--line); }   /* righe verticali tra le colonne */
.mt.prop td:first-child { font-weight: 700; white-space: nowrap; }
.mt.prop .m { white-space: normal; }
.mt.prop td.yes b { color: var(--in); }
.mt.prop td.yes .out b { color: var(--out); }
.mt.prop td.no { color: var(--out); }
.mt.prop td.na { color: var(--ink2); text-align: center; }

@media (max-width: 820px) {
	.cases2, .pair { grid-template-columns: minmax(0, 1fr); }
	.def .formula, .txt > .formula { font-size: 1em; }
	.invs { grid-template-columns: minmax(0, 1fr) 3rem minmax(0, 1fr); gap: 0.8rem 0.3rem; }
	.iar { font-size: 0; }
	.ic { padding: 0.5rem 0.4rem; }
	.ic .inm { font-size: 0.85rem; overflow-wrap: anywhere; }
	.ic .ex { font-size: 1.05rem; }
	.ic .tg { font-size: 0.85rem; }
	.msg .m { white-space: normal; }
	.c2 .ex { font-size: 1.3rem; }
	.calc { font-size: 1.25rem; min-height: 0; }
	.pair > div { overflow-x: auto; }
	.pt { width: 1.05rem; height: 1.05rem; }
	.tile, .tp { font-size: 1.3rem; }
	.tile { width: 2.1rem; height: 2.1rem; }
	.map.four { grid-template-columns: minmax(0, 1fr); }
	.fig > svg[id^="fit"]:not(#z8):not(#cnt) { width: 100%; }   /* disegni senza semiretta: stanno tutti nello schermo */
}
/* tabella del riepilogo sul telefono (non in stampa): ogni riga diventa un blocco con le quattro operazioni a due a due */
@media screen and (max-width: 820px) {
	.mt.prop, .mt.prop tbody { display: block; }
	.mt.prop tr:first-child { display: none; }
	.mt.prop tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-bottom: 2px solid var(--line); padding: 0.3rem 0; }
	.mt.prop td { border-bottom: 0; border-left: 0; }
	.mt.prop td:nth-child(2n+3) { border-left: 1px solid var(--line); }   /* su due colonne: riga tra sinistra e destra */
	.mt.prop td:first-child { grid-column: 1 / -1; }
	.mt.prop td.na { text-align: left; }
	.mt.prop td:not(:first-child)::before { content: attr(data-op) "\2002"; font-family: var(--math); font-size: 1.4em; font-weight: 700; color: var(--acc); }
	.mt.prop td[data-op="·"]::before { font-size: 2.4em; line-height: 0; vertical-align: -0.12em; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
	<defs>
		<marker id="ah-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="mk-ink" d="M0,0 L10,5 L0,10 z"/></marker>
		<marker id="ah-out" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path class="mk-out" d="M0,0 L10,5 L0,10 z"/></marker>
		<marker id="ah-acc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path class="mk-acc" d="M0,0 L10,5 L0,10 z"/></marker>
	</defs>
</svg>

<div class="app">
	<header class="top">
		<h1 id="h1">La commutativa</h1>
		<nav class="prog" id="prog" aria-label="Avanzamento"></nav>
		<div class="tools">
		<a id="homeBtn" href="../../index.html" aria-label="Tutte le lezioni" title="Tutte le lezioni" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6 9v11h4.5v-6h3v6H18V9"/></svg></a>
		<div class="zmenu" id="zmenu">
			<button type="button" id="zoomBtn" aria-label="Dimensione dei contenuti" title="Dimensione dei contenuti" aria-haspopup="dialog" aria-expanded="false" aria-controls="zpanel">
				<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20.5 20.5M8 10.5h5M10.5 8v5"/></svg>
			</button>
			<section class="zpanel" id="zpanel" role="dialog" aria-labelledby="ztitle" hidden>
				<div class="zhead"><span id="ztitle">Dimensione dei contenuti</span><button type="button" id="zclose" aria-label="Chiudi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7 17 17M17 7 7 17"/></svg></button></div>
				<div class="zopts">
					<label><input type="radio" name="zoomLevel" value="100" checked>100%</label>
					<label><input type="radio" name="zoomLevel" value="115">115%</label>
					<label><input type="radio" name="zoomLevel" value="130">130%</label>
					<label><input type="radio" name="zoomLevel" value="150">150%</label>
				</div>
			</section>
		</div>
		<button type="button" id="theme" aria-label="Attiva il tema scuro" title="Tema scuro"><span id="themeGlyph" aria-hidden="true">☾</span></button>
		</div>
	</header>
	<main class="step" id="main">
		<section class="left" id="left" aria-live="off"></section>
		<section class="panel" id="stage"></section>
		<p class="sr" id="live" aria-live="polite"></p>
	</main>
	<footer class="nav">
		<button type="button" class="nb" id="prev">← Indietro</button>
		<span class="count" id="count"></span>
		<button type="button" class="nb pri" id="next">Avanti →</button>
	</footer>
</div>

<script>
(() => {
	'use strict';
	const $ = id => document.getElementById(id);
	const root = document.documentElement;
	const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

	// ---------- tema: chiaro di default, la scelta resta salvata ----------
	function applyTheme(dark, save) {
		root.dataset.theme = dark ? 'dark' : 'light';
		$('themeGlyph').textContent = dark ? '☀' : '☾';
		$('theme').setAttribute('aria-label', dark ? 'Attiva il tema chiaro' : 'Attiva il tema scuro');
		$('theme').title = dark ? 'Tema chiaro' : 'Tema scuro';
		if (save) { try { localStorage.setItem('matematica-tema', dark ? 'dark' : 'light'); } catch (e) {} }
	}
	let saved = null;
	try { saved = localStorage.getItem('matematica-tema'); } catch (e) {}
	applyTheme(saved === 'dark', false);
	$('theme').addEventListener('click', () => applyTheme(root.dataset.theme !== 'dark', true));

	// ---------- dimensione dei contenuti (zoom del passo), scelta salvata ----------
	const zInputs = [...document.querySelectorAll('[name="zoomLevel"]')];
	function applyZoom(v, save) {
		const z = ['100', '115', '130', '150'].includes(v) ? v : '100';
		root.dataset.zoom = z;
		zInputs.forEach(i => { i.checked = i.value === z; });
		if (save) { try { localStorage.setItem('matematica-zoom', z); } catch (e) {} }
	}
	let zSaved = null;
	try { zSaved = localStorage.getItem('matematica-zoom'); } catch (e) {}
	applyZoom(zSaved, false);
	zInputs.forEach(i => i.addEventListener('change', () => { if (i.checked) applyZoom(i.value, true); }));
	function setZoomMenu(open, back) {
		$('zpanel').hidden = !open;
		$('zoomBtn').setAttribute('aria-expanded', String(open));
		if (open) (zInputs.find(i => i.checked) || zInputs[0]).focus();
		else if (back) $('zoomBtn').focus();
	}
	$('zoomBtn').addEventListener('click', () => setZoomMenu($('zpanel').hidden));
	$('zclose').addEventListener('click', () => setZoomMenu(false, true));
	document.addEventListener('pointerdown', e => { if (!$('zpanel').hidden && !$('zmenu').contains(e.target)) setZoomMenu(false, false); });
	document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('zpanel').hidden) { e.preventDefault(); setZoomMenu(false, true); } }, true);

	// ---------- piccoli aiuti per il testo ----------
	const m = s => `<span class="m">${s}</span>`;
	const P = s => `<p>${s}</p>`;
	const D = (s, lab = 'Definizione') => `<div class="def"><div class="dl">${lab}</div>${s}</div>`;
	const DL = (lab, s) => D(s, lab);
	const NN = '<span class="bb">ℕ</span>';
	const a_ = m('<i>a</i>'), b_ = m('<i>b</i>'), n_ = m('<i>n</i>');
	const msg = (h, c = '') => `<p class="msg ${h ? c : 'empty'}">${h || '&nbsp;'}</p>`;
	const fig = (W, H, inner, label, id = '') => `<div class="fig"><svg ${id ? `id="${id}" ` : ''}viewBox="0 0 ${W} ${H}" role="group" aria-label="${label}">${inner}</svg></div>`;

	// ---------- semiretta orientata ----------
	function ray(o) {
		const n0 = o.n0 ?? 0, n1 = o.n1 ?? 10, x0 = o.x0 ?? 80, x1 = o.x1 ?? 880, y = o.y ?? 150;
		const k = (x1 - x0) / (n1 - n0), X = n => x0 + (n - n0) * k;
		const end = o.end ?? X(n1) + 0.8 * k;
		let s = `<line class="ax" x1="${x0}" y1="${y}" x2="${end}" y2="${y}" marker-end="url(#ah-ink)"/>`;
		const w = Math.min(k - 10, 58);
		for (let n = n0; n <= (o.upto ?? n1); n++) {
			const x = X(n), c = o.cls ? o.cls(n) : '', h = o.hit && (!o.hitIf || o.hitIf(n));
			if (o.lab && !o.lab(n)) { s += `<line class="tk" style="stroke-width:2" x1="${x}" y1="${y - 7}" x2="${x}" y2="${y + 7}"/>`; continue; }   // tacca senza numero
			const inner = `<line class="tk" x1="${x}" y1="${y - 11}" x2="${x}" y2="${y + 11}"/>` +
				(h ? `<rect class="lb" x="${x - w / 2}" y="${y + 18}" width="${w}" height="44" rx="11"/>` : '') +
				`<text class="tl" x="${x}" y="${y + 51}">${n}</text>`;
			s += h
				? `<g class="hit ${c}" role="button" tabindex="0" aria-label="${n}"${o.pressed ? ` aria-pressed="${o.pressed(n)}"` : ''} data-act="${o.hit}" data-v="${n}" data-k="h${n}"><rect class="ha" x="${x - k / 2}" y="${y - 50}" width="${k}" height="118"/>${inner}</g>`
				: `<g class="${c}">${inner}</g>`;
		}
		if (o.u) {
			const a = X(n0), b = X(n0 + 1), mx = (a + b) / 2, yb = y + 74;
			s += `<path class="brace" d="M${a},${yb} q0,10 10,10 L${mx - 10},${yb + 10} q10,0 10,10 q0,-10 10,-10 L${b - 10},${yb + 10} q10,0 10,-10"/>` +
				`<text class="uu" x="${mx}" y="${yb + 50}" text-anchor="middle">u</text>`;
		}
		return { s, X, k, y, end };
	}
	function arc(X, a, b, y, lab, cls = '') {
		const x1 = X(a), x2 = X(b), d = Math.sign(b - a), h = Math.min(44, Math.abs(x2 - x1) * 0.5);
		const mx = (x1 + x2) / 2, y0 = y - 16;
		return `<g class="arc ${cls}"><path pathLength="1" d="M${x1 + d * 6},${y0} Q${mx},${y0 - 2 * h} ${x2 - d * 8},${y0}" marker-end="url(#ah-${cls.includes('outarc') ? 'out' : 'acc'})"/>` +
			(lab ? `<text class="${lab.length > 3 ? 'arcw' : 'arcl'}" x="${mx}" y="${y0 - h - 10}">${lab}</text>` : '') + '</g>';
	}
	const MAP_ARROW = '<span class="mc" aria-hidden="true"><svg viewBox="0 0 48 24"><path d="M4,12 H38" marker-end="url(#ah-acc)"/></svg></span>';

	// ---------- aiuti di questa lezione ----------
	const c_ = m('<i>c</i>');
	// una riga di una catena di uguaglianze, con sotto il motivo del passaggio
	const CATENA = rows => `<div class="chain">${rows.map(([f, w]) => `<p>${m(f)}${w ? `<span class="why">${w}</span>` : ''}</p>`).join('')}</div>`;
	// l'esempio che vale come dimostrazione (esempio generico)
	const GEN = (nums, lets) => P(`Nell’esempio a destra abbiamo usato ${nums}, ma ogni passaggio si ripete uguale per qualunque ${lets}, quindi in questo caso l’esempio vale come dimostrazione.`);
	// formula centrata; con «|» si indica dove può andare a capo se manca spazio (zoom forte)
	const F = s => `<p class="formula">${m(s.split('|').map(g => `<span class="fg">${g}</span>`).join(' '))}</p>`;
	const bigf = s => `<p class="bigf">${m(s)}</p>`;
	const pw = (a, n) => `${a}<sup>${n}</sup>`;
	const dot = (R, n, c = 'dot') => `<circle class="${c}" cx="${R.X(n)}" cy="${R.y}" r="11"/>`;
	// bottoni per scegliere l'esempio (formule); cls(i) colora quello scelto
	const chips = (st, k, L, cls = () => 'sel') => `<div class="tray">${L.map((t, i) => `<button type="button" class="chip ${st[k] === i ? cls(i) : ''}" data-act="${k}" data-v="${i}" data-k="${k}${i}" aria-pressed="${st[k] === i}">${m(t)}</button>`).join('')}</div>`;
	// bottoni con parole (per righe / per colonne …)
	const tabs = (st, k, L) => `<div class="ctl">${L.map((t, i) => `<button type="button" class="btn" data-act="${k}" data-v="${i}" data-k="${k}${i}" aria-pressed="${st[k] === i}">${t}</button>`).join('')}</div>`;
	// scelta di un esempio: si ricorda quali sono stati visti (st.s.v0, st.s.v1 …)
	const pick = (st, a, v) => { st[a] = +v; st.s[a + v] = 1; };
	// graffa che distingue i casi (non indica un insieme): righe [valore, condizione]
	const cases = rows => `<span class="cs"><span class="cbr" aria-hidden="true"><svg viewBox="0 0 12 100" preserveAspectRatio="none"><path d="M11,1 C6,1 6,4 6,10 L6,42 C6,47 4,50 1,50 C4,50 6,53 6,58 L6,90 C6,96 6,99 11,99"/></svg></span>` +
		`<span class="cg">${rows.map(([v, c]) => `<span>${v}</span><span class="cc">${c}</span>`).join('')}</span></span>`;
	// graffa sotto: «b volte»
	const ub = (s, lab) => `<span class="ub"><span>${s}</span><span class="ubb" aria-hidden="true"><svg viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M1,1 C1,5 3,5 8,5 L44,5 C48,5 50,6 50,9 C50,6 52,5 56,5 L92,5 C97,5 99,5 99,1"/></svg></span><span class="ubl">${lab}</span></span>`;
	const MULT_C = cases([['0', 'se&nbsp;<i>b</i>&nbsp;=&nbsp;0'], [ub('<i>a</i> + <i>a</i> + ⋯ + <i>a</i>', '<i>b</i> volte'), 'se&nbsp;<i>b</i>&nbsp;&gt;&nbsp;0']]);
	const POW_C = cases([['1', 'se&nbsp;<i>n</i>&nbsp;=&nbsp;0 (con&nbsp;<i>a</i>&nbsp;≠&nbsp;0)'], [ub('<i>a</i> · <i>a</i> · ⋯ · <i>a</i>', '<i>n</i> volte'), 'se&nbsp;<i>n</i>&nbsp;&gt;&nbsp;0']]);

	// lettere in corsivo dentro i disegni
	const it = s => `<tspan class="it">${s}</tspan>`;
	const W_ = s => `<tspan class="w">${s}</tspan>`;   // parole nei disegni, con il carattere del testo
	// graffa orizzontale da x1 a x2; d = −1: punta in su, etichetta sopra; d = 1: in giù, etichetta sotto
	function brH(x1, x2, y, d, lab, cls = '') {
		const mx = (x1 + x2) / 2, h = 10 * d;
		return `<path class="brace ${cls}" d="M${x1},${y} q0,${h} 10,${h} L${mx - 10},${y + h} q10,0 10,${h} q0,${-h} 10,${-h} L${x2 - 10},${y + h} q10,0 10,${-h}"/>` +
			(lab ? `<text class="brl ${cls}" x="${mx}" y="${d < 0 ? y - 32 : y + 54}">${lab}</text>` : '');
	}
	// graffa verticale da y1 a y2; d = 1: punta a destra, d = −1: a sinistra; L = righe dell'etichetta
	function brV(x, y1, y2, d, L = [], cls = '') {
		const my = (y1 + y2) / 2, w = 10 * d, tx = x + 3 * w;
		return `<path class="brace ${cls}" d="M${x},${y1} q${w},0 ${w},10 L${x + w},${my - 10} q0,10 ${w},10 q${-w},0 ${-w},10 L${x + w},${y2 - 10} q0,10 ${-w},10"/>` +
			L.map((t, i) => `<text class="brl ${d > 0 ? 'st' : 'en'}${i ? ' sm' : ''} ${cls}" x="${tx}" y="${my + 11 + (i - (L.length - 1) / 2) * 36}">${t}</text>`).join('');
	}
	const pallini = (K, X, y) => K.map((c, i) => `<circle class="${c}" cx="${X(i)}" cy="${y}" r="17"/>`).join('');
	// rettangolo a quadretti: w colonne, h righe di lato u, angolo in alto a sinistra in (x, y); solo le linee
	function grid(x, y, w, h, u) {
		let s = '';
		for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) s += `<rect class="sq" x="${x + j * u}" y="${y + i * u}" width="${u}" height="${u}"/>`;
		return s + `<rect class="sqo" x="${x}" y="${y}" width="${w * u}" height="${h * u}"/>`;
	}
	// pallini a gruppi (HTML); k0: chiave del primo pallino, perché scivolino da un disegno all'altro
	const pt = (c, k) => `<span class="pt ${c}"${k ? ` data-flip="${k}"` : ''}></span>`;
	const grp = (n, c, cols, gc = '', k0 = null) => `<span class="grp ${gc}" style="--c:${cols}">${Array.from({ length: n }, (_, i) => pt(c, k0 == null ? '' : 'd' + (k0 + i))).join('')}</span>`;
	const groups = (k, c, n, cols, gc = '', k0 = null) => Array.from({ length: k }, (_, i) => grp(n, c, cols, gc, k0 == null ? null : k0 + i * n)).join('');

	// calcolo a mente: L = [[calcolo, [[passaggio, perché], …]], …]; le righe si scoprono una alla volta
	function calcView(st, L) {
		return `<div class="col"><div class="pair${L.length === 1 ? ' one' : ''}${L.wide ? ' wide' : ''}">${L.map(([first, rows], i) => {
			const p = st.p[i], done = p === rows.length;
			const lines = rows.slice(0, p).map(([f, w], j) => `<p class="${j === rows.length - 1 ? 'fin' : ''}${st.fresh && st.last === i && j === p - 1 && !reduced() ? ' seq' : ''}">${m('= ' + f)}${w ? `<span class="cw">${w}</span>` : ''}</p>`).join('');
			return `<div><div class="calc"><p class="c0">${m(first)}</p>${lines}</div>` +
				`<div class="ctl"><button type="button" class="btn pri big" data-act="inc" data-v="${i}" data-k="inc${i}" aria-label="passaggio successivo"${done ? ' disabled' : ''}>=</button>` +
				`<button type="button" class="btn" data-act="zero" data-v="${i}" data-k="zero${i}" aria-label="Ricomincia">↺</button></div></div>`;
		}).join('')}</div></div>`;
	}
	const calcAct = L => (st, a, v) => { const i = +v; st.last = i; if (a === 'inc' && st.p[i] < L[i][1].length) st.p[i]++; if (a === 'zero') st.p[i] = 0; };
	const calcDone = (st, L) => L.every(([, rows], i) => st.p[i] === rows.length);

	const C9 = [['4 · 17 · 25', [['(4 · 25) · 17', 'commutativa e associativa'], ['100 · 17', ''], ['1700', '']]],
		['38 + 45 + 62', [['(38 + 62) + 45', 'commutativa e associativa'], ['100 + 45', ''], ['145', '']]]];
	const C12 = [['7 · 102', [['7 · (100 + 2)', ''], ['7 · 100 + 7 · 2', 'distributiva'], ['700 + 14', ''], ['714', '']]],
		['13 · 99', [['13 · (100 − 1)', ''], ['13 · 100 − 13 · 1', 'distributiva'], ['1300 − 13', ''], ['1287', '']]]];
	const C16 = [['83 − 29', [['84 − 30', 'invariantiva: aggiungo 1 a tutti e due'], ['54', '']]],
		['52 − 17', [['50 − 15', 'invariantiva: tolgo 2 a tutti e due'], ['35', '']]]];
	// dimostrazioni con la definizione dell'operazione inversa (come in classe)
	const PR7 = [['(<i>a</i> · <i>b</i>) · <i>c</i>', [
		[`${ub('(<i>a</i> · <i>b</i>) + (<i>a</i> · <i>b</i>) + ⋯ + (<i>a</i> · <i>b</i>)', '<i>c</i> volte')}`, 'definizione di moltiplicazione'],
		[`${ub(`${ub('(<i>a</i> + ⋯ + <i>a</i>)', '<i>b</i> volte')} + ⋯ + ${ub('(<i>a</i> + ⋯ + <i>a</i>)', '<i>b</i> volte')}`, '<i>c</i> volte')}`, `definizione di moltiplicazione: ${m('<i>a</i> · <i>b</i>')} è ${m('<i>a</i>')} sommato ${m('<i>b</i>')} volte`],
		[`${ub('<i>a</i> + <i>a</i> + ⋯ + <i>a</i>', '<i>b</i> · <i>c</i> volte')}`, `associativa dell’addizione: tolgo le parentesi, ricordando che gli addendi sono in totale ${m('<i>b</i> · <i>c</i>')}`],
		['<i>a</i> · (<i>b</i> · <i>c</i>)', 'definizione di moltiplicazione']]]];
	PR7.wide = 1;
	const PR13 = [['(<i>a</i> : <i>c</i> + <i>b</i> : <i>c</i>) · <i>c</i>', [['(<i>a</i> : <i>c</i>) · <i>c</i> + (<i>b</i> : <i>c</i>) · <i>c</i>', 'commutativa e distributiva della moltiplicazione rispetto all’addizione'], ['<i>a</i> + <i>b</i>', `per la definizione di divisione, ${m('(<i>a</i> : <i>c</i>) · <i>c</i> = <i>a</i>')}`]]]];
	const PR15 = [['(<i>a</i> − <i>b</i>) + (<i>b</i> + <i>c</i>)', [['((<i>a</i> − <i>b</i>) + <i>b</i>) + <i>c</i>', 'associativa dell’addizione'], ['<i>a</i> + <i>c</i>', `per la definizione di sottrazione, ${m('(<i>a</i> − <i>b</i>) + <i>b</i> = <i>a</i>')}`]]]];
	const PR17 = [['(<i>a</i> : <i>b</i>) · (<i>b</i> · <i>c</i>)', [['((<i>a</i> : <i>b</i>) · <i>b</i>) · <i>c</i>', 'associativa della moltiplicazione'], ['<i>a</i> · <i>c</i>', `per la definizione di divisione, ${m('(<i>a</i> : <i>b</i>) · <i>b</i> = <i>a</i>')}`]]]];
	// catena di una dimostrazione nel testo: prima riga con il primo membro, poi «= …» con il motivo
	const PROOF = L => CATENA(L[0][1].map(([f, w], j) => [(j ? '= ' : L[0][0] + ' = ') + f, w]));
	const C19 = [['350 : 50', [['35 : 5', 'invariantiva: divido per 10 tutti e due'], ['7', '']]]];

	// rettangolo a × n con il taglio dopo b righe (distributiva); lato dei quadretti 60
	const RU = 60, RX = 190, RY = 70;
	const side = (y1, y2, L, cls = '') => brV(RX + 4 * RU + 14, y1, y2, 1, L, cls);

	// l'intervallo da b + c ad a + c sulla semiretta (invariantiva della sottrazione)
	function ivView(st) {
		const a = 8, b = 3, c = st.c, lo = b + c, hi = a + c, out = lo < 0, an = st.fresh && st.dl && !reduced();
		const R = ray({ n0: 0, n1: 12, x0: 150, x1: 890, end: 960, y: 250, cls: n => n === lo || n === hi ? 'sel' : '' });
		const X = R.X;
		const iv = (l, h, y, cls, lab, legs) => {
			const mx = (X(l) + X(h)) / 2, mk = `url(#ah-${cls === 'out' ? 'out' : 'acc'})`;
			return `<g class="iv ${cls}">` + (legs ? `<line class="ivd" x1="${X(l)}" y1="${R.y - 14}" x2="${X(l)}" y2="${y}"/><line class="ivd" x1="${X(h)}" y1="${R.y - 14}" x2="${X(h)}" y2="${y}"/>` : '') +
				`<path class="iva" d="M${mx},${y} H${X(h) - 3}" marker-end="${mk}"/><path class="iva" d="M${mx},${y} H${X(l) + 3}" marker-end="${mk}"/>` +
				`<text class="ivl" x="${mx}" y="${y - 16}">${lab}</text></g>`;
		};
		const lab = out ? `(8 − ${-c}) − (3 − ${-c})` : `${hi} − ${lo} = 5`;
		let g = R.s + (c ? iv(3, 8, 80, 'ghost', '8 − 3 = 5', false) : '');
		g += `<g class="${an ? 'slide' : ''}" style="--dx:${-st.dl * R.k}px">` + iv(lo, hi, R.y - 85, out ? 'out' : '', lab, true) +
			(out ? `<line class="ghostline" x1="${X(-1)}" y1="${R.y}" x2="${X(0) - 4}" y2="${R.y}"/><circle class="ring" cx="${X(-1)}" cy="${R.y}" r="11"/>` : `<circle class="pa" cx="${X(lo)}" cy="${R.y}" r="11"/>`) +
			`<circle class="pa" cx="${X(hi)}" cy="${R.y}" r="11"/></g>`;
		const M = c === 0 ? [`La distanza tra 3 e 8 è ${m('8 − 3 = 5')}.`, '']
			: out ? [`${m('3 − 4')} non esiste in ${NN}, quindi non si può togliere 4 a tutti e due.`, 'out']
			: c > 0 ? [`Aggiungo ${c} a tutti e due, ${m(`(8 + ${c}) − (3 + ${c}) = ${hi} − ${lo} = 5`)}.`, 'in']
			: [`Tolgo ${-c} a tutti e due, ${m(`(8 − ${-c}) − (3 − ${-c}) = ${hi} − ${lo} = 5`)}.`, 'in'];
		return fig(1000, 330, g, `semiretta da 0 a 12: l’intervallo da ${lo} a ${hi}`) +
			`<div class="ctl"><button type="button" class="btn pri big" data-act="l" data-k="l" aria-label="togli 1 a tutti e due"${c <= -4 ? ' disabled' : ''}>− 1</button>` +
			`<button type="button" class="btn pri big" data-act="r" data-k="r" aria-label="aggiungi 1 a tutti e due"${c >= 4 ? ' disabled' : ''}>+ 1</button>` +
			`<button type="button" class="btn" data-act="zero" data-k="zero" aria-label="Torna a 8 − 3">↺</button></div>` + msg(...M);
	}

	// ---------- i passi ----------
	const CH = ['Commutativa', 'Associativa', 'Distributiva', 'Invariantiva', 'Riepilogo'];
	const H1 = ['La commutativa', 'L’associativa', 'La distributiva', 'L’invariantiva', 'Riepilogo'];

	// sottrazione (o = 0) e divisione (o = 2) non commutative, sulla semiretta
	function ncView(st, o) {
		const i = o + st.i, an = st.fresh && !reduced() ? 'fresh' : '';
		const HL = [{ 7: 'sel', 4: 'okc' }, { 3: 'sel' }, { 8: 'okc' }, { 2: 'noc' }][i];
		const R = ray({ n0: 0, n1: 10, x0: 170, x1: 870, end: 960, y: 190, cls: n => HL[n] || '' });
		let g = R.s, M;
		if (i === 0) {
			for (let k = 0; k < 3; k++) g += arc(R.X, 7 - k, 6 - k, R.y, '−1', an);
			g += dot(R, 7) + `<circle class="ringin" cx="${R.X(4)}" cy="${R.y}" r="11"/>`;
			M = [`Da 7, tre passi indietro, ${m('7 − 3 = 4')}.`, 'in'];
		} else if (i === 1) {
			for (let k = 0; k < 3; k++) g += arc(R.X, 3 - k, 2 - k, R.y, '−1', an);
			g += `<line class="ghostline" x1="${R.X(-1)}" y1="${R.y}" x2="${R.X(0) - 4}" y2="${R.y}"/>` + arc(R.X, 0, -1, R.y, '−1', 'outarc') + `<circle class="ring" cx="${R.X(-1)}" cy="${R.y}" r="10"/>` + dot(R, 3);
			M = [`Da 3, dopo tre passi indietro siamo a 0, e 0 non ha precedente.<br>${m(`3 − 7 ∉ ${NN}`)}`, 'out'];
		} else if (i === 2) {
			for (let k = 0; k < 4; k++) g += arc(R.X, 2 * k, 2 * k + 2, R.y, '+2', an) + `<circle class="ringin" cx="${R.X(2 * k + 2)}" cy="${R.y}" r="11"/>`;
			M = [`Quattro salti da 2 arrivano a 8, ${m('8 : 2 = 4')}.`, 'in'];
		} else {
			g += arc(R.X, 0, 8, R.y, '+8', 'outarc') + `<circle class="ring" cx="${R.X(2)}" cy="${R.y}" r="10"/>`;
			M = [`Con zero salti da 8 si resta a 0, con uno si arriva già a 8.<br>${m(`2 : 8 ∉ ${NN}`)}`, 'out'];
		}
		return `<div class="col">${chips(st, 'i', o ? ['8 : 2', '2 : 8'] : ['7 − 3', '3 − 7'], k => k ? 'out' : 'in')}</div>` +
			fig(1000, 270, g, 'semiretta da 0 a 10') + msg(...M);
	}

	const STEPS = [
		// 1
		{ ch: 0, tag: 'ripasso', h1: 'Le operazioni in ℕ', title: `Le operazioni in ${NN}`,
			text: DL('Definizione (Addizione)', P(`Dati ${m(`<i>a</i>, <i>b</i> ∈ ${NN}`)}, ${m('<i>a</i> + <i>b</i>')} è il numero a cui si arriva partendo da ${m('<i>a</i>')} e passando al successivo ${m('<i>b</i>')} volte.`) +
					F('<i>a</i> → <i>a</i> + 1 → <i>a</i> + 2|→ ⋯ → <i>a</i> + <i>b</i>')) +
				DL('Definizione (Moltiplicazione)', P(`Dati ${m(`<i>a</i>, <i>b</i> ∈ ${NN}`)}:`) + F('<i>a</i> · <i>b</i> =|' + MULT_C)) +
				DL('Definizione (Sottrazione e divisione)', P(`${m('<i>a</i> − <i>b</i> = <i>x</i>')} vuol dire trovare ${m('<i>x</i>')} tale che ${m('<i>b</i> + <i>x</i> = <i>a</i>')}.`) +
					P(`${m('<i>a</i> : <i>b</i> = <i>q</i>')} vuol dire trovare ${m('<i>q</i>')} tale che ${m('<i>b</i> · <i>q</i> = <i>a</i>')}, con ${m('<i>b</i> ≠ 0')}.`)) +
				DL('Definizione (Potenza)', P(`Dati ${m(`<i>a</i>, <i>n</i> ∈ ${NN}`)}:`) + F('<i>a</i><sup><i>n</i></sup> =|' + POW_C)) +
				P('Ora vediamo quali proprietà hanno queste operazioni.') +
				P('E soprattutto perché valgono.'),
			view() {
				const card = (s, nm, ex, why = '') => `<div class="ic"><span class="os${s === '·' ? ' dot' : ''}">${s}</span><span class="inm">${nm}</span><span class="ex">${m(ex)}</span>${why ? `<span class="tg">${why}</span>` : ''}</div>`;
				const ar = '<div class="iar" aria-hidden="true"><svg viewBox="0 0 100 24"><path d="M50,12 H88" marker-end="url(#ah-acc)"/><path d="M50,12 H12" marker-end="url(#ah-acc)"/></svg>inversa</div>';
				return `<div class="col"><div class="invs">` +
					card('+', 'addizione', '3 + 4 = 7') + ar + card('−', 'sottrazione', '7 − 3 = 4', `perché ${m('3 + 4 = 7')}`) +
					card('·', 'moltiplicazione', '4 · 3 = 12', `perché ${m('4 + 4 + 4 = 12')}`) + ar + card(':', 'divisione', '12 : 3 = 4', `perché ${m('3 · 4 = 12')}`) +
					'</div></div>';
			}
		},
		// 2
		{ ch: 0, title: 'La proprietà commutativa dell’addizione',
			text: st => D(F(`<i>a</i> + <i>b</i> = <i>b</i> + <i>a</i>|&ensp;∀ <i>a</i>, <i>b</i> ∈ ${NN}`), 'Proprietà commutativa dell’addizione') +
				P(`Mettiamo in fila ${a_} pallini neri e ${b_} pallini bianchi, e contiamoli nei due versi.`) +
				(P(`Da sinistra si conta ${m('<i>a</i> + <i>b</i>')}, da destra ${m('<i>b</i> + <i>a</i>')}.`) + P('Sono gli stessi pallini.') +
						GEN('3 pallini neri e 5 bianchi', `${a_} e ${b_}`) +
					P(`<b>Quindi ${m('<i>a</i> + <i>b</i> = <i>b</i> + <i>a</i>')}.</b>`)),
			init: () => ({ d: null, s: {} }),
			view(st) {
				const K = ['pa', 'pa', 'pa', 'pb', 'pb', 'pb', 'pb', 'pb'], dx = 80, X = i => 340 - 3.5 * dx + i * dx, y = 120, an = st.fresh && !reduced();
				let g = pallini(K, X, y) + brH(X(0) - 20, X(2) + 20, y - 32, -1, it('a')) + brH(X(3) - 20, X(7) + 20, y - 32, -1, it('b'));
				if (st.d != null) {
					const L = st.d === 0;
					K.forEach((_, i) => { const n = L ? i + 1 : 8 - i; g += `<text class="cnt${an ? ' seq' : ''}" style="animation-delay:${(n - 1) * 0.12}s" x="${X(i)}" y="${y + 60}">${n}</text>`; });
					const xa = L ? X(0) - 20 : X(7) + 20, xb = L ? X(7) + 20 : X(0) - 20;
					g += `<g class="arc slow${an ? ' fresh' : ''}"><path pathLength="1" d="M${xa},${y + 88} L${xb},${y + 88}" marker-end="url(#ah-acc)"/></g>`;
				}
				const M = st.d == null ? '' : st.d === 0 ? `Da sinistra, ${m('<i>a</i> + <i>b</i> = 3 + 5 = 8')}.` : `Da destra, ${m('<i>b</i> + <i>a</i> = 5 + 3 = 8')}.`;
				return fig(680, 240, g, '3 pallini neri e 5 bianchi in fila', 'fit2') + tabs(st, 'd', ['da sinistra', 'da destra']) + msg(M, 'in');
			},
			act: pick
		},
		// 4
		{ ch: 0, title: 'La proprietà commutativa della moltiplicazione',
			text: st => D(F(`<i>a</i> · <i>b</i> = <i>b</i> · <i>a</i>|&ensp;∀ <i>a</i>, <i>b</i> ∈ ${NN}`), 'Proprietà commutativa della moltiplicazione') +
				P(`Contiamo in due modi i quadretti di un rettangolo di base ${a_} e altezza ${b_}.`) +
				(P(`Per righe sono ${b_} righe da ${a_}, cioè ${a_} sommato ${b_} volte, ${m('<i>a</i> · <i>b</i>')} (definizione di moltiplicazione).`)) +
				(P(`Per colonne sono ${a_} colonne da ${b_}, cioè ${b_} sommato ${a_} volte, ${m('<i>b</i> · <i>a</i>')} (definizione di moltiplicazione).`)) +
				(P('I quadretti sono gli stessi, contati in due modi.') + GEN('5 e 3', `${a_} e ${b_}`) +
					P(`Con lo 0 si ha ${m('<i>a</i> · 0 = 0 · <i>a</i> = 0')}, perché 0 è assorbente.`) +
					P(`<b>Quindi ${m(`<i>a</i> · <i>b</i> = <i>b</i> · <i>a</i>`)} per ogni ${m(`<i>a</i>, <i>b</i> ∈ ${NN}`)}.</b>`)),
			init: () => ({ v: null, s: {} }),
			view(st) {
				const a = 5, b = 3, u = 66, x = 160, y = 80, an = st.fresh && !reduced(), v = st.v;
				const seq = i => `class="${an ? 'seq' : ''}" style="animation-delay:${i * 0.3}s"`;
				let g = '';
				if (v === 0) for (let i = 0; i < b; i++) g += `<g ${seq(i)}><rect class="f${i % 2}" x="${x}" y="${y + i * u}" width="${a * u}" height="${u}"/><text class="cnt" x="${x + a * u + 36}" y="${y + i * u + u / 2 + 10}">${a}</text></g>`;
				if (v === 1) for (let j = 0; j < a; j++) g += `<g ${seq(j)}><rect class="f${j % 2}" x="${x + j * u}" y="${y}" width="${u}" height="${b * u}"/><text class="cnt" x="${x + j * u + u / 2}" y="${y + b * u + 40}">${b}</text></g>`;
				g += grid(x, y, a, b, u) + brH(x, x + a * u, y - 12, -1, `${it('a')} = 5`) + brV(x - 14, y, y + b * u, -1, [`${it('b')} = 3`]);
				const f = v === 0 ? '5 + 5 + 5 = 5 · 3 = 15' : v === 1 ? '3 + 3 + 3 + 3 + 3 = 3 · 5 = 15' : '';
				return fig(560, 340, g, 'rettangolo di 5 per 3 quadretti', 'fit4') + tabs(st, 'v', ['per righe', 'per colonne']) +
					(f ? bigf(f) : msg('')) + msg(st.s.v0 && st.s.v1 ? 'Per righe o per colonne, i quadretti sono sempre 15.' : '', 'in');
			},
			act: pick
		},
		// 3
		{ ch: 0, title: 'Le operazioni ripetute non ereditano le proprietà',
			text: st => P('La moltiplicazione è un’addizione ripetuta, ed è commutativa come l’addizione.') +
				P('Verrebbe da pensare che un’operazione definita come ripetuta erediti le proprietà dell’operazione che ripete.') +
				P('Non è così: la potenza è una moltiplicazione ripetuta, ma non è commutativa.') +
				P('<b>Quindi «è ripetuta, quindi eredita la proprietà» non è un ragionamento valido: ogni proprietà va dimostrata.</b>'),
			init: () => ({ v: 0, s: { v0: 1 } }),
			view(st) {
				const pot = st.v === 1;
				const C = pot ? [[`${m(pw(2, 3))}`, `${m('= 2 · 2 · 2 = 8')}`], [`${m(pw(3, 2))}`, `${m('= 3 · 3 = 9')}`]]
					: [[m('5 · 3'), m(`= ${ub('5 + 5 + 5', '3 volte')}`)], [m('3 · 5'), m(`= ${ub('3 + 3 + 3 + 3 + 3', '5 volte')}`)]];
				return `<div class="col">${tabs(st, 'v', ['moltiplicazione', 'potenza'])}<div class="cases2">${C.map(([a, b], i) => `<div class="c2${pot && i ? ' out' : ''}"><span class="ex">${a}</span><span class="ex">${b}</span></div>`).join('')}</div></div>` +
					msg(pot ? `${m(`${pw(2, 3)} = 8`)} e ${m(`${pw(3, 2)} = 9`)}, quindi la potenza non è commutativa.` : 'Due somme diverse, con lo stesso risultato: lo ha dimostrato il rettangolo.', pot ? 'out' : 'hl');
			},
			act: pick
		},
		// non commutative: sottrazione
		{ ch: 0, title: 'La sottrazione non è commutativa',
			text: st => D(P('La sottrazione non è commutativa.'), 'Proprietà') +
				P(`Ad esempio ${m('7 − 3 = 4')}, mentre ${m('3 − 7')} non esiste in ${NN}.`) +
				P('<b>Quindi basta un controesempio per dire che una proprietà non vale.</b>'),
			init: () => ({ i: 0, s: { i0: 1 } }),
			view: st => ncView(st, 0),
			act: pick
		},
		// non commutative: divisione
		{ ch: 0, title: 'La divisione non è commutativa',
			text: st => D(P('La divisione non è commutativa.'), 'Proprietà') +
				P(`Ad esempio ${m('8 : 2 = 4')}, mentre ${m('2 : 8')} non esiste in ${NN}.`) +
				P('<b>Quindi anche per la divisione basta un controesempio.</b>'),
			init: () => ({ i: 0, s: { i0: 1 } }),
			view: st => ncView(st, 2),
			act: pick
		},
		// non commutative: potenza
		{ ch: 0, title: 'La potenza non è commutativa',
			text: st => D(P('La potenza non è commutativa.'), 'Proprietà') +
				P(`Ad esempio ${m(pw(2, 3) + ' = 8')}, mentre ${m(pw(3, 2) + ' = 9')}.`) +
				P('Qui i due risultati esistono tutti e due, ma sono diversi.') +
				P('<b>Quindi la potenza non è commutativa: scambiando la base e l’esponente il risultato può cambiare.</b>'),
			init: () => ({}),
			view: () => `<div class="col"><div class="cases2"><div class="c2"><span class="ex">${m(pw(2, 3))}</span><span class="ex">${m('= 2 · 2 · 2 = 8')}</span></div>` +
				`<div class="c2 out"><span class="ex">${m(pw(3, 2))}</span><span class="ex">${m('= 3 · 3 = 9')}</span></div></div></div>` +
				msg(`${m(pw(2, 3) + ' ≠ ' + pw(3, 2))}, il risultato cambia.`, 'out')
		},
		// sottrazione e divisione: per la commutativa la definizione si legge nei due versi
		{ ch: 0, title: 'Due modi di leggere sottrazione e divisione',
			text: st => P(`Per la commutativa dell’addizione, ${m('<i>b</i> + <i>x</i> = <i>x</i> + <i>b</i>')}.`) +
				P(`<b>Quindi ${m('<i>a</i> − <i>b</i> = <i>x</i>')} vuol dire anche ${m('<i>x</i> + <i>b</i> = <i>a</i>')}.</b>`) +
				P(`Per la commutativa della moltiplicazione, ${m('<i>b</i> · <i>q</i> = <i>q</i> · <i>b</i>')}.`) +
				P(`<b>Quindi ${m('<i>a</i> : <i>b</i> = <i>q</i>')} vuol dire anche ${m('<i>q</i> · <i>b</i> = <i>a</i>')}, con ${m('<i>b</i> ≠ 0')}.</b>`) +
				P('Da qui in poi useremo la forma che serve.'),
			init: () => ({ v: null, s: {} }),

		// 7

				P('Ad esempio, passaggio per passaggio:') +
				CATENA([['(4 · 3) · 2 = (4 · 3) + (4 · 3)', `definizione di moltiplicazione: ${m('4 · 3')} sommato 2 volte`],

		// 10
		{ ch: 2, title: 'La proprietà distributiva della moltiplicazione rispetto all’addizione',
			text: st => D(F(`<i>a</i> · (<i>b</i> + <i>c</i>) = <i>a</i> · <i>b</i> + <i>a</i> · <i>c</i>|&ensp;∀ <i>a</i>, <i>b</i>, <i>c</i> ∈ ${NN}`), 'Proprietà distributiva della moltiplicazione rispetto all’addizione') +
				P(`Il rettangolo ha ${m('<i>b</i> + <i>c</i>')} righe da ${a_} quadretti, quindi ${m('<i>a</i> · (<i>b</i> + <i>c</i>)')} quadretti.`) +
				P(`Tagliato in due, i pezzi hanno ${b_} righe e ${c_} righe da ${a_}, cioè ${m('<i>a</i> · <i>b</i>')} e ${m('<i>a</i> · <i>c</i>')} quadretti.`) +
				(P('Dovunque si tagli, i due pezzi insieme fanno tutto il rettangolo.') + GEN(`${m('<i>a</i> = 4')} e ${m('<i>b</i> + <i>c</i> = 5')}`, `${a_}, ${b_} e ${c_}`) +
					P(`Il fattore ${a_} «si distribuisce» su tutti e due gli addendi.`) +
					P('È un modo di togliere le parentesi.') +
					P(`<b>Quindi ${m('<i>a</i> · (<i>b</i> + <i>c</i>) = <i>a</i> · <i>b</i> + <i>a</i> · <i>c</i>')}.</b>`)),
			init: () => ({ b: 3, moved: false }),
			view(st) {
				const a = 4, n = 5, b = st.b, c = n - b, x = RX, y = RY, u = RU, W = a * u;
				const g = `<rect class="f0" x="${x}" y="${y}" width="${W}" height="${b * u}"/><rect class="f1" x="${x}" y="${y + b * u}" width="${W}" height="${c * u}"/>` + grid(x, y, a, n, u) +
					`<line class="cut" x1="${x - 8}" y1="${y + b * u}" x2="${x + W + 8}" y2="${y + b * u}"/>` +
					brH(x, x + W, y - 12, -1, `${it('a')} = 4`) + brV(x - 14, y, y + n * u, -1, [`${it('b')} + ${it('c')} = 5`]) +
					side(y, y + b * u, [`${it('b')} = ${b}`, `${W_('area')} 4 · ${b} = ${4 * b}`]) + side(y + b * u, y + n * u, [`${it('c')} = ${c}`, `${W_('area')} 4 · ${c} = ${4 * c}`]);
				return fig(710, 400, g, `rettangolo di 4 per 5 quadretti, tagliato dopo ${b} righe`, 'fit10') +
					`<div class="ctl"><button type="button" class="btn big" data-act="up" data-k="up" aria-label="taglio più in alto"${b <= 1 ? ' disabled' : ''}>↑</button>` +
					`<button type="button" class="btn big" data-act="dn" data-k="dn" aria-label="taglio più in basso"${b >= 4 ? ' disabled' : ''}>↓</button></div>` +
					bigf(`4 · (${b} + ${c}) = 4 · ${b} + 4 · ${c}`) + msg(m(`20 = ${4 * b} + ${4 * c}`), 'in');

		// 11
		{ ch: 2, title: 'La proprietà distributiva della moltiplicazione rispetto alla sottrazione',
			text: st => D(F(`<i>a</i> · (<i>b</i> − <i>c</i>) = <i>a</i> · <i>b</i> − <i>a</i> · <i>c</i>|&ensp;∀ <i>a</i>, <i>b</i>, <i>c</i> ∈ ${NN} con <i>b</i> ≥ <i>c</i>`),'Proprietà distributiva della moltiplicazione rispetto alla sottrazione') +
				P(`Tutto il rettangolo ha ${b_} righe da ${a_} quadretti, cioè ${m('<i>a</i> · <i>b</i>')}.`) +
				P(`Togliamo una striscia di ${c_} righe, cioè ${m('<i>a</i> · <i>c</i>')} quadretti.`) +

					P(`<b>Quindi ${m('<i>a</i> · (<i>b</i> − <i>c</i>) = <i>a</i> · <i>b</i> − <i>a</i> · <i>c</i>')}.</b>`)),

				let g = t ? `<rect class="f0" x="${x}" y="${y}" width="${W}" height="${(b - c) * u}"/><rect class="fx${an}" x="${x}" y="${yc}" width="${W}" height="${c * u}"/>`

					`<line class="cut" x1="${x - 8}" y1="${yc}" x2="${x + W + 8}" y2="${yc}"/>` +
					side(y, yc, [`${it('b')} − ${it('c')} = 3`, `${W_('resta')} 4 · 3 = 12`]) + side(yc, y + b * u, [`${it('c')} = 2`, `${W_('tolgo')} 4 · 2 = 8`])
					: side(y, y + b * u, [`${W_('area')} 4 · 5 = 20`]);
				return fig(710, 400, g, t ? 'rettangolo di 4 per 5 quadretti, tolta una striscia di 4 per 2' : 'rettangolo di 4 per 5 quadretti', 'fit11') +
					`<div class="ctl"><button type="button" class="btn pri big" data-act="t" data-k="t"${t ? ' disabled' : ''}>${m('− 4 · 2')}</button><button type="button" class="btn" data-act="zero" data-k="zero" aria-label="Rimetti la striscia">↺</button></div>` +
