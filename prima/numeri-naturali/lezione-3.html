		},
		// 12
		{ ch: 2, title: 'I calcoli a mente con la distributiva',
			text: st => P('Con la distributiva si spezza un fattore in 100 più o meno qualcosa.') +
				P('Così il prodotto si fa a mente.') +
				(P('<b>Quindi la distributiva trasforma un prodotto difficile in due prodotti facili.</b>')),
			init: () => ({ p: C12.map(() => 0) }),
			view: st => calcView(st, C12),
			act: calcAct(C12)
		},
		// 13
		{ ch: 2, title: 'La proprietà distributiva della divisione rispetto all’addizione e alla sottrazione',
			text: st => D(P(`Per ogni ${m(`<i>a</i>, <i>b</i>, <i>c</i> ∈ ${NN}`)}, con ${m('<i>c</i> ≠ 0')} e divisioni esatte, si ha`) + F('(<i>a</i> + <i>b</i>) : <i>c</i> = <i>a</i> : <i>c</i> + <i>b</i> : <i>c</i>') + F('(<i>a</i> − <i>b</i>) : <i>c</i> = <i>a</i> : <i>c</i> − <i>b</i> : <i>c</i>|&ensp;se <i>a</i> ≥ <i>b</i>'),
					'Proprietà distributiva della divisione rispetto all’addizione e alla sottrazione') +

		// 13 bis
		{ ch: 2, title: 'La dimostrazione della distributiva della divisione',
			text: st => P(`Vogliamo dimostrare che ${m('(<i>a</i> + <i>b</i>) : <i>c</i> = <i>a</i> : <i>c</i> + <i>b</i> : <i>c</i>')}, con ${m('<i>c</i> ≠ 0')} e divisioni esatte.`) +
				P(`Per la definizione di divisione basta verificare che ${m('(<i>a</i> : <i>c</i> + <i>b</i> : <i>c</i>) · <i>c</i> = <i>a</i> + <i>b</i>')}.`) +
				P('Partiamo dal primo membro e cerchiamo di ricavare il secondo usando solo le proprietà già dimostrate.') +
				PROOF(PR13) +
				(P(`<b>Quindi ${m('(<i>a</i> + <i>b</i>) : <i>c</i> = <i>a</i> : <i>c</i> + <i>b</i> : <i>c</i>')}.</b>`) + P(`Per ${m('(<i>a</i> − <i>b</i>) : <i>c</i> = <i>a</i> : <i>c</i> − <i>b</i> : <i>c</i>')}, con ${m('<i>a</i> ≥ <i>b</i>')}, la dimostrazione è simile.`)),
			init: () => ({}),
			view: () => `<div class="col uso"><p class="usoh">Che cosa usiamo</p>${D(P(`${m('<i>a</i> : <i>b</i> = <i>q</i>')} vuol dire ${m('<i>q</i> · <i>b</i> = <i>a</i>')}, con ${m('<i>b</i> ≠ 0')}.`), 'Definizione (Divisione)')}${D(F('<i>a</i> · <i>b</i> = <i>b</i> · <i>a</i>'), 'Proprietà commutativa della moltiplicazione')}${D(F('<i>a</i> · (<i>b</i> + <i>c</i>) = <i>a</i> · <i>b</i> + <i>a</i> · <i>c</i>'), 'Proprietà distributiva della moltiplicazione')}</div>`
		},
		// 15
		{ ch: 3, title: 'La proprietà invariantiva della sottrazione',
			text: st => D(F(`<i>a</i> − <i>b</i> = (<i>a</i> + <i>c</i>) − (<i>b</i> + <i>c</i>)|&ensp;∀ <i>a</i>, <i>b</i>, <i>c</i> ∈ ${NN} con <i>a</i> ≥ <i>b</i>`) +
					F('<i>a</i> − <i>b</i> = (<i>a</i> − <i>c</i>) − (<i>b</i> − <i>c</i>)|&ensp;se <i>c</i> ≤ <i>b</i>'), 'Proprietà invariantiva della sottrazione') +
				P(`Ad esempio ${m('8 − 3 = 5')} è la distanza tra 3 e 8 sulla semiretta.`) +
				P('Se spostiamo tutti e due i numeri dello stesso passo, la distanza resta 5.') +
				(P(`Ma spostando 3 a sinistra di 4 si uscirebbe da ${NN}.`) +
					P(`<b>Quindi, aggiungendo lo stesso numero ai due termini, la differenza non cambia, mentre per toglierlo deve valere ${m('<i>c</i> ≤ <i>b</i>')}.</b>`)),
			init: () => ({ c: 0, dl: 0, sp: 0, so: 0 }),
			view: ivView,
			act(st, a) {
				const c0 = st.c;

				if (a === 'zero') st.c = 0;
				st.dl = a === 'zero' ? 0 : st.c - c0;
				if (st.c > 0) st.sp = 1;
				if (st.c < -3) st.so = 1;
			}
		},
		// 15 bis
		{ ch: 3, title: 'La dimostrazione dell’invariantiva della sottrazione',
			text: st => P(`Vogliamo dimostrare che ${m('(<i>a</i> + <i>c</i>) − (<i>b</i> + <i>c</i>) = <i>a</i> − <i>b</i>')}, con ${m('<i>a</i> ≥ <i>b</i>')}.`) +
				P(`Per la definizione di sottrazione basta verificare che ${m('(<i>a</i> − <i>b</i>) + (<i>b</i> + <i>c</i>) = <i>a</i> + <i>c</i>')}.`) +
				P('Partiamo dal primo membro e cerchiamo di ricavare il secondo usando solo le proprietà già dimostrate.') +

	function refresh() {

			const p = snap[e.dataset.flip]; if (!p) return;

			if (Math.abs(dx) + Math.abs(dy) > 1) e.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.3,.7,.3,1)' });
		});

	// il link compare nell'intestazione dell'ultimo riepilogo ----------
	if (location.protocol.startsWith('http')) $('homeBtn').hidden = false;   // sul sito si torna all'elenco delle lezioni; da file no
	const ln = /lezione-(\d+)(?:\.html)?$/.exec(location.pathname);
	if (ln && location.protocol.startsWith('http')) {
		const url = location.pathname.replace(/lezione-\d+(?:\.html)?$/, `lezione-${+ln[1] + 1}.html`);
		fetch(url, { method: 'HEAD', cache: 'no-store' })
			.then(r => { if (r.ok) { nextLesson = url; renderLeft(); } })
			.catch(() => {});
	}
	go(fromHash() ?? 0);
})();
</script>
</body>
</html>
